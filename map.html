<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뚜쫑 방방콕콕 여행 지도 🗺️</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#8ba4b6" />

  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:world-map.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:world-map.svg" />

  <!-- FontAwesome & 폰트 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- D3.js & TopoJSON -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --sea-bg: #8ba4b6;        /* 종이 지도 바다색 */
      --land-base: #ffffff;     /* 색칠 전 하얀 종이 */
      --land-border: #808e9b;   /* 연필 드로잉 경계선 */
      --colored: #ffb8c6;       /* 🌸 감성적인 연한 핑크 */
      --colored-text: #b33939;  /* 핑크 배경 위 짙은 텍스트 */
      --primary: #ff758c;
      --card-bg: #ffffff;
      --text: #2f3542;
      --border: #f1f2f6;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f5f6fa; color: var(--text); padding-bottom: 90px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #748da6 0%, #9cb4cc 100%);
      color: white;
      padding: 18px 18px 16px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 6px 20px rgba(116, 141, 166, 0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.2);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.35rem; font-weight: 900; font-family: 'Gaegu', cursive; }

    /* 상단 2개 탭 바 */
    .tab-bar {
      display: flex;
      gap: 6px;
      background: white;
      padding: 6px;
      border-radius: 16px;
      margin: 14px 16px 8px;
      box-shadow: var(--shadow);
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 4px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #747d8c;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 6px 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 대시보드 */
    .stat-card {
      background: white;
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stat-header { display: flex; justify-content: space-between; align-items: center; }
    .stat-title { font-size: 0.88rem; font-weight: 800; color: #2f3542; display: flex; align-items: center; gap: 6px; }
    .stat-badge {
      background: #fff0f3;
      color: #ff5e7e;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 800;
    }
    .progress-track {
      width: 100%;
      height: 9px;
      background: #f1f2f6;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff9a9e, #fecfef);
      width: 0%;
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-desc-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #747d8c;
      font-weight: 700;
    }

    /* 🗺️ 종이 지도 프레임 */
    .map-frame {
      background-color: var(--sea-bg);
      border-radius: 24px;
      padding: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      border: 3px solid #ffffff;
      touch-action: pan-x pan-y pinch-zoom;
    }
    
    .map-header-tag {
      position: absolute;
      top: 14px;
      left: 16px;
      background: rgba(255, 255, 255, 0.92);
      padding: 4px 12px;
      border-radius: 12px;
      font-family: 'Gaegu', cursive;
      font-size: 1.05rem;
      font-weight: 700;
      color: #2f3542;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      pointer-events: none;
      z-index: 10;
    }

    .map-controls {
      position: absolute;
      right: 14px;
      top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .btn-ctrl {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      border: none;
      color: #2f3542;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-ctrl:active { background: #e4e7ea; }

    #map-svg {
      width: 100%;
      height: 530px;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    #map-svg:active { cursor: grabbing; }

    /* 시군구 벡터 스타일 */
    .district {
      fill: var(--land-base);
      stroke: var(--land-border);
      stroke-width: 0.55;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: fill 0.2s ease;
      cursor: pointer;
    }
    .district:hover { fill: #fff5f7; }
    
    /* 🌸 연한 핑크 색칠 */
    .district.visited {
      fill: var(--colored) !important;
    }

    /* 🏷️ 종이 지도 2글자 라벨 */
    .district-label {
      font-family: 'Gaegu', cursive;
      font-size: 3.4px;
      font-weight: 700;
      fill: #4b6584;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none !important;
      user-select: none;
      paint-order: stroke fill;
      stroke: rgba(255, 255, 255, 0.85);
      stroke-width: 0.6px;
      stroke-linejoin: round;
    }
    .district-label.visited-label {
      fill: #ffffff !important;
      stroke: var(--colored-text) !important;
      stroke-width: 0.6px;
    }

    /* 로딩 */
    .map-loading {
      position: absolute;
      inset: 0;
      background: rgba(139, 164, 182, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      color: white;
      z-index: 20;
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(47, 53, 66, 0.9);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 9999;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 📖 기록 탭 피드 스타일 */
    .diary-list { display: flex; flex-direction: column; gap: 14px; }
    .diary-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .diary-card-header {
      padding: 12px 16px;
      background: #fffafa;
      border-bottom: 1px solid #f8f0f2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .diary-region { font-size: 1rem; font-weight: 900; color: #ff5e7e; display: flex; align-items: center; gap: 5px; }
    .diary-date { font-size: 0.78rem; font-weight: 700; color: #a4b0be; }
    .diary-card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .diary-img { width: 100%; border-radius: 12px; max-height: 240px; object-fit: cover; }
    .diary-memo { font-size: 0.88rem; color: #2f3542; line-height: 1.45; font-weight: 600; }
    .btn-del-diary { background: none; border: none; color: #ced6e0; cursor: pointer; font-size: 0.9rem; }
    .btn-del-diary:hover { color: #ff4757; }

    /* FAB 기록 추가 버튼 */
    .fab {
      position: fixed; right: 20px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
      background: var(--primary); color: white; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; box-shadow: 0 8px 24px rgba(255, 117, 140, 0.4); cursor: pointer; border: none; z-index: 50;
    }

    /* 다이어리 등록 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white; border-radius: 24px; width: 100%; max-width: 380px; padding: 22px;
      animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes modalPop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #747d8c; margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #eef0f4;
      font-size: 0.92rem; font-weight: 700; outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .btn-modal-row { display: flex; gap: 8px; margin-top: 16px; }
    .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 0.92rem; font-weight: 800; cursor: pointer; }
    .btn-save { background: var(--primary); color: white; }
    .btn-cancel { background: #f1f2f6; color: #57606f; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <a href="index.html" class="btn-home" title="홈으로"><i class="fa-solid fa-arrow-left"></i></a>
        <div>
          <div class="header-title">뚜쫑 방방콕콕 대한민국 🗺️</div>
        </div>
      </div>
    </div>
  </header>

  <!-- 2개 메인 탭 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tab-map', this)"><i class="fa-solid fa-map-location-dot"></i> 대한민국 지도</button>
    <button class="tab-btn" onclick="switchTab('tab-diary', this)"><i class="fa-solid fa-book-bookmark"></i> 여행 기록</button>
  </div>

  <div class="container">
    <!-- 탭 1: 지도 페이지 -->
    <div id="tab-map" class="tab-content active">
      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-title"><i class="fa-solid fa-heart" style="color:#ff758c;"></i> 전국 핑크빛 발자국</div>
          <div class="stat-badge" id="badgeRate">0.0% 완성</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
        <div class="stat-desc-row">
          <span>색칠한 지역: <b id="txtCount" style="color:#ff5e7e;">0</b>곳</span>
          <span>전국 시·군·구: <b>250</b>개 구역</span>
        </div>
      </div>

      <!-- 🗺️ 종이 지도 프레임 -->
      <div class="map-frame">
        <div class="map-header-tag">💡 지역을 <b>터치</b>하면 즉시 색칠돼요!</div>

        <div class="map-loading" id="mapLoading">
          <i class="fa-solid fa-spinner fa-spin" style="font-size:1.8rem;"></i>
          <span>지도 그리는 중...</span>
        </div>

        <div class="map-controls">
          <button class="btn-ctrl" onclick="zoomIn()" title="확대"><i class="fa-solid fa-plus"></i></button>
          <button class="btn-ctrl" onclick="zoomOut()" title="축소"><i class="fa-solid fa-minus"></i></button>
          <button class="btn-ctrl" onclick="resetZoom()" title="초기화"><i class="fa-solid fa-rotate-right"></i></button>
        </div>

        <svg id="map-svg"></svg>
      </div>
    </div>

    <!-- 탭 2: 여행 기록 피드 -->
    <div id="tab-diary" class="tab-content">
      <div id="diaryListContainer" class="diary-list">
        <!-- 기록 카드 렌더링 -->
      </div>
      <button class="fab" onclick="openAddDiaryModal()"><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  <!-- 다이어리 등록 모달 -->
  <div class="modal-overlay" id="diaryModal" onclick="closeDiaryModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 style="font-size:1.15rem; font-weight:900; margin-bottom:14px; color:#2f3542;">📸 여행 추억 기록</h3>

      <div class="form-group">
        <label>방문 지역 (시/군/구)</label>
        <select class="form-control" id="diarySelectRegion">
          <option value="">색칠된 지역 선택</option>
        </select>
      </div>

      <div class="form-group">
        <label>여행 날짜</label>
        <input type="date" class="form-control" id="diaryDate">
      </div>

      <div class="form-group">
        <label>사진 URL (선택)</label>
        <input type="url" class="form-control" id="diaryPhoto" placeholder="https://... 이미지 링크">
      </div>

      <div class="form-group">
        <label>추억 한줄 메모 📝</label>
        <textarea class="form-control" id="diaryMemo" rows="3" placeholder="예: 바다 보고 순두부 젤라또 먹은 날!"></textarea>
      </div>

      <div class="btn-modal-row">
        <button class="btn btn-cancel" onclick="closeDiaryModal()">취소</button>
        <button class="btn btn-save" onclick="saveDiaryRecord()">기록 저장 💖</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">알림</div>

  <script>
    // Firebase Firestore 설정
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const mapCollection = db.collection("couple_space").doc("data").collection("travel_map");
    const diaryCollection = db.collection("couple_space").doc("data").collection("travel_diaries");

    let visitedMap = {};
    let diaryList = [];
    let svg, g, pathGroup, labelGroup, zoomBehavior, pathGenerator;
    const TOTAL_DISTRICTS = 250;

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function showToast(msg) {
      const t = document.getElementById("toastMsg");
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }

    // 🏷️ 종이 지도 2~3글자 축약 헬퍼
    function formatMapLabel(props) {
      if (!props) return "";
      let name = props.name || props.name_kor || props.NAME || props.SIG_KOR_NM || "";
      if (name.includes(" ")) name = name.split(" ").pop();
      if (name.length > 2) {
        if (name.endsWith("시") || name.endsWith("군") || name.endsWith("구")) {
          name = name.slice(0, -1);
        }
      }
      return name;
    }

    function getFullName(props) {
      return props.name || props.name_kor || props.NAME || props.SIG_KOR_NM || "지역";
    }

    // 1. 지도 초기화
    async function initMap() {
      const width = document.querySelector('.map-frame').clientWidth - 16;
      const height = 530;

      svg = d3.select("#map-svg").attr("viewBox", `0 0 ${width} ${height}`);
      g = svg.append("g");
      pathGroup = g.append("g").attr("class", "paths-layer");
      labelGroup = g.append("g").attr("class", "labels-layer");

      const projection = d3.geoMercator()
        .center([127.8, 35.9])
        .scale(height * 7.5)
        .translate([width / 2, height / 2]);

      pathGenerator = d3.geoPath().projection(projection);

      // 줌 설정 (더블클릭/더블탭 확대 기능 비활성화)
      zoomBehavior = d3.zoom()
        .scaleExtent([1, 14])
        .on("zoom", (e) => {
          g.attr("transform", e.transform);
          const dynamicSize = Math.max(1.8, 3.4 / Math.sqrt(e.transform.k));
          labelGroup.selectAll(".district-label")
            .style("font-size", `${dynamicSize}px`)
            .style("stroke-width", `${dynamicSize * 0.18}px`);
        });

      svg.call(zoomBehavior).on("dblclick.zoom", null); // 🚫 더블클릭 확대 원천 차단

      try {
        const res = await fetch("https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-topo-simple.json");
        const topoData = await res.json();
        const geojson = topojson.feature(topoData, topoData.objects.skorea_municipalities_2018_geo);

        // 1) 시군구 폴리곤 (1번 클릭/터치 시 즉시 토글)
        pathGroup.selectAll("path")
          .data(geojson.features)
          .enter()
          .append("path")
          .attr("class", "district")
          .attr("d", pathGenerator)
          .attr("id", d => `d-${d.properties.code || d.id}`)
          .on("click", (e, d) => onSingleTouch(d.properties, d.id));

        // 2) 2글자 라벨
        labelGroup.selectAll("text")
          .data(geojson.features)
          .enter()
          .append("text")
          .attr("class", "district-label")
          .attr("id", d => `lbl-${d.properties.code || d.id}`)
          .attr("transform", d => {
            const centroid = pathGenerator.centroid(d);
            return isNaN(centroid[0]) ? "translate(-100,-100)" : `translate(${centroid[0]}, ${centroid[1]})`;
          })
          .text(d => formatMapLabel(d.properties));

        document.getElementById("mapLoading").style.display = "none";
        listenFirestore();
      } catch (err) {
        console.error("지도 로드 에러:", err);
      }
    }

    // 2. ⚡ 1번 터치로 즉시 색칠 / 취소 토글
    function onSingleTouch(prop, id) {
      const code = String(prop.code || id);
      const fullName = getFullName(prop);
      toggleColor(code, fullName);
    }

    function toggleColor(code, name) {
      const isColored = Boolean(visitedMap[code]);

      if (isColored) {
        mapCollection.doc(code).delete().then(() => {
          showToast(`'${name}' 색칠 취소 ⚪`);
        });
      } else {
        mapCollection.doc(code).set({
          name: name,
          updatedAt: Date.now()
        }).then(() => {
          showToast(`'${name}' 핑크빛 색칠 완료! 🌸`);
        });
      }
    }

    // 3. Firestore 리스너 (지도 색칠 & 다이어리)
    function listenFirestore() {
      // 지도 색칠 리스너
      mapCollection.onSnapshot(snapshot => {
        visitedMap = {};
        let count = 0;
        const selectBox = document.getElementById("diarySelectRegion");
        selectBox.innerHTML = `<option value="">색칠된 지역 선택</option>`;

        snapshot.forEach(doc => {
          const data = doc.data();
          visitedMap[doc.id] = data;
          count++;

          // 기록 모달 셀렉트박스에 추가
          const opt = document.createElement("option");
          opt.value = data.name || doc.id;
          opt.innerText = data.name || doc.id;
          selectBox.appendChild(opt);
        });

        d3.selectAll(".district")
          .classed("visited", d => Boolean(visitedMap[String(d.properties.code || d.id)]));

        d3.selectAll(".district-label")
          .classed("visited-label", d => Boolean(visitedMap[String(d.properties.code || d.id)]));

        const rate = ((count / TOTAL_DISTRICTS) * 100).toFixed(1);
        document.getElementById("txtCount").innerText = count;
        document.getElementById("badgeRate").innerText = `${rate}% 완성`;
        document.getElementById("progressBar").style.width = `${Math.min(rate, 100)}%`;
      });

      // 다이어리 피드 리스너
      diaryCollection.orderBy("date", "desc").onSnapshot(snapshot => {
        diaryList = [];
        snapshot.forEach(doc => diaryList.push({ id: doc.id, ...doc.data() }));
        renderDiaryList();
      });
    }

    // 4. 여행 기록 피드 렌더링
    function renderDiaryList() {
      const container = document.getElementById("diaryListContainer");
      if (diaryList.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:50px 10px; color:#a4b0be; font-weight:700; font-size:0.9rem;">
            아직 등록된 여행 기록이 없습니다.<br>+ 버튼을 눌러 소중한 추억을 남겨보세요! 📸
          </div>
        `;
        return;
      }

      container.innerHTML = diaryList.map(d => `
        <div class="diary-card">
          <div class="diary-card-header">
            <span class="diary-region"><i class="fa-solid fa-location-dot"></i> ${d.region}</span>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="diary-date">📅 ${d.date || '-'}</span>
              <button class="btn-del-diary" onclick="deleteDiary('${d.id}')"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div class="diary-card-body">
            ${d.photoUrl ? `<img src="${d.photoUrl}" class="diary-img" alt="여행 사진" onerror="this.style.display='none'">` : ''}
            <div class="diary-memo">${d.memo || ''}</div>
          </div>
        </div>
      `).join('');
    }

    function openAddDiaryModal() {
      document.getElementById("diaryDate").value = new Date().toISOString().split("T")[0];
      document.getElementById("diaryPhoto").value = "";
      document.getElementById("diaryMemo").value = "";
      document.getElementById("diaryModal").classList.add("active");
    }

    function closeDiaryModal() {
      document.getElementById("diaryModal").classList.remove("active");
    }

    function saveDiaryRecord() {
      const region = document.getElementById("diarySelectRegion").value;
      const date = document.getElementById("diaryDate").value;
      const photoUrl = document.getElementById("diaryPhoto").value.trim();
      const memo = document.getElementById("diaryMemo").value.trim();

      if (!region) return alert("여행한 지역을 선택해주세요!");

      diaryCollection.doc(String(Date.now())).set({
        region, date, photoUrl, memo, createdAt: Date.now()
      }).then(() => {
        closeDiaryModal();
        showToast("여행 기록이 저장되었습니다! 💖");
      });
    }

    function deleteDiary(id) {
      if (confirm("이 여행 기록을 삭제할까요?")) {
        diaryCollection.doc(id).delete();
      }
    }

    function zoomIn() { svg.transition().duration(250).call(zoomBehavior.scaleBy, 1.6); }
    function zoomOut() { svg.transition().duration(250).call(zoomBehavior.scaleBy, 0.6); }
    function resetZoom() { svg.transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity); }

    window.addEventListener("DOMContentLoaded", initMap);
  </script>
</body>
</html>
