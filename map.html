<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뚜쫑 방방콕콕 대한민국 🗺️</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#748DA6" />

  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:world-map.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:world-map.svg" />

  <!-- FontAwesome & Pretendard / 교보손글씨 감성 폰트 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- D3.js & TopoJSON -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --sea-bg: #8ba4b6;        /* 종이 지도 바다색 */
      --land-base: #ffffff;     /* 색칠 전 하얀 종이 */
      --land-border: #808e9b;   /* 연필 드로잉 경계선 */
      --colored: #7d9d8b;       /* 방방콕콕 특유의 쑥빛 올리브 그린 */
      --colored-text: #1e372e;
      --card-bg: #ffffff;
      --text: #2f3542;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f1f3f6; color: var(--text); padding-bottom: 40px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #576574 0%, #8395a7 100%);
      color: white;
      padding: 18px 18px 16px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 6px 20px rgba(87, 101, 116, 0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.18);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.25rem; font-weight: 900; font-family: 'Gaegu', cursive; font-size: 1.45rem; letter-spacing: 0.5px; }

    .container { max-width: 540px; margin: 0 auto; padding: 12px 16px; }

    /* 대시보드 */
    .stat-card {
      background: white;
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stat-header { display: flex; justify-content: space-between; align-items: center; }
    .stat-title { font-size: 0.95rem; font-weight: 800; color: #2f3542; display: flex; align-items: center; gap: 6px; }
    .stat-badge {
      background: #e4ece7;
      color: #3b5a48;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
    }
    .progress-track {
      width: 100%;
      height: 10px;
      background: #f1f2f6;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #95afc0, #7d9d8b);
      width: 0%;
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-desc-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #747d8c;
      font-weight: 700;
    }

    /* 🗺️ 종이 지도 캔버스 프레임 */
    .map-frame {
      background-color: var(--sea-bg);
      border-radius: 24px;
      padding: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      border: 3px solid #ffffff;
      touch-action: pan-x pan-y pinch-zoom;
    }
    
    .map-header-tag {
      position: absolute;
      top: 14px;
      left: 16px;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 12px;
      border-radius: 12px;
      font-family: 'Gaegu', cursive;
      font-size: 1.15rem;
      font-weight: 700;
      color: #2f3542;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      pointer-events: none;
      z-index: 10;
    }

    .map-controls {
      position: absolute;
      right: 14px;
      top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .btn-ctrl {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      border: none;
      color: #2f3542;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-ctrl:active { background: #e4e7ea; }

    #map-svg {
      width: 100%;
      height: 540px;
      display: block;
      cursor: grab;
    }
    #map-svg:active { cursor: grabbing; }

    /* 시군구 벡터 스타일 */
    .district {
      fill: var(--land-base);
      stroke: var(--land-border);
      stroke-width: 0.55;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: fill 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }
    .district:hover {
      fill: #f5f6fa;
    }
    /* 색칠된 지역 (수채화 톤) */
    .district.visited {
      fill: var(--colored) !important;
    }
    .district.visited:hover {
      fill: #6d8d7b !important;
    }

    /* 🏷️ 종이 지도 폰트 라벨 */
    .district-label {
      font-family: 'Gaegu', cursive;
      font-size: 3.4px;
      font-weight: 700;
      fill: #4b6584;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none !important;
      user-select: none;
      paint-order: stroke fill;
      stroke: rgba(255, 255, 255, 0.85);
      stroke-width: 0.6px;
      stroke-linejoin: round;
    }
    .district-label.visited-label {
      fill: #ffffff !important;
      stroke: var(--colored-text) !important;
      stroke-width: 0.6px;
    }

    /* 로딩 */
    .map-loading {
      position: absolute;
      inset: 0;
      background: rgba(139, 164, 182, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      color: white;
      z-index: 20;
    }

    /* 다이어리 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      padding: 22px;
      animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes modalPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-title { font-size: 1.2rem; font-weight: 900; color: #2f3542; }
    .btn-close-modal { background: none; border: none; font-size: 1.2rem; color: #a4b0be; cursor: pointer; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #747d8c; margin-bottom: 4px; }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid #eef0f4;
      font-size: 0.92rem;
      font-weight: 700;
      outline: none;
    }
    .form-control:focus { border-color: var(--colored); }

    .btn-modal-row { display: flex; gap: 8px; margin-top: 16px; }
    .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 0.92rem; font-weight: 800; cursor: pointer; }
    .btn-save { background: var(--colored); color: white; }
    .btn-uncolor { background: #f1f2f6; color: #57606f; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <a href="index.html" class="btn-home" title="홈으로"><i class="fa-solid fa-arrow-left"></i></a>
        <div>
          <div class="header-title">뚜쫑 방방콕콕 대한민국 🗺️</div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="stat-card">
      <div class="stat-header">
        <div class="stat-title"><i class="fa-solid fa-paintbrush" style="color:#7d9d8b;"></i> 전국 정복 현황</div>
        <div class="stat-badge" id="badgeRate">0.0% 완성</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div class="stat-desc-row">
        <span>색칠한 지역: <b id="txtCount" style="color:#3b5a48;">0</b>곳</span>
        <span>전국 시·군·구: <b>250</b>개 구역</span>
      </div>
    </div>

    <!-- 🗺️ 종이 지도 뷰포트 -->
    <div class="map-frame">
      <div class="map-header-tag">✨ 방방콕콕 여행지도</div>

      <div class="map-loading" id="mapLoading">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:1.8rem;"></i>
        <span>지도 그리는 중...</span>
      </div>

      <div class="map-controls">
        <button class="btn-ctrl" onclick="zoomIn()" title="확대"><i class="fa-solid fa-plus"></i></button>
        <button class="btn-ctrl" onclick="zoomOut()" title="축소"><i class="fa-solid fa-minus"></i></button>
        <button class="btn-ctrl" onclick="resetZoom()" title="초기화"><i class="fa-solid fa-rotate-right"></i></button>
      </div>

      <svg id="map-svg"></svg>
    </div>
  </div>

  <!-- 모달 -->
  <div class="modal-overlay" id="diaryModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="modalRegionName">지역 이름</div>
        <button class="btn-close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="form-group">
        <label>여행 날짜</label>
        <input type="date" class="form-control" id="inputDate">
      </div>

      <div class="form-group">
        <label>추억 한줄 기록 🌿</label>
        <input type="text" class="form-control" id="inputMemo" placeholder="예: 춘천 닭갈비 먹고 호수 산책!">
      </div>

      <div class="btn-modal-row">
        <button class="btn btn-uncolor" id="btnUncolor" onclick="deleteRecord()">색칠 취소</button>
        <button class="btn btn-save" onclick="saveRecord()">발자국 색칠 🎨</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Firestore 설정
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const mapCollection = db.collection("couple_space").doc("data").collection("travel_map");

    let visitedMap = {};
    let activeRegion = null;
    let svg, g, pathGroup, labelGroup, zoomBehavior, pathGenerator;
    const TOTAL_DISTRICTS = 250;

    // 🏷️ 종이 지도 스타일 2~3글자 축약 헬퍼 (예: "철원군" -> "철원", "해운대구" -> "해운대")
    function formatMapLabel(props) {
      if (!props) return "";
      let name = props.name || props.name_kor || props.NAME || props.SIG_KOR_NM || "";
      if (!name) return "";

      // 띄어쓰기 있는 경우 마지막 단어 사용 (예: "수원시 팔달구" -> "팔달")
      if (name.includes(" ")) name = name.split(" ").pop();

      // 시/군/구 접미사 제거하여 간결한 2~3글자로 변환
      if (name.length > 2) {
        if (name.endsWith("시") || name.endsWith("군") || name.endsWith("구")) {
          name = name.slice(0, -1);
        }
      }
      return name;
    }

    function getFullName(props) {
      if (!props) return "알 수 없는 지역";
      return props.name || props.name_kor || props.NAME || props.SIG_KOR_NM || "지역";
    }

    // 1. 지도 초기화 및 TopoJSON 렌더링
    async function initMap() {
      const width = document.querySelector('.map-frame').clientWidth - 16;
      const height = 540;

      svg = d3.select("#map-svg")
        .attr("viewBox", `0 0 ${width} ${height}`);

      g = svg.append("g");
      pathGroup = g.append("g").attr("class", "paths-layer");
      labelGroup = g.append("g").attr("class", "labels-layer");

      // 한반도 중심 투영
      const projection = d3.geoMercator()
        .center([127.8, 35.9])
        .scale(height * 7.5)
        .translate([width / 2, height / 2]);

      pathGenerator = d3.geoPath().projection(projection);

      // 부드러운 줌 & 제스처
      zoomBehavior = d3.zoom()
        .scaleExtent([1, 14])
        .on("zoom", (e) => {
          g.attr("transform", e.transform);
          // 줌 비율에 맞춰 글자 크기 유지
          const dynamicSize = Math.max(1.8, 3.4 / Math.sqrt(e.transform.k));
          labelGroup.selectAll(".district-label")
            .style("font-size", `${dynamicSize}px`)
            .style("stroke-width", `${dynamicSize * 0.18}px`);
        });

      svg.call(zoomBehavior);

      try {
        const res = await fetch("https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-topo-simple.json");
        const topoData = await res.json();
        const geojson = topojson.feature(topoData, topoData.objects.skorea_municipalities_2018_geo);

        // 1) 시군구 폴리곤
        pathGroup.selectAll("path")
          .data(geojson.features)
          .enter()
          .append("path")
          .attr("class", "district")
          .attr("d", pathGenerator)
          .attr("id", d => `d-${d.properties.code || d.id}`)
          .on("click", (e, d) => onDistrictClick(d.properties, d.id));

        // 2) 항상 보이는 2글자 지명 라벨
        labelGroup.selectAll("text")
          .data(geojson.features)
          .enter()
          .append("text")
          .attr("class", "district-label")
          .attr("id", d => `lbl-${d.properties.code || d.id}`)
          .attr("transform", d => {
            const centroid = pathGenerator.centroid(d);
            return isNaN(centroid[0]) ? "translate(-100,-100)" : `translate(${centroid[0]}, ${centroid[1]})`;
          })
          .text(d => formatMapLabel(d.properties));

        document.getElementById("mapLoading").style.display = "none";
        listenFirestore();
      } catch (err) {
        console.error("지도 로드 에러:", err);
        document.getElementById("mapLoading").innerHTML = `<span>지도 로드 실패</span>`;
      }
    }

    // 2. 지역 클릭 액션
    function onDistrictClick(prop, id) {
      const code = String(prop.code || id);
      const fullName = getFullName(prop);
      activeRegion = { code, name: fullName };

      document.getElementById("modalRegionName").innerText = `📍 ${fullName}`;
      
      const existing = visitedMap[code];
      if (existing) {
        document.getElementById("inputDate").value = existing.date || "";
        document.getElementById("inputMemo").value = existing.memo || "";
        document.getElementById("btnUncolor").style.display = "block";
      } else {
        document.getElementById("inputDate").value = new Date().toISOString().split("T")[0];
        document.getElementById("inputMemo").value = "";
        document.getElementById("btnUncolor").style.display = "none";
      }

      document.getElementById("diaryModal").classList.add("active");
    }

    // 3. Firestore 실시간 리스너
    function listenFirestore() {
      mapCollection.onSnapshot(snapshot => {
        visitedMap = {};
        let count = 0;

        snapshot.forEach(doc => {
          visitedMap[doc.id] = doc.data();
          count++;
        });

        // 색칠 및 라벨 반전 스타일 갱신
        d3.selectAll(".district")
          .classed("visited", d => Boolean(visitedMap[String(d.properties.code || d.id)]));

        d3.selectAll(".district-label")
          .classed("visited-label", d => Boolean(visitedMap[String(d.properties.code || d.id)]));

        // 통계 수치
        const rate = ((count / TOTAL_DISTRICTS) * 100).toFixed(1);
        document.getElementById("txtCount").innerText = count;
        document.getElementById("badgeRate").innerText = `${rate}% 완성`;
        document.getElementById("progressBar").style.width = `${Math.min(rate, 100)}%`;
      });
    }

    // 4. 저장 및 삭제
    function saveRecord() {
      if (!activeRegion) return;
      const date = document.getElementById("inputDate").value;
      const memo = document.getElementById("inputMemo").value;

      mapCollection.doc(activeRegion.code).set({
        name: activeRegion.name,
        date: date,
        memo: memo,
        updatedAt: Date.now()
      }).then(() => closeModal());
    }

    function deleteRecord() {
      if (!activeRegion) return;
      if (confirm(`'${activeRegion.name}' 색칠을 지울까요?`)) {
        mapCollection.doc(activeRegion.code).delete().then(() => closeModal());
      }
    }

    function closeModal() {
      document.getElementById("diaryModal").classList.remove("active");
      activeRegion = null;
    }

    function zoomIn() { svg.transition().duration(250).call(zoomBehavior.scaleBy, 1.6); }
    function zoomOut() { svg.transition().duration(250).call(zoomBehavior.scaleBy, 0.6); }
    function resetZoom() { svg.transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity); }

    window.addEventListener("DOMContentLoaded", initMap);
  </script>
</body>
</html>
