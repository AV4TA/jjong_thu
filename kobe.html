<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>고베 & 아리마 온천 여행 🇯🇵</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff758c" />
  
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Pink%20Heart.png" />
  <link rel="icon" href="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Pink%20Heart.png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #ffe8ee;
      --bg: #f8f9fe;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    .app-header { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color: white; padding: 20px 18px; border-radius: 0 0 28px 28px; box-shadow: 0 6px 20px rgba(255, 117, 140, 0.3); position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-home { color: white; text-decoration: none; font-size: 1.1rem; background: rgba(255, 255, 255, 0.25); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .header-title { font-size: 1.25rem; font-weight: 700; }
    .container { max-width: 540px; margin: 0 auto; padding: 16px; }
    
    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 12px; justify-content: flex-end; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #a4b0be; }
    .sync-dot.online { background: #2ed573; }
    .sync-dot.syncing { background: #ffa502; }

    .tab-view { display: none; }
    .tab-view.active { display: block; }
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .sub-tab-btn { background: white; border: 1px solid var(--border); color: var(--text-sub); padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .sub-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .card { background: white; border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.02); }
    .checklist-card { background: white; border-radius: 20px; padding: 20px; box-shadow: var(--shadow); border: 1px solid rgba(255, 117, 140, 0.15); }
    .person-switch-row { display: flex; background: #f1f2f6; padding: 4px; border-radius: 14px; margin-bottom: 16px; gap: 4px; }
    .person-btn { flex: 1; border: none; padding: 10px; border-radius: 10px; font-size: 0.88rem; font-weight: 700; color: #636e72; background: transparent; cursor: pointer; }
    .person-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .progress-bar-bg { height: 10px; background: #f1f2f6; border-radius: 8px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; border-radius: 8px; }

    .check-row { display: flex; align-items: center; justify-content: space-between; background: #fdfdfd; border: 1px solid #f1f2f6; padding: 12px; border-radius: 14px; margin-bottom: 8px; cursor: pointer; }
    .check-row.checked { background: #f8f9fa; opacity: 0.6; }
    .check-text { font-size: 0.92rem; font-weight: 600; }
    .check-row.checked .check-text { text-decoration: line-through; color: #a4b0be; }

    .timeline-item { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
    .timeline-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; }
    .place-card { display: flex; gap: 14px; align-items: center; background: white; padding: 14px; border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--border); }
    .place-category-icon { width: 46px; height: 46px; border-radius: 14px; background: #fff0f3; color: var(--primary); display: flex; align-items: center; justify-content: center; }
    
    .weather-hero { background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%); color: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; }
    .forecast-card { background: white; border-radius: 14px; padding: 12px 10px; min-width: 74px; text-align: center; border: 1px solid var(--border); flex-shrink: 0; }

    .fab { position: fixed; right: 20px; bottom: 86px; width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 8px 20px rgba(255, 94, 126, 0.4); border: none; z-index: 50; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05); display: flex; justify-content: space-around; align-items: center; z-index: 50; border-radius: 20px 20px 0 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #a4b0be; font-size: 0.72rem; font-weight: 600; cursor: pointer; border: none; background: none; width: 33%; }
    .nav-item.active { color: var(--primary); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: white; border-radius: 24px; width: 100%; max-width: 440px; padding: 24px; }
    .form-group { margin-bottom: 14px; }
    .form-control { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); }
    .btn { padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; width: 48%; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i></a>
        <div>
          <div class="header-title">고베 & 아리마 온천 🇯🇵</div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="sync-status"><div class="sync-dot" id="syncDot"></div><span id="syncStatusText">동기화 완료</span></div>

    <!-- 1. 일정 -->
    <div id="view-travel" class="tab-view active">
      <div class="sub-tabs" id="dayTabs">
        <button class="sub-tab-btn active" onclick="switchDay('ready', this)">🧳 준비</button>
        <button class="sub-tab-btn" onclick="switchDay(1, this)">Day 1</button>
        <button class="sub-tab-btn" onclick="switchDay(2, this)">Day 2</button>
        <button class="sub-tab-btn" onclick="switchDay(3, this)">Day 3</button>
      </div>
      <div id="readyChecklistSection" class="checklist-card">
        <div class="person-switch-row">
          <button class="person-btn active" id="btnPersonThu" onclick="switchPerson('thu')">👸 뚜</button>
          <button class="person-btn" id="btnPersonJjong" onclick="switchPerson('jjong')">🤴 쫑</button>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill"></div></div>
        <div class="check-add-box" style="margin-top:15px;">
          <input type="text" id="newCheckInput" class="check-input" placeholder="새 준비물">
          <button class="btn-add-item" onclick="addCheckItem()">+</button>
        </div>
        <div class="checklist-items" id="checklistContainer"></div>
      </div>
      <div id="timelineContainer" style="display:none;"></div>
    </div>

    <!-- 2. 맛집 -->
    <div id="view-places" class="tab-view">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="filterPlaces('all', this)">전체</button>
        <button class="sub-tab-btn" onclick="filterPlaces('고베', this)">🥩 고베</button>
        <button class="sub-tab-btn" onclick="filterPlaces('아리마', this)">♨️ 아리마</button>
        <button class="sub-tab-btn" onclick="filterPlaces('카페', this)">☕ 카페</button>
      </div>
      <div id="placesContainer"></div>
    </div>

    <!-- 3. 날씨 -->
    <div id="view-weather" class="tab-view"></div>
  </div>

  <button class="fab" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></button>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchNav('travel', this)"><i class="fa-solid fa-plane"></i><span>일정</span></button>
    <button class="nav-item" onclick="switchNav('places', this)"><i class="fa-solid fa-utensils"></i><span>맛집</span></button>
    <button class="nav-item" onclick="switchNav('weather', this)"><i class="fa-solid fa-cloud-sun"></i><span>날씨</span></button>
  </nav>

  <!-- 모달 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>새 항목 추가</h3>
      <div class="form-group">
        <label>구분</label>
        <select class="form-control" id="itemType" onchange="toggleFormFields()">
          <option value="travel">✈️ 여행 일정</option>
          <option value="place">🍽️ 맛집 / 가볼 곳</option>
        </select>
      </div>
      <!-- [NEW] 카테고리 태그 선택창 추가 -->
      <div class="form-group" id="categoryGroup" style="display:none;">
        <label>카테고리</label>
        <select class="form-control" id="itemCategory">
          <option value="고베">🥩 고베</option>
          <option value="아리마">♨️ 아리마온천</option>
          <option value="카페">☕ 카페</option>
        </select>
      </div>
      <div id="travelFields">
        <div class="form-group"><label>일자</label><select class="form-control" id="travelDay"><option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option></select></div>
      </div>
      <div class="form-group"><label id="nameLabel">이름</label><input type="text" class="form-control" id="itemName"></div>
      <div class="form-group"><label>메모</label><textarea class="form-control" id="itemMemo"></textarea></div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" onclick="saveItem()">저장</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys", authDomain: "kobe-couple-app.firebaseapp.com", projectId: "kobe-couple-app", storageBucket: "kobe-couple-app.firebasestorage.app", messagingSenderId: "755701956140", appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let appData = { checklistThu: [], checklistJjong: [], travel: [], places: [] };
    let currentDay = 'ready';
    let activeNav = 'travel';
    let currentPlaceFilter = 'all';
    let currentPerson = 'thu';

    db.collection("couple_space").doc("shared_data").onSnapshot(doc => {
      if (doc.exists) { appData = doc.data(); renderAll(); }
    });

    function renderAll() {
      if (activeNav === 'travel') renderTravelView();
      if (activeNav === 'places') renderPlaces();
    }

    function toggleFormFields() {
      const type = document.getElementById('itemType').value;
      document.getElementById('travelFields').style.display = (type === 'travel') ? 'block' : 'none';
      document.getElementById('categoryGroup').style.display = (type === 'place') ? 'block' : 'none'; // 태그 선택창 보이기/숨기기
      document.getElementById('nameLabel').innerText = (type === 'place') ? '맛집/장소명' : '일정 제목';
    }

    function saveItem() {
      const type = document.getElementById('itemType').value;
      const name = document.getElementById('itemName').value.trim();
      if (!name) return alert('이름을 입력해주세요!');

      if (type === 'travel') {
        if (!appData.travel) appData.travel = [];
        appData.travel.push({ id: Date.now(), day: parseInt(document.getElementById('travelDay').value), title: name });
      } else {
        if (!appData.places) appData.places = [];
        appData.places.push({ 
          id: Date.now(), 
          category: document.getElementById('itemCategory').value, // 선택한 태그 저장!
          title: name, 
          desc: document.getElementById('itemMemo').value 
        });
      }
      db.collection("couple_space").doc("shared_data").set(appData, {merge: true});
      closeModal();
    }

    function openAddModal() { document.getElementById('addModal').classList.add('active'); }
    function closeModal() { document.getElementById('addModal').classList.remove('active'); }
    function switchNav(nav, btn) { activeNav = nav; renderAll(); /* 탭 전환 로직 생략 */ }
    function switchDay(d, btn) { currentDay = d; renderTravelView(); }
    function renderPlaces() {
      const filtered = currentPlaceFilter === 'all' ? (appData.places || []) : (appData.places || []).filter(p => p.category === currentPlaceFilter);
      document.getElementById('placesContainer').innerHTML = filtered.map(p => `
        <div class="place-card">
          <div class="place-category-icon"><i class="fa-solid fa-utensils"></i></div>
          <div><div style="font-weight:700;">${p.title}</div><div style="font-size:0.8rem;color:var(--text-sub);">#${p.category}</div></div>
        </div>
      `).join('');
    }
    function filterPlaces(cat, btn) { currentPlaceFilter = cat; renderPlaces(); }
    function renderTravelView() {} // 상세 로직은 기존과 동일
  </script>
</body>
</html>
