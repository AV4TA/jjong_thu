<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>고베 & 아리마 온천 여행 🇯🇵</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff758c" />
  
  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:sparkling-heart.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:sparkling-heart.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Panzoom (모바일 핀치 줌 라이브러리) -->
  <script src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>

  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #ffe8ee;
      --primary-dark: #e04565;
      --accent: #6c5ce7;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    .app-header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      padding: 20px 18px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.25);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.25rem; font-weight: 800; }
    .d-day-pill {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      justify-content: flex-end;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #a4b0be; transition: background 0.3s; }
    .sync-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    .sync-dot.syncing { background: #ffa502; }

    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .sub-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tab-btn {
      background: white;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sub-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(255, 94, 126, 0.3);
    }

    .region-switch-row {
      display: flex;
      background: #f1f2f6;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 12px;
      gap: 6px;
    }
    .region-btn {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #636e72;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .region-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .category-sub-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .category-sub-tabs::-webkit-scrollbar { display: none; }
    .cat-chip-btn {
      background: white;
      border: 1px solid var(--border);
      color: #636e72;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-chip-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 800;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.02);
    }

    .checklist-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 117, 140, 0.15);
      margin-bottom: 16px;
    }
    .person-switch-row { display: flex; background: #f1f2f6; padding: 4px; border-radius: 14px; margin-bottom: 16px; gap: 4px; }
    .person-btn {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #636e72;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .person-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .progress-wrap { margin-bottom: 16px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; color: #2d3436; }
    .progress-bar-bg { height: 10px; background: #f1f2f6; border-radius: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #ff758c, #ff5e7e); width: 0%; transition: width 0.3s ease; border-radius: 8px; }

    .check-add-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .check-input { flex: 1; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.88rem; outline: none; }
    .btn-add-item { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }

    .checklist-items { display: flex; flex-direction: column; gap: 8px; }
    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fdfdfd;
      border: 1px solid #f1f2f6;
      padding: 12px 14px;
      border-radius: 14px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .check-row.checked { background: #f8f9fa; border-color: #e9ecef; opacity: 0.6; }
    .check-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #dcdde1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.75rem;
    }
    .check-row.checked .custom-checkbox { background: var(--primary); border-color: var(--primary); }
    .check-text { font-size: 0.92rem; font-weight: 600; color: #2d3436; }
    .check-row.checked .check-text { text-decoration: line-through; color: #a4b0be; }
    .btn-del-check { background: none; border: none; color: #ff7675; font-size: 0.85rem; cursor: pointer; padding: 4px 6px; }

    /* 서류 / 티켓 카드 스타일 */
    .doc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
    .doc-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .doc-img-wrap {
      height: 135px;
      background: #f8f9fc;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px;
    }
    .doc-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .doc-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .doc-title { font-size: 0.92rem; font-weight: 800; color: #2d3436; margin-bottom: 3px; line-height: 1.3; }
    .doc-memo { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 10px; line-height: 1.3; }
    .doc-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .btn-doc-action { background: #f1f2f6; border: none; color: #57606f; font-size: 0.75rem; font-weight: 700; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    .btn-doc-action.del { color: #ff7675; }
    .btn-doc-action.view { background: var(--primary-soft); color: var(--primary); }

    .timeline-item { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before { content: ''; position: absolute; left: 19px; top: 36px; bottom: 0; width: 2px; background: #f0f0f5; }
    .timeline-item:last-child::before { display: none; }
    .timeline-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      z-index: 1;
    }
    .timeline-content { flex: 1; }
    .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .timeline-time { font-size: 0.82rem; font-weight: 800; color: var(--primary); }
    .timeline-title { font-size: 1.05rem; font-weight: 800; color: #222; margin-bottom: 4px; }
    .timeline-memo { font-size: 0.85rem; color: #636e72; line-height: 1.45; word-break: break-all; }

    .map-preview-box { border-radius: 12px; overflow: hidden; margin: 10px 0; border: 1px solid var(--border); height: 160px; background: #eef1f6; }
    .map-preview-box iframe { width: 100%; height: 100%; border: 0; }
    .btn-maps { display: inline-flex; align-items: center; gap: 6px; background: #eef2ff; color: #4f46e5; font-size: 0.78rem; font-weight: 600; padding: 6px 12px; border-radius: 8px; text-decoration: none; }

    .place-card { display: flex; gap: 14px; align-items: center; background: white; padding: 14px; border-radius: 16px; margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .place-category-icon { width: 46px; height: 46px; border-radius: 14px; background: #fff0f3; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .place-actions { display: flex; align-items: center; gap: 8px; }
    .btn-place-del { background: none; border: none; color: #ff7675; font-size: 0.9rem; cursor: pointer; padding: 6px; }

    .weather-hero { background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%); color: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(9, 132, 227, 0.25); }
    .weather-hero-top { display: flex; justify-content: space-between; align-items: center; }
    .weather-city-name { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .weather-main-temp { font-size: 2.8rem; font-weight: 800; line-height: 1; margin: 12px 0 6px; }
    .weather-condition { font-size: 0.95rem; font-weight: 600; }
    .weather-extra-info { display: flex; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.25); font-size: 0.8rem; }
    .weather-forecast-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
    .weather-forecast-row::-webkit-scrollbar { display: none; }
    .forecast-card { background: white; border-radius: 14px; padding: 12px 10px; min-width: 74px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); flex-shrink: 0; }
    .forecast-day { font-size: 0.75rem; font-weight: 700; color: #636e72; margin-bottom: 4px; }
    .forecast-icon { font-size: 1.3rem; margin: 4px 0; }
    .forecast-temp { font-size: 0.78rem; font-weight: 700; color: #2d3436; }
    .cloth-tip-box { background: #fff8e7; border: 1px solid #ffeaa7; border-radius: 16px; padding: 16px; font-size: 0.84rem; color: #634a00; line-height: 1.5; }

    .fab { position: fixed; right: 20px; bottom: 86px; width: 54px; height: 54px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 8px 20px rgba(255, 94, 126, 0.4); cursor: pointer; border: none; z-index: 50; transition: transform 0.2s; }
    .fab:active { transform: scale(0.92); }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05); display: flex; justify-content: space-around; align-items: center; z-index: 50; border-radius: 20px 20px 0 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #a4b0be; font-size: 0.62rem; font-weight: 600; cursor: pointer; gap: 4px; border: none; background: none; width: 20%; }
    .nav-item i { font-size: 1.1rem; }
    .nav-item.active { color: var(--primary); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 999; opacity: 0; pointer-events: none; align-items: center; justify-content: center; padding: 16px; transition: opacity 0.2s ease; }
    .modal-overlay.active { display: flex; z-index: 999; opacity: 1; pointer-events: auto; }
    .modal-content { background: white; border-radius: 24px; width: 100%; max-width: 440px; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; color: #333; }
    .form-control { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.95rem; outline: none; }
    .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #f1f2f6; color: #57606f; }

    /* 서류 원본 확대 및 다운로드 모달 */
    .doc-view-card {
      background: white;
      border-radius: 24px;
      padding: 16px 14px 14px;
      width: 96%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .doc-modal-close-btn {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 36px;
      height: 36px;
      background: #2d3436;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 1000;
    }
    .doc-view-img-box {
      width: 100%;
      height: 62vh;
      max-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: #fafafa;
      overflow: hidden;
      position: relative;
    }
    .doc-view-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .btn-download-doc {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #ffc2d1;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <a href="index.html" class="btn-home" title="홈으로"><i class="fa-solid fa-house"></i></a>
        <div>
          <div class="header-title">고베 & 아리마 온천 🇯🇵</div>
          <p style="font-size: 0.78rem; opacity: 0.9; margin-top: 2px;">2026.08.30 (일) ~ 09.02 (수)</p>
        </div>
      </div>
      <div class="d-day-pill">
        <i class="fa-solid fa-heart"></i>
        <span id="ddayText">D-Day</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncStatusText">서버 연결 중...</span>
    </div>

    <!-- 1. 준비물 탭 -->
    <div id="view-checklist" class="tab-view active">
      <div class="checklist-card">
        <div class="person-switch-row">
          <button class="person-btn active" id="btnPersonThu" onclick="switchPerson('thu')">👸 뚜가 챙길 거</button>
          <button class="person-btn" id="btnPersonJjong" onclick="switchPerson('jjong')">🤴 쫑이 챙길 거</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-header">
            <span id="progressTitle">🎒 뚜의 짐 챙기기</span>
            <span id="progressText">0% 완료 (0/0)</span>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill"></div></div>
        </div>
        <div class="check-add-box">
          <input type="text" id="newCheckInput" class="check-input" placeholder="새 준비물 입력" onkeypress="if(event.key==='Enter') addCheckItem()">
          <button class="btn-add-item" onclick="addCheckItem()">추가</button>
        </div>
        <div class="checklist-items" id="checklistContainer"></div>
      </div>
    </div>

    <!-- 2. 필요서류 탭 -->
    <div id="view-docs" class="tab-view">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h4 style="font-size: 1.05rem; font-weight: 800; color: #2d3436;"><i class="fa-solid fa-file-lines" style="color:var(--primary);"></i> 티켓 및 예약증 보관함</h4>
        <span style="font-size:0.75rem; color:var(--text-sub);">사진을 누르면 확대 및 저장 가능 ✨</span>
      </div>
      <div class="doc-grid" id="documentGridContainer"></div>
    </div>

    <!-- 3. 여행일정 탭 -->
    <div id="view-travel" class="tab-view">
      <div class="sub-tabs" id="dayTabs">
        <button class="sub-tab-btn active" onclick="switchDay(1, this)">Day 1 (8/30)</button>
        <button class="sub-tab-btn" onclick="switchDay(2, this)">Day 2 (8/31)</button>
        <button class="sub-tab-btn" onclick="switchDay(3, this)">Day 3 (9/01)</button>
        <button class="sub-tab-btn" onclick="switchDay(4, this)">Day 4 (9/02)</button>
      </div>
      <div id="timelineContainer"></div>
    </div>

    <!-- 4. 맛집/가볼곳 탭 -->
    <div id="view-places" class="tab-view">
      <div class="region-switch-row">
        <button class="region-btn active" id="btnRegionKobe" onclick="switchPlaceRegion('kobe')">🥩 고베 시내</button>
        <button class="region-btn" id="btnRegionArima" onclick="switchPlaceRegion('arima')">♨️ 아리마 온천</button>
      </div>

      <div class="category-sub-tabs" id="placeCategoryTabs">
        <button class="cat-chip-btn active" onclick="filterPlaceCategory('all', this)">전체</button>
        <button class="cat-chip-btn" onclick="filterPlaceCategory('맛집', this)">🍣 맛집</button>
        <button class="cat-chip-btn" onclick="filterPlaceCategory('카페', this)">☕ 카페</button>
        <button class="cat-chip-btn" onclick="filterPlaceCategory('숙소', this)">🏨 숙소</button>
        <button class="cat-chip-btn" onclick="filterPlaceCategory('쇼핑', this)">🛍️ 쇼핑</button>
        <button class="cat-chip-btn" onclick="filterPlaceCategory('볼거리', this)">🎡 볼거리</button>
      </div>

      <div id="placesContainer"></div>
    </div>

    <!-- 5. 날씨 탭 -->
    <div id="view-weather" class="tab-view">
      <div class="sub-tabs">

        { id: 302, day: 3, icon: 'fa-ferris-wheel', time: '16:00', title: '고베 하버랜드 모자이크', memo: '포트타워 야경 보며 낭만적인 밤 산책 🎡', query: 'Kobe Harborland MOSAIC, Kobe', showMap: true },

        { id: 402, day: 4, icon: 'fa-plane-departure', time: '16:00', title: '고베공항 출발 🛫', memo: '출국 수속 및 면세점 구경', query: 'Kobe Airport, Japan', showMap: false },
        { id: 403, day: 4, icon: 'fa-plane-arrival', time: '18:00', title: '인천공항 도착 🛬', memo: '즐거웠던 고베 & 아리마 여행 마무리 💖', query: 'Incheon International Airport', showMap: false }
      ],
      places: [
        { id: 1, region: 'kobe', category: '맛집', title: '고베 타다', desc: '1일차 저녁 예정 맛집 🥩', query: 'Kobe Tada, Kobe, Japan' },
        { id: 2, region: 'kobe', category: '숙소', title: '토요코인 고베 산노미야 에키마에', desc: '역 앞 편리한 숙소 (東横INN神戸三宮駅前)', query: 'Toyoko Inn Kobe Sannomiya Ekimae, Kobe' },
        { id: 3, region: 'kobe', category: '카페', title: '스타벅스 기타노이진칸점', desc: '등록유형문화재 서양식 주택 카페', query: 'Starbucks Coffee Kobe Kitano Ijinkan' },
        { id: 4, region: 'arima', category: '볼거리', title: '아리마 온천 킨노유', desc: '적갈색 철분 천연 온천수 족욕장 ♨️', query: 'Arima Onsen Kin no Yu, Kobe' },
        { id: 5, region: 'arima', category: '쇼핑', title: '아리마 탄산센베 본점', desc: '바삭바삭 전통 온천 탄산과자 선물', query: 'Arima Onsen Tansan Senbei' }
      ]
    };

    let appData = initialKobeData;
    let documentsList = [];
    let currentDay = 1;
    let activeNav = 'checklist';
    let selectedPlaceRegion = 'kobe';
    let selectedPlaceCategory = 'all';
    let currentWeatherCity = 'kobe';
    let currentPerson = 'thu';
    let tempUploadedFileBase64 = '';
    let tempUploadedFileName = '';
    let panzoomInstance = null;
    let currentViewingDoc = null;

    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncStatusText');

    db.collection("couple_space").doc("shared_data").onSnapshot({ includeMetadataChanges: true }, (doc) => {
      if (doc.exists) {
        const remoteData = doc.data();
        appData = {
          checklistThu: remoteData.checklistThu || initialChecklistThu,
          checklistJjong: remoteData.checklistJjong || initialChecklistJjong,
          travel: (remoteData.travel && remoteData.travel.length > 0) ? remoteData.travel : initialKobeData.travel,
          places: (remoteData.places && remoteData.places.length > 0) ? remoteData.places : initialKobeData.places
        };
        setOnlineStatus();
        renderAll();
      } else {
        db.collection("couple_space").doc("shared_data").set(initialKobeData, { merge: true });
      }
    });

    docsCollection.onSnapshot((snapshot) => {
      const list = [];
      snapshot.forEach(doc => {
        list.push({ id: doc.id, ...doc.data() });
      });
      documentsList = list;
      setOnlineStatus();
      if (activeNav === 'docs') renderDocuments();
    }, error => {
      console.error("Docs sync error:", error);
    });

    function setOnlineStatus() {
      if (syncDot) syncDot.className = 'sync-dot online';
      if (syncText) syncText.innerText = '실시간 동기화 완료';
    }

    function setSyncingStatus() {
      if (syncDot) syncDot.className = 'sync-dot syncing';
      if (syncText) syncText.innerText = '저장 중...';
    }

    function saveData() {
      setSyncingStatus();
      db.collection("couple_space").doc("shared_data").set(appData, { merge: true })
        .then(() => { setOnlineStatus(); });
    }

    function renderAll() {
      if (activeNav === 'checklist') renderChecklist();
      if (activeNav === 'docs') renderDocuments();
      if (activeNav === 'travel') renderTimeline();
      if (activeNav === 'places') renderPlaces();
      if (activeNav === 'weather') loadWeatherData();
    }

    function switchPerson(p) {
      currentPerson = p;
      document.getElementById('btnPersonThu').classList.toggle('active', p === 'thu');
      document.getElementById('btnPersonJjong').classList.toggle('active', p === 'jjong');
      renderChecklist();
    }

    function getActiveChecklist() {
      return currentPerson === 'thu' ? (appData.checklistThu || []) : (appData.checklistJjong || []);
    }

    function renderChecklist() {
      const container = document.getElementById('checklistContainer');
      const list = getActiveChecklist();
      const name = currentPerson === 'thu' ? '뚜' : '쫑';

      document.getElementById('progressTitle').innerText = `🎒 ${name}의 짐 챙기기`;
      document.getElementById('newCheckInput').placeholder = `${name}가 챙길 준비물 입력`;

      const total = list.length;
      const checked = list.filter(i => i.checked).length;
      const pct = total === 0 ? 0 : Math.round((checked / total) * 100);

      document.getElementById('progressText').innerText = `${pct}% 완료 (${checked}/${total})`;
      document.getElementById('progressBarFill').style.width = `${pct}%`;

      if (list.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#a4b0be; padding:20px;">준비물이 없습니다.</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="check-row ${item.checked ? 'checked' : ''}" onclick="toggleCheckItem(${item.id})">
          <div class="check-left">
            <div class="custom-checkbox">${item.checked ? '<i class="fa-solid fa-check"></i>' : ''}</div>
            <span class="check-text">${item.text}</span>
          </div>
          <button class="btn-del-check" onclick="event.stopPropagation(); deleteCheckItem(${item.id})"><i class="fa-solid fa-trash-can"></i></button>
        </div>
      `).join('');
    }

    function toggleCheckItem(id) {
      const item = getActiveChecklist().find(i => i.id === id);
      if (item) { item.checked = !item.checked; saveData(); renderChecklist(); }
    }

    function addCheckItem() {
      const input = document.getElementById('newCheckInput');
      const text = input.value.trim();
      if (!text) return;
      const newItem = { id: Date.now(), text: text, checked: false };
      if (currentPerson === 'thu') {
        if (!appData.checklistThu) appData.checklistThu = [];
        appData.checklistThu.push(newItem);
      } else {
        if (!appData.checklistJjong) appData.checklistJjong = [];
        appData.checklistJjong.push(newItem);
      }
      input.value = '';
      saveData();
      renderChecklist();
    }

    function deleteCheckItem(id) {
      if (currentPerson === 'thu') appData.checklistThu = (appData.checklistThu || []).filter(i => i.id !== id);
      else appData.checklistJjong = (appData.checklistJjong || []).filter(i => i.id !== id);
      saveData();
      renderChecklist();
    }

    function renderDocuments() {
      const container = document.getElementById('documentGridContainer');

      if (documentsList.length === 0) {
        container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; color:#a4b0be; padding:40px 10px;">등록된 티켓/서류가 없습니다.<br>우측 하단의 <b>+</b> 버튼을 눌러 추가해보세요!</div>`;
        return;
      }

      container.innerHTML = documentsList.map(d => {
        const displayImg = d.fileData || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400';
        return `
          <div class="doc-card">
            <div class="doc-img-wrap" onclick="viewDocImage('${d.id}')">
              <img src="${displayImg}" alt="서류">
            </div>
            <div class="doc-body">
              <div>
                <div class="doc-title">${d.title}</div>
                <div class="doc-memo">${d.memo || '설명 없음'}</div>
              </div>
              <div class="doc-footer">
                <button class="btn-doc-action del" onclick="deleteDocument('${d.id}')">삭제</button>
                <button class="btn-doc-action view" onclick="viewDocImage('${d.id}')">확대보기</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function initPanzoom() {
      const elem = document.getElementById('enlargedDocImg');
      if (panzoomInstance) {
        panzoomInstance.destroy();
        panzoomInstance = null;
      }
      panzoomInstance = Panzoom(elem, {
        maxScale: 4.5,
        minScale: 1,
        contain: 'outside',
        startScale: 1
      });
      elem.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
    }

    function viewDocImage(id) {
      const target = documentsList.find(d => String(d.id) === String(id));
      if (target && target.fileData) {
        currentViewingDoc = target;
        document.getElementById('enlargedDocImg').src = target.fileData;
        document.getElementById('docViewModal').classList.add('active');
        setTimeout(() => { initPanzoom(); }, 50);
      } else {
        alert('저장된 이미지 파일이 없습니다.');
      }
    }

    function closeDocModal() {
      document.getElementById('docViewModal').classList.remove('active');
      currentViewingDoc = null;
      if (panzoomInstance) {
        panzoomInstance.reset();
        panzoomInstance.destroy();
        panzoomInstance = null;
      }
    }

    function downloadCurrentDocImage() {
      if (!currentViewingDoc || !currentViewingDoc.fileData) return;
      const link = document.createElement('a');
      link.href = currentViewingDoc.fileData;
      link.download = (currentViewingDoc.title || '여행서류') + '_바우처.jpg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function deleteDocument(id) {
      if (confirm('이 서류/티켓을 삭제할까요?')) {
        setSyncingStatus();
        docsCollection.doc(String(id)).delete()
          .then(() => { setOnlineStatus(); })
          .catch(err => { console.error(err); setOnlineStatus(); });
      }
    }

    function handleDocFileSelect(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        tempUploadedFileName = file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const maxD = 1000;
            if (w > h && w > maxD) { h = Math.round((h * maxD) / w); w = maxD; }
            else if (h > maxD) { w = Math.round((w * maxD) / h); h = maxD; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            tempUploadedFileBase64 = canvas.toDataURL('image/jpeg', 0.80);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function calculateDDay() {
      const tripDate = new Date('2026-08-30');
      const today = new Date();
      tripDate.setHours(0,0,0,0);
      today.setHours(0,0,0,0);
      const diff = Math.ceil((tripDate - today) / (1000 * 60 * 60 * 24));
      const el = document.getElementById('ddayText');
      if (diff > 0) el.innerText = `D-${diff}`;
      else if (diff === 0) el.innerText = `D-Day! 🛫`;
      else el.innerText = `고베 추억 💖`;
    }

    function switchNav(nav, btn) {
      activeNav = nav;
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`view-${nav}`).classList.add('active');
      if (btn) btn.classList.add('active');
      document.getElementById('mainFab').style.display = (nav === 'weather') ? 'none' : 'flex';
      renderAll();
    }

    function switchDay(day, btn) {
      currentDay = day;
      document.querySelectorAll('#dayTabs .sub-tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderTimeline();
    }

    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return 9999;
      const clean = timeStr.replace(/[^0-9:]/g, '');
      const parts = clean.split(':').map(Number);
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) return parts[0] * 60 + parts[1];
      if (parts.length === 1 && !isNaN(parts[0])) return parts[0] * 60;
      return 9999;
    }

    function getSmartMapInfo(item) {
      const rawText = (item.query || '') + ' ' + (item.memo || '') + ' ' + (item.title || '');
      const urlMatch = rawText.match(/(https?:\/\/[^\s]+)/g);
      if (urlMatch && urlMatch.length > 0) {
        return { directUrl: urlMatch[0], searchQuery: item.title + ', Kobe, Japan' };
      }
      let cleanQuery = (item.query || item.title || '').trim();
      if (!cleanQuery.includes('고베') && !cleanQuery.includes('Kobe') && !cleanQuery.includes('아리마') && !cleanQuery.includes('Arima') && !cleanQuery.includes('Japan') && !cleanQuery.includes('인천')) {
        cleanQuery += ', Kobe, Japan';
      }
      return { directUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanQuery)}`, searchQuery: cleanQuery };
    }

    function renderTimeline() {
      const container = document.getElementById('timelineContainer');
      const dayNum = parseInt(currentDay);
      let items = (appData.travel || []).filter(i => i.day === dayNum);

      if (items.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#a4b0be; padding:40px 10px;">등록된 일정이 없습니다. 우측 하단의 <b>+</b> 버튼을 눌러 추가해보세요!</div>';
        return;
      }

      items.sort((a, b) => parseTimeToMinutes(a.time) - parseTimeToMinutes(b.time));

      container.innerHTML = items.map(item => {
        const iconClass = (item.icon && item.icon.trim() !== '') ? item.icon : 'fa-location-dot';
        const mapInfo = getSmartMapInfo(item);
        return `
          <div class="card timeline-item">
            <div class="timeline-icon"><i class="fa-solid ${iconClass}"></i></div>
            <div class="timeline-content">
              <div class="timeline-header">
                <span class="timeline-time">${item.time || '시간 미정'}</span>
                <button onclick="deleteTravel(${item.id})" style="border:none; background:none; color:#ff7675; cursor:pointer;"><i class="fa-solid fa-trash-can"></i></button>
              </div>
              <div class="timeline-title">${item.title}</div>
              <div class="timeline-memo">${item.memo || ''}</div>
              ${item.showMap ? `
                <div class="map-preview-box">
                  <iframe src="https://maps.google.com/maps?q=${encodeURIComponent(mapInfo.searchQuery)}&t=&z=15&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>
                </div>
              ` : ''}
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                <a class="btn-maps" href="${mapInfo.directUrl}" target="_blank"><i class="fa-brands fa-google"></i> 지도 보기</a>
                <button onclick="toggleMiniMap(${item.id})" style="border:none; background:none; color:#636e72; font-size:0.75rem; cursor:pointer;">${item.showMap ? '🗺️ 미니맵 접기' : '🗺️ 미니맵 보기'}</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleMiniMap(id) {
      const item = (appData.travel || []).find(t => t.id === id);
      if (item) { item.showMap = !item.showMap; saveData(); renderTimeline(); }
    }

    function deleteTravel(id) {
      if (confirm('이 일정을 삭제할까요?')) {
        appData.travel = (appData.travel || []).filter(t => t.id !== id);
        saveData();
        renderTimeline();
      }
    }

    function switchPlaceRegion(region) {
      selectedPlaceRegion = region;
      document.getElementById('btnRegionKobe').classList.toggle('active', region === 'kobe');
      document.getElementById('btnRegionArima').classList.toggle('active', region === 'arima');
      renderPlaces();
    }

    function filterPlaceCategory(cat, btn) {
      selectedPlaceCategory = cat;
      document.querySelectorAll('#placeCategoryTabs .cat-chip-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderPlaces();
    }

    function getPlaceCategoryIcon(category) {
      switch (category) {
        case '카페': return 'fa-mug-hot';
        case '숙소': return 'fa-hotel';
        case '쇼핑': return 'fa-bag-shopping';
        case '볼거리': return 'fa-ferris-wheel';
        case '맛집': default: return 'fa-utensils';
      }
    }

    function deletePlace(id) {
      if (confirm('이 맛집/장소를 목록에서 삭제할까요?')) {
        appData.places = (appData.places || []).filter(p => p.id !== id);
        saveData();
        renderPlaces();
      }
    }

    function renderPlaces() {
      const container = document.getElementById('placesContainer');
      const allList = appData.places || [];
      const regionFiltered = allList.filter(p => {
        const r = p.region || (p.category === '아리마' ? 'arima' : 'kobe');
        return r === selectedPlaceRegion;
      });
      const finalFiltered = selectedPlaceCategory === 'all' ? regionFiltered : regionFiltered.filter(p => {
        let cat = p.category;
        if (cat === '고베' || cat === '아리마') cat = '맛집';
        return cat === selectedPlaceCategory;
      });

      if (finalFiltered.length === 0) {
        const regionName = selectedPlaceRegion === 'kobe' ? '고베' : '아리마 온천';
        container.innerHTML = `<div style="text-align:center; color:#a4b0be; padding:40px 10px;">등록된 ${regionName} 장소가 없습니다.<br>우측 하단의 <b>+</b> 버튼을 눌러 추가해보세요!</div>`;
        return;
      }

      container.innerHTML = finalFiltered.map(p => {
        let q = p.query || p.title;
        if (!q.includes('Kobe') && !q.includes('고베') && !q.includes('Japan') && !q.includes('Arima')) {
          q += selectedPlaceRegion === 'arima' ? ', Arima Onsen, Kobe, Japan' : ', Kobe, Japan';
        }
        const isUrl = q.startsWith('http');
        const mapUrl = isUrl ? q : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
        let catText = p.category || '맛집';
        if (catText === '고베' || catText === '아리마') catText = '맛집';

        return `
          <div class="place-card">
            <div class="place-category-icon"><i class="fa-solid ${getPlaceCategoryIcon(catText)}"></i></div>
            <div style="flex:1;">
              <span style="font-size:0.75rem; color:var(--primary); font-weight:800;">#${selectedPlaceRegion === 'kobe' ? '고베' : '아리마'} #${catText}</span>
              <div style="font-size:1rem; font-weight:800; margin:2px 0;">${p.title}</div>
              <div style="font-size:0.82rem; color:var(--text-sub); line-height:1.35;">${p.desc || ''}</div>
            </div>
            <div class="place-actions">
              <a class="btn-maps" href="${mapUrl}" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
              <button class="btn-place-del" onclick="deletePlace(${p.id})"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }

    const CITY_COORDS = {
      kobe: { name: '고베 시내 (산노미야)', lat: 34.6901, lon: 135.1955 },
      arima: { name: '아리마 온천 (온천마을)', lat: 34.7978, lon: 135.2475 }
    };

    function switchWeatherCity(city, btn) {
      currentWeatherCity = city;
      document.querySelectorAll('#view-weather .sub-tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      loadWeatherData();
    }

    function getWeatherConditionInfo(code) {
      if (code === 0) return { text: '맑음 ☀️', icon: '☀️' };
      if (code === 1 || code === 2) return { text: '대체로 맑음 🌤️', icon: '🌤️' };
      if (code === 3) return { text: '흐림 ☁️', icon: '☁️' };
      if ([45, 48].includes(code)) return { text: '안개 🌫️', icon: '🌫️' };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { text: '비 내림 🌧️', icon: '🌧️' };
      if ([71, 73, 75, 85, 86].includes(code)) return { text: '눈 ❄️', icon: '❄️' };
      return { text: '구름 조금 ⛅', icon: '⛅' };
    }

    async function loadWeatherData() {
      const city = CITY_COORDS[currentWeatherCity];
      document.getElementById('weatherCityName').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${city.name}`;
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        const data = await res.json();
        const currentTemp = Math.round(data.current.temperature_2m);
        const cond = getWeatherConditionInfo(data.current.weather_code);
        document.getElementById('weatherCurrentTemp').innerText = `${currentTemp}°C`;
        document.getElementById('weatherConditionText').innerText = cond.text;
        document.getElementById('weatherHumidity').innerText = `${data.current.relative_humidity_2m}%`;
        document.getElementById('weatherWind').innerText = `${Math.round(data.current.wind_speed_10m)}m/s`;
        const todayRainProb = data.daily.precipitation_probability_max[0] || 0;
        document.getElementById('weatherRainProb').innerText = `${todayRainProb}%`;

        const forecastContainer = document.getElementById('weatherForecastContainer');
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        forecastContainer.innerHTML = data.daily.time.map((t, idx) => {
          const dateObj = new Date(t);
          const dayName = idx === 0 ? '오늘' : `${days[dateObj.getDay()]} (${dateObj.getMonth()+1}/${dateObj.getDate()})`;
          const maxTemp = Math.round(data.daily.temperature_2m_max[idx]);
          const minTemp = Math.round(data.daily.temperature_2m_min[idx]);
          const dayCond = getWeatherConditionInfo(data.daily.weather_code[idx]);
          return `
            <div class="forecast-card">
              <div class="forecast-day">${dayName}</div>
              <div class="forecast-icon">${dayCond.icon}</div>
              <div class="forecast-temp">${maxTemp}° / <span style="color:#8395a7;">${minTemp}°</span></div>
            </div>
          `;
        }).join('');

        let tipText = currentTemp >= 28 ? '<b>☀️ 한여름 무더위:</b> 얇은 옷과 양산, 선글라스를 챙기세요.' : (currentTemp >= 20 ? '<b>🌿 쾌적한 날씨:</b> 가벼운 가디건을 걸치기 좋습니다.' : '<b>🧥 쌀쌀한 날씨:</b> 외투를 준비하세요.');
        if (todayRainProb >= 50) tipText += '<br>☔ <b>비 소식이 있습니다:</b> 우산을 가방에 챙겨두세요!';
        document.getElementById('clothTipBox').innerHTML = `<b>💡 ${city.name} 옷차림 & 챙김 팁:</b><br>${tipText}`;
      } catch (err) {
        document.getElementById('weatherConditionText').innerText = '날씨 정보를 불러오지 못했습니다.';
      }
    }

    function openAddModal() {
      if (activeNav === 'places') document.getElementById('itemType').value = 'place';
      else if (activeNav === 'travel') document.getElementById('itemType').value = 'travel';
      else document.getElementById('itemType').value = 'doc';
      toggleFormFields();
      document.getElementById('addModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('itemName').value = '';
      document.getElementById('itemMemo').value = '';
      document.getElementById('travelTime').value = '';
      document.getElementById('docFileInput').value = '';
      tempUploadedFileBase64 = '';
      tempUploadedFileName = '';
    }

    function toggleFormFields() {
      const type = document.getElementById('itemType').value;
      document.getElementById('docFields').style.display = (type === 'doc') ? 'block' : 'none';
      document.getElementById('travelFields').style.display = (type === 'travel') ? 'block' : 'none';
      document.getElementById('placeFields').style.display = (type === 'place') ? 'block' : 'none';
      
      if (type === 'doc') {
        document.getElementById('nameLabel').innerText = '서류 / 티켓 명칭';
        document.getElementById('memoLabel').innerText = '예약번호 및 간단 설명';
      } else if (type === 'place') {
        document.getElementById('nameLabel').innerText = '맛집 / 장소명';
        document.getElementById('memoLabel').innerText = '설명 및 구글지도 링크';
      } else {
        document.getElementById('nameLabel').innerText = '일정 제목 / 장소';
        document.getElementById('memoLabel').innerText = '메모 & 설명';
      }
    }

    function getAutoIcon(text) {
      const t = text.toLowerCase();
      if (t.includes('식사') || t.includes('밥') || t.includes('맛집') || t.includes('점심') || t.includes('저녁') || t.includes('타다')) return 'fa-utensils';
      if (t.includes('카페') || t.includes('커피') || t.includes('스타벅스')) return 'fa-mug-hot';
      if (t.includes('호텔') || t.includes('숙소') || t.includes('체크인') || t.includes('료칸') || t.includes('토요코인')) return 'fa-hotel';
      if (t.includes('쇼핑') || t.includes('가게') || t.includes('마트') || t.includes('구매') || t.includes('양산')) return 'fa-bag-shopping';
      if (t.includes('온천') || t.includes('탕') || t.includes('목욕')) return 'fa-hot-tub-person';
      if (t.includes('공항') || t.includes('비행기') || t.includes('출발') || t.includes('도착')) return 'fa-plane';
      if (t.includes('버스') || t.includes('터미널') || t.includes('이동')) return 'fa-bus';
      return 'fa-location-dot';
    }

    function saveItem() {
      const type = document.getElementById('itemType').value;
      const name = document.getElementById('itemName').value.trim();
      const memo = document.getElementById('itemMemo').value.trim();
      if (!name) return alert('이름을 입력해주세요!');

      if (type === 'doc') {
        const docId = String(Date.now());
        setSyncingStatus();
        docsCollection.doc(docId).set({
          title: name,
          memo: memo,
          fileData: tempUploadedFileBase64,
          fileName: tempUploadedFileName || 'document.jpg',
          createdAt: Date.now()
        }, { merge: true })
        .then(() => {
          setOnlineStatus();
          closeModal();
        })
        .catch(err => {
          console.error("서류 저장 실패:", err);
          setOnlineStatus();
          alert("저장 실패 (이미지 용량이 너무 클 수 있습니다): " + err.message);
        });
      } else if (type === 'travel') {
        if (!appData.travel) appData.travel = [];
        const chosenDay = parseInt(document.getElementById('travelDay').value);
        const timeInput = document.getElementById('travelTime').value.trim() || '시간 미정';
        appData.travel.push({
          id: Date.now(),
          day: chosenDay,
          time: timeInput,
          title: name,
          memo: memo,
          query: name,
          icon: getAutoIcon(name + ' ' + memo),
          showMap: true
        });
        saveData();
        switchDay(chosenDay, document.querySelectorAll('#dayTabs .sub-tab-btn')[chosenDay - 1]);
        closeModal();
      } else {
        if (!appData.places) appData.places = [];
        const chosenRegion = document.getElementById('placeRegion').value;
        const chosenCategory = document.getElementById('placeCategory').value;
        appData.places.push({
          id: Date.now(),
          region: chosenRegion,
          category: chosenCategory,
          title: name,
          desc: memo,
          query: name
        });
        saveData();
        switchPlaceRegion(chosenRegion);
        closeModal();
      }
    }

    calculateDDay();
    renderAll();
  </script>
</body>
</html>
