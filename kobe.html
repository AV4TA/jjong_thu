<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>고베 & 아리마 온천 여행 🇯🇵</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root { --primary: #ff5e7e; --bg: #f8f9fe; --text: #2d3436; --text-sub: #8395a7; --border: #f1f2f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: var(--bg); padding-bottom: 90px; }
    
    .app-header { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color: white; padding: 20px; border-radius: 0 0 28px 28px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 15px; }
    .btn-home { color: white; text-decoration: none; font-size: 1.2rem; }
    .container { max-width: 540px; margin: 0 auto; padding: 16px; }
    
    .tab-view { display: none; } .tab-view.active { display: block; }
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .sub-tab-btn { background: white; border: 1px solid var(--border); color: var(--text-sub); padding: 8px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .sub-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .card { background: white; border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    .fab { position: fixed; right: 20px; bottom: 86px; width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; z-index: 50; border: none; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; box-shadow: 0 -4px 16px rgba(0,0,0,0.05); display: flex; z-index: 50; border-radius: 20px 20px 0 0; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #a4b0be; font-size: 0.7rem; cursor: pointer; border: none; background: none; }
    .nav-item.active { color: var(--primary); }
    
    .sync-status { font-size: 0.7rem; color: var(--text-sub); text-align: right; margin-bottom: 10px; }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i></a>
    <div class="header-title">고베 & 아리마 온천 🇯🇵</div>
  </header>

  <div class="container">
    <div class="sync-status" id="syncStatus">서버 연결 중...</div>

    <div id="view-travel" class="tab-view active">
      <div id="checklistContainer"></div>
    </div>
    <div id="view-places" class="tab-view">맛집 목록</div>
    <div id="view-weather" class="tab-view">날씨 정보</div>
  </div>

  <button class="fab" onclick="alert('추가')"><i class="fa-solid fa-plus"></i></button>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('travel', this)"><i class="fa-solid fa-plane"></i><span>일정</span></button>
    <button class="nav-item" onclick="switchTab('places', this)"><i class="fa-solid fa-utensils"></i><span>맛집</span></button>
    <button class="nav-item" onclick="switchTab('weather', this)"><i class="fa-solid fa-cloud-sun"></i><span>날씨</span></button>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 데이터 초기화
    let appData = { checklistThu: [], checklistJjong: [], travel: [], places: [] };
    const syncStatus = document.getElementById('syncStatus');

    // DB 연결
    db.collection("couple_space").doc("shared_data").onSnapshot(doc => {
      if (doc.exists) {
        appData = doc.data();
        syncStatus.innerText = "동기화 완료";
        renderAll();
      } else {
        syncStatus.innerText = "데이터 없음 (초기화 필요)";
      }
    }, err => {
      console.error(err);
      syncStatus.innerText = "연결 오류: " + err.message;
    });

    function renderAll() {
      // 렌더링 로직
      console.log("데이터 로드됨:", appData);
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + tabId).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
