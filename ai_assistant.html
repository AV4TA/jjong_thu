<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뚜❣️쫑 - 진짜 AI 비서 🤖</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff859b" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #ff859b;
      --primary-soft: #fff2f4;
      --bg: #f8f9fc;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #edf2f7;
      --shadow: 0 8px 20px rgba(255, 133, 155, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* 상단 헤더 */
    .app-header {
      background: linear-gradient(135deg, #ffa6b6 0%, #ff859b 100%);
      color: white;
      padding: 20px 18px 16px 18px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(255, 133, 155, 0.2);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.25);
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.2rem; font-weight: 800; }
    .header-sub { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; }

    /* 채팅 영역 */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .chat-bubble.ai {
      background: white;
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .chat-bubble.user {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(255, 133, 155, 0.2);
    }

    /* 하단 입력 영역 */
    .chat-input-area {
      background: white;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      outline: none;
      font-size: 0.95rem;
    }
    .chat-input:focus { border-color: var(--primary); }
    .btn-send {
      background: var(--primary);
      color: white;
      border: none;
      width: 46px; height: 46px;
      border-radius: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(255, 133, 155, 0.3);
    }
    .btn-send:active { transform: scale(0.95); }

    /* 추천 질문 칩 */
    .chips-area {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      overflow-x: auto;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .chips-area::-webkit-scrollbar { display: none; }
    .chip {
      background: white;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-sub);
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .chip:active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="btn-home" title="메인으로"><i class="fa-solid fa-house"></i></a>
    <div>
      <div class="header-title">뚜❣️쫑 AI 비서 🤖</div>
      <div class="header-sub">Gemini API 기반 스마트 커플 비서</div>
    </div>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="chat-bubble ai">
      안녕! 모바일 연동 완료된 AI 비서야. 💖<br>
      일정 등록이나 오늘 야구 직관 결과를 편하게 말해줘!
    </div>
  </div>

  <div class="chips-area">
    <div class="chip" onclick="sendQuickMessage('우리 이번 주 일정 알려줘')">📅 이번 주 일정 조회</div>
    <div class="chip" onclick="sendQuickMessage('오늘 야구 직관했는데 이겼어!')">⚾ 야구 직관 (승리) 기록</div>
    <div class="chip" onclick="sendQuickMessage('다음 주 금요일에 데이트 일정 추가해줘')">🗓️ 일정 등록 테스트</div>
  </div>

  <div class="chat-input-area">
    <input type="text" class="chat-input" id="chatInput" placeholder="무엇을 도와드릴까요?" onkeypress="if(event.key==='Enter') handleSend()">
    <button class="btn-send" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6J3ixPpQ06Y5vYdyBbLMY3GBjzZlg9cZXpiqE0SKy3gKQ";

    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const coupleCol = db.collection("couple_space").doc("data").collection("couple_calendar");
    const baseballCol = db.collection("couple_space").doc("data").collection("baseball_games");

    const chatContainer = document.getElementById('chatContainer');
    const chatInput = document.getElementById('chatInput');

    let allEvents = [];
    coupleCol.onSnapshot(snapshot => {
      allEvents = [];
      snapshot.forEach(doc => allEvents.push({ id: doc.id, ...doc.data() }));
    });

    let serverBaseballData = {};
    async function loadBaseballJson() {
      try {
        const res = await fetch('./baseball.json?t=' + Date.now());
        if (res.ok) {
          serverBaseballData = await res.json();
        }
      } catch(e) { console.warn("baseball.json 로드 대기", e); }
    }
    loadBaseballJson();

    const teamFullMap = {
      'LG': 'LG 트윈스', 'SSG': 'SSG 랜더스', '두산': '두산 베어스', 'KIA': 'KIA 타이거즈',
      '삼성': '삼성 라이온즈', '롯데': '롯데 자이언츠', '한화': '한화 이글스', 'NC': 'NC 다이노스', '키움': '키움 히어로즈', 'KT': 'kt wiz'
    };

    function normalizeTeam(name) {
      if (!name) return '상대팀';
      for (const [k, v] of Object.entries(teamFullMap)) {
        if (name.includes(k)) return v;
      }
      return name;
    }

    function appendMessage(text, sender) {
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${sender}`;
      bubble.innerHTML = text.replace(/\n/g, '<br>');
      chatContainer.appendChild(bubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function sendQuickMessage(text) {
      chatInput.value = text;
      handleSend();
    }

    async function handleSend() {
      const text = chatInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      chatInput.value = '';

      appendMessage("생각 중...", 'ai');
      const lastBubble = chatContainer.lastChild;

      try {
        const todayObj = new Date();
        const year = todayObj.getFullYear();
        const month = String(todayObj.getMonth() + 1).padStart(2, '0');
        const day = String(todayObj.getDate()).padStart(2, '0');
        const todayStr = `${year}-${month}-${day}`;

        const prompt = `
          너는 커플 캘린더와 야구 직관 기록을 관리하는 스마트 AI 비서야.
          현재 날짜는 ${todayStr} 이고, 등록된 일정 데이터는 다음과 같아:
          ${JSON.stringify(allEvents)}

          사용자의 메시지: "${text}"

          사용자의 요청을 분석하여 다음 중 하나의 JSON 형태로만 답변해줘 (마크다운 백틱 없이 순수 JSON 또는 일반 텍스트):
          1. 일정을 조회하거나 일반 대화인 경우:
             {"type": "chat", "message": "사용자에게 보낼 친근한 답변"}
          2. 커플 캘린더에 일정을 등록해달라는 경우:
             {"type": "add_calendar", "startDate": "YYYY-MM-DD", "endDate": "YYYY-MM-DD", "title": "일정제목", "message": "등록 완료 안내 메시지"}
          3. 야구 직관 결과를 기록해달라는 경우 (이겼어/졌어 등):
             {"type": "add_baseball", "result": "win 또는 lose", "message": "직관 기록 완료 안내 메시지"}
        `;

        // 💡 가장 호환성이 뛰어난 gemini-2.5-flash 모델 및 표준 엔드포인트 적용
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        lastBubble.remove();

        if (data.error) {
          throw new Error(data.error.message || 'API 통신 오류');
        }

        const rawText = data.candidates[0].content.parts[0].text.trim();

        let jsonRes;
        try {
          const cleanJsonStr = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          jsonRes = JSON.parse(cleanJsonStr);
        } catch (e) {
          appendMessage(rawText, 'ai');
          return;
        }

        if (jsonRes.type === 'chat') {
          appendMessage(jsonRes.message, 'ai');
        } 
        else if (jsonRes.type === 'add_calendar') {
          await coupleCol.add({
            startDate: jsonRes.startDate,
            endDate: jsonRes.endDate || jsonRes.startDate,
            title: jsonRes.title,
            color: "#ff859b",
            manualOverride: true,
            createdAt: Date.now()
          });
          appendMessage(jsonRes.message || "일정이 캘린더에 쏙 등록되었어! ✨", 'ai');
        } 
        else if (jsonRes.type === 'add_baseball') {
          let matchInfo = serverBaseballData.schedule && serverBaseballData.schedule[todayStr];
          let opponent = matchInfo ? normalizeTeam(matchInfo.opponent) : "kt wiz 공식 경기";
          let stadium = matchInfo ? matchInfo.stadium : "수원 위즈파크 (홈)";
          let score = matchInfo ? matchInfo.score : (jsonRes.result === 'win' ? "KT 승" : "KT 패");

          await baseballCol.doc(String(Date.now())).set({
            date: todayStr,
            opponent: opponent,
            result: jsonRes.result,
            score: score,
            stadium: stadium,
            createdAt: Date.now()
          });
          appendMessage(`오늘(${todayStr}) ${opponent}전 직관 결과가 [야구 직관 페이지]에 안전하게 기록되었어! ⚾`, 'ai');
        }

      } catch (err) {
        console.error(err);
        lastBubble.remove();
        appendMessage(`앗, 통신 중 오류가 발생했어: ${err.message}`, 'ai');
      }
    }
  </script>
</body>
</html>
