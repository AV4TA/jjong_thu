<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뚜❣️쫑 - 커플 AI 비서 🤖</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff859b" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #ff859b;
      --primary-soft: #fff2f4;
      --bg: #f8f9fc;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #edf2f7;
      --shadow: 0 8px 20px rgba(255, 133, 155, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* 상단 헤더 */
    .app-header {
      background: linear-gradient(135deg, #ffa6b6 0%, #ff859b 100%);
      color: white;
      padding: 20px 18px 16px 18px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(255, 133, 155, 0.2);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.25);
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.2rem; font-weight: 800; }
    .header-sub { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; }

    /* 채팅 영역 */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .chat-bubble.ai {
      background: white;
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .chat-bubble.user {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(255, 133, 155, 0.2);
    }

    /* 하단 입력 영역 */
    .chat-input-area {
      background: white;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      outline: none;
      font-size: 0.95rem;
    }
    .chat-input:focus { border-color: var(--primary); }
    .btn-send {
      background: var(--primary);
      color: white;
      border: none;
      width: 46px; height: 46px;
      border-radius: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(255, 133, 155, 0.3);
    }
    .btn-send:active { transform: scale(0.95); }

    /* 추천 질문 칩 */
    .chips-area {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      overflow-x: auto;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .chips-area::-webkit-scrollbar { display: none; }
    .chip {
      background: white;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-sub);
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .chip:active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="btn-home" title="메인으로"><i class="fa-solid fa-house"></i></a>
    <div>
      <div class="header-title">뚜❣️쫑 AI 비서 🤖</div>
      <div class="header-sub">두 분의 캘린더와 직관 일기를 관리해드려요!</div>
    </div>
  </header>

  <!-- 채팅 대화 내용 영역 -->
  <div class="chat-container" id="chatContainer">
    <div class="chat-bubble ai">
      안녕! 나는 뚜❣️쫑 커플의 전용 AI 비서야. 💖<br>
      "오늘 우리 일정 뭐야?"라고 물어보거나, "오늘 야구 직관했는데 졌어"라고 말해주면 오늘 날짜 기준으로 직관 일기에 척척 반영해 줄게!
    </div>
  </div>

  <!-- 빠른 추천 질문 칩 -->
  <div class="chips-area">
    <div class="chip" onclick="sendQuickMessage('우리 이번 주 일정 뭐야?')">📅 이번 주 일정 조회</div>
    <div class="chip" onclick="sendQuickMessage('오늘 직관했는데 졌어')">⚾ 야구 직관 (패배) 기록</div>
    <div class="chip" onclick="sendQuickMessage('오늘 직관해서 이겼어')">⚾ 야구 직관 (승리) 기록</div>
  </div>

  <!-- 메시지 입력창 -->
  <div class="chat-input-area">
    <input type="text" class="chat-input" id="chatInput" placeholder="메시지를 입력해보세요..." onkeypress="if(event.key==='Enter') handleSend()">
    <button class="btn-send" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const coupleCol = db.collection("couple_space").doc("data").collection("couple_calendar");
    const baseballCol = db.collection("couple_space").doc("data").collection("baseball_games");

    const chatContainer = document.getElementById('chatContainer');
    const chatInput = document.getElementById('chatInput');

    let allEvents = [];
    let serverBaseballData = {};

    // 1. 캘린더 데이터 실시간 로드
    coupleCol.onSnapshot(snapshot => {
      allEvents = [];
      snapshot.forEach(doc => {
        allEvents.push({ id: doc.id, ...doc.data() });
      });
    });

    // 2. 직관 및 야구 데이터 (baseball.json) 로드
    async function loadBaseballJson() {
      try {
        const res = await fetch('./baseball.json?t=' + Date.now());
        if (res.ok) {
          serverBaseballData = await res.json();
        }
      } catch(e) { console.warn("baseball.json 로드 대기", e); }
    }
    loadBaseballJson();

    function appendMessage(text, sender) {
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${sender}`;
      bubble.innerHTML = text.replace(/\n/g, '<br>');
      chatContainer.appendChild(bubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function sendQuickMessage(text) {
      chatInput.value = text;
      handleSend();
    }

    async function handleSend() {
      const text = chatInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      chatInput.value = '';

      setTimeout(() => {
        generateAIResponse(text);
      }, 500);
    }

    function generateAIResponse(query) {
      const lowerQ = query.toLowerCase();

      // [기능 1] 일정 조회 관련
      if (lowerQ.includes('일정') || lowerQ.includes('뭐야') || lowerQ.includes('알려줘')) {
        if (allEvents.length === 0) {
          appendMessage("현재 등록된 커플 일정이 없어요! 캘린더에서 일정을 추가해 보세요.", 'ai');
          return;
        }

        allEvents.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
        
        let responseHTML = "현재 등록된 주요 일정들이야! 📌<br><br>";
        allEvents.slice(0, 5).forEach(ev => {
          const dateStr = ev.startDate === ev.endDate ? ev.startDate : `${ev.startDate} ~ ${ev.endDate}`;
          responseHTML += `• <b>${ev.title}</b> (${dateStr})<br>`;
        });
        appendMessage(responseHTML, 'ai');
      } 
      // [기능 2] 야구 직관 관련 기록 (실제 오늘 날짜로 `baseball_games`에 저장)
      else if (lowerQ.includes('직관') || lowerQ.includes('야구') || lowerQ.includes('졌어') || lowerQ.includes('이겼어')) {
        // 💡 실제 기기의 오늘 날짜를 자동으로 가져옴 (YYYY-MM-DD 형식)
        const todayObj = new Date();
        const year = todayObj.getFullYear();
        const month = String(todayObj.getMonth() + 1).padStart(2, '0');
        const day = String(todayObj.getDate()).padStart(2, '0');
        const todayStr = `${year}-${month}-${day}`;
        
        let resultType = 'lose';
        let resultMsg = "패배 ㅠㅠ 아쉽지만 다음엔 꼭 이길 거예요!";
        if (lowerQ.includes('이겼') || lowerQ.includes('승리')) {
          resultType = 'win';
          resultMsg = "승리! 🧚 역시 승리요정 최고예요!";
        }

        // baseball.json 스케줄에서 오늘 날짜 정보 매칭 시도
        let matchInfo = serverBaseballData.schedule && serverBaseballData.schedule[todayStr];
        let opponent = matchInfo ? matchInfo.opponent : "LG 트윈스";
        let score = matchInfo ? matchInfo.score : "KT 3 : 4 " + (resultType === 'win' ? '승' : '패');
        let stadium = matchInfo ? matchInfo.stadium : "수원 위즈파크 (홈)";

        baseballCol.doc(String(Date.now())).set({
          date: todayStr,
          opponent: opponent,
          result: resultType,
          score: score,
          stadium: stadium,
          createdAt: Date.now()
        }).then(() => {
          appendMessage(`오늘(${todayStr}) 야구 직관 결과(${resultType === 'win' ? '승리' : '패배'})를 <b>[야구 직관 페이지]</b>에 쏙 저장해 뒀어! ⚾<br>${resultMsg}`, 'ai');
        }).catch(err => {
          appendMessage("직관 기록 저장 중 오류가 발생했어 ㅠㅠ 다시 시도해줘!", 'ai');
        });
      }
      // [기능 3] 일반 대화
      else {
        appendMessage("헤헤, 우리 커플 캘린더나 야구 직관 기록에 대해 궁금한 점이 있으면 언제든 편하게 물어봐줘! 💕", 'ai');
      }
    }
  </script>
</body>
</html>
