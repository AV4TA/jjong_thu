  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #ffe8ee;
      --primary-dark: #e04565;
      --accent: #6c5ce7;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    .app-header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      padding: 20px 18px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.25);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.25rem; font-weight: 800; }
    .d-day-pill {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      justify-content: flex-end;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #a4b0be; transition: background 0.3s; }
    .sync-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    .sync-dot.syncing { background: #ffa502; }

    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .sub-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tab-btn {
      background: white;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sub-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(255, 94, 126, 0.3);
    }

    .region-switch-row {
      display: flex;
      background: #f1f2f6;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 12px;
      gap: 6px;
    }
    .region-btn {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #636e72;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .region-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .category-sub-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .category-sub-tabs::-webkit-scrollbar { display: none; }
    .cat-chip-btn {
      background: white;
      border: 1px solid var(--border);
      color: #636e72;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-chip-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 800;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.02);
    }

    .checklist-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 117, 140, 0.15);
      margin-bottom: 16px;
    }
    .person-switch-row { display: flex; background: #f1f2f6; padding: 4px; border-radius: 14px; margin-bottom: 16px; gap: 4px; }
    .person-btn {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #636e72;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .person-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .progress-wrap { margin-bottom: 16px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; color: #2d3436; }
    .progress-bar-bg { height: 10px; background: #f1f2f6; border-radius: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #ff758c, #ff5e7e); width: 0%; transition: width 0.3s ease; border-radius: 8px; }

    .check-add-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .check-input { flex: 1; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.88rem; outline: none; }
    .btn-add-item { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }

    .checklist-items { display: flex; flex-direction: column; gap: 8px; }
    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fdfdfd;
      border: 1px solid #f1f2f6;
      padding: 12px 14px;
      border-radius: 14px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .check-row.checked { background: #f8f9fa; border-color: #e9ecef; opacity: 0.6; }
    .check-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #dcdde1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.75rem;
    }
    .check-row.checked .custom-checkbox { background: var(--primary); border-color: var(--primary); }
    .check-text { font-size: 0.92rem; font-weight: 600; color: #2d3436; }
