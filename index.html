<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Kobe Trip & Memory</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="고베여행❤️" />
  <meta name="theme-color" content="#ff758c" />
  
  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:sparkling-heart.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:sparkling-heart.svg" />

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase v9 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #ffe8ee;
      --primary-dark: #e04565;
      --accent: #6c5ce7;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Header */
    .app-header { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color: white; padding: 26px 20px 20px; border-radius: 0 0 28px 28px; box-shadow: 0 6px 20px rgba(255, 117, 140, 0.3); position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 1.35rem; font-weight: 700; }
    .d-day-pill { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    .container { max-width: 540px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }
    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 12px; justify-content: flex-end; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #a4b0be; transition: background 0.3s; }
    .sync-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    .sync-dot.syncing { background: #ffa502; }

    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .sub-tab-btn { background: white; border: 1px solid var(--border); color: var(--text-sub); padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .sub-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(255, 94, 126, 0.3); }

    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.02); }
    .checklist-card { background: white; border-radius: 20px; padding: 20px; box-shadow: var(--shadow); border: 1px solid rgba(255, 117, 140, 0.15); }
    .person-switch-row { display: flex; background: #f1f2f6; padding: 4px; border-radius: 14px; margin-bottom: 16px; gap: 4px; }
    .person-btn { flex: 1; border: none; padding: 10px; border-radius: 10px; font-size: 0.88rem; font-weight: 700; color: #636e72; background: transparent; cursor: pointer; transition: all 0.2s; }
    .person-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .progress-wrap { margin-bottom: 16px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; color: #2d3436; }
    .progress-bar-bg { height: 10px; background: #f1f2f6; border-radius: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #ff758c, #ff5e7e); width: 0%; transition: width 0.3s ease; border-radius: 8px; }
    .check-add-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .check-input { flex: 1; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.88rem; outline: none; }
    .btn-add-item { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .checklist-items { display: flex; flex-direction: column; gap: 8px; }
    .check-row { display: flex; align-items: center; justify-content: space-between; background: #fdfdfd; border: 1px solid #f1f2f6; padding: 12px 14px; border-radius: 14px; transition: all 0.2s; cursor: pointer; }
    .check-row.checked { background: #f8f9fa; border-color: #e9ecef; opacity: 0.6; }
    .custom-checkbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #dcdde1; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.75rem; }
    .check-row.checked .custom-checkbox { background: var(--primary); border-color: var(--primary); }
    .check-text { font-size: 0.92rem; font-weight: 600; color: #2d3436; margin-left: 12px; }
    .check-row.checked .check-text { text-decoration: line-through; color: #a4b0be; }
    .btn-del-check { background: none; border: none; color: #ff7675; cursor: pointer; }

    /* Map & Weather */
    .map-container { width: 100%; max-width: 350px; margin: 20px auto; }
    .region { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 1; cursor: pointer; transition: fill 0.3s; }
    .region.visited { fill: var(--primary); stroke: white; }
    .region-text { font-size: 8px; font-weight: 700; fill: #7f8c8d; pointer-events: none; }
    .weather-hero { background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%); color: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(9, 132, 227, 0.25); }
    .weather-hero-top { display: flex; justify-content: space-between; align-items: center; }
    .weather-city-name { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .weather-main-temp { font-size: 2.8rem; font-weight: 800; line-height: 1; margin: 12px 0 6px; }
    .weather-condition { font-size: 0.95rem; font-weight: 600; opacity: 0.95; }
    .weather-extra-info { display: flex; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.25); font-size: 0.8rem; }
    .weather-forecast-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
    .forecast-card { background: white; border-radius: 14px; padding: 12px 10px; min-width: 74px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); flex-shrink: 0; }
    .forecast-day { font-size: 0.75rem; font-weight: 700; color: #636e72; margin-bottom: 4px; }
    .forecast-icon { font-size: 1.3rem; margin: 4px 0; }
    .forecast-temp { font-size: 0.78rem; font-weight: 700; color: #2d3436; }
    .cloth-tip-box { background: #fff8e7; border: 1px solid #ffeaa7; border-radius: 16px; padding: 16px; font-size: 0.84rem; color: #634a00; line-height: 1.5; }

    /* Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; box-shadow: 0 -4px 16px rgba(0,0,0,0.05); display: flex; z-index: 50; border-radius: 20px 20px 0 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #a4b0be; font-size: 0.65rem; font-weight: 600; cursor: pointer; border: none; background: none; width: 20%; }
    .nav-item i { font-size: 1.1rem; margin-bottom: 3px; }
    .nav-item.active { color: var(--primary); }
    .fab { position: fixed; right: 20px; bottom: 86px; width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 8px 20px rgba(255, 94, 126, 0.4); cursor: pointer; border: none; z-index: 50; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div>
        <div class="header-title">고베 & 아리마 온천 여행 🇯🇵</div>
        <p style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">2026.08.30 ~ 09.02</p>
      </div>
      <div class="d-day-pill"><i class="fa-solid fa-heart"></i><span id="ddayText">D-Day 계산중</span></div>
    </div>
  </header>

  <div class="container">
    <div class="sync-status"><div class="sync-dot" id="syncDot"></div><span id="syncStatusText">동기화 중...</span></div>

    <!-- 1. 여행 일정 -->
    <div id="view-travel" class="tab-view active">
      <div class="sub-tabs" id="dayTabs">
        <button class="sub-tab-btn active" onclick="switchDay('ready', this)">🧳 여행준비</button>
        <button class="sub-tab-btn" onclick="switchDay(1, this)">Day 1</button>
        <button class="sub-tab-btn" onclick="switchDay(2, this)">Day 2</button>
        <button class="sub-tab-btn" onclick="switchDay(3, this)">Day 3</button>
      </div>
      <div id="readyChecklistSection" class="checklist-card">
        <div class="person-switch-row">
          <button class="person-btn active" id="btnPersonThu" onclick="switchPerson('thu')">👸 뚜</button>
          <button class="person-btn" id="btnPersonJjong" onclick="switchPerson('jjong')">🤴 쫑</button>
        </div>
        <div class="progress-wrap">
            <div class="progress-header"><span id="progressTitle"></span><span id="progressText"></span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill"></div></div>
        </div>
        <div class="check-add-box">
          <input type="text" id="newCheckInput" class="check-input" placeholder="새 준비물">
          <button class="btn-add-item" onclick="addCheckItem()">+</button>
        </div>
        <div class="checklist-items" id="checklistContainer"></div>
      </div>
      <div id="timelineContainer" style="display:none;"></div>
    </div>

    <!-- 2. 맛집 -->
    <div id="view-places" class="tab-view">
        <div id="placesContainer"></div>
    </div>

    <!-- 3. 날씨 (순서 변경) -->
    <div id="view-weather" class="tab-view">
        <div class="weather-hero" id="weatherHeroBox">
            <div class="weather-city-name" id="weatherCityName">고베 시내</div>
            <div class="weather-main-temp" id="weatherCurrentTemp">--°</div>
            <div class="weather-condition" id="weatherConditionText">불러오는 중...</div>
        </div>
        <div class="weather-forecast-row" id="weatherForecastContainer"></div>
    </div>

    <!-- 4. 지도 (순서 변경) -->
    <div id="view-map" class="tab-view">
      <div class="card">
        <h3 style="margin-bottom: 10px;">우리가 여행한 지역 🗺️</h3>
        <div class="map-container">
          <svg viewBox="0 0 400 500">
             <path id="seoul" class="region" d="M150,100 L170,100 L170,120 L150,120 Z" onclick="toggleRegion('seoul')" />
          </svg>
        </div>
        <div id="visitedCount" style="text-align:center; font-weight:700;">0개 지역 방문 중!</div>
      </div>
    </div>

    <!-- 5. 쿠폰 -->
    <div id="view-coupons" class="tab-view">
        <div class="gift-grid" id="gifticonContainer"></div>
    </div>
  </div>

  <button class="fab" id="mainFab" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></button>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchNav('travel', this)"><i class="fa-solid fa-plane"></i><span>일정</span></button>
    <button class="nav-item" onclick="switchNav('places', this)"><i class="fa-solid fa-utensils"></i><span>맛집</span></button>
    <button class="nav-item" onclick="switchNav('weather', this)"><i class="fa-solid fa-cloud-sun"></i><span>날씨</span></button>
    <button class="nav-item" onclick="switchNav('map', this)"><i class="fa-solid fa-map"></i><span>지도</span></button>
    <button class="nav-item" onclick="switchNav('coupons', this)"><i class="fa-solid fa-ticket"></i><span>쿠폰</span></button>
  </nav>

  <script>
    // [기존 로직 유지 + 탭 순서 변경 로직]
    let activeNav = 'travel';
    function switchNav(nav, btn) {
        activeNav = nav;
        document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`view-${nav}`).classList.add('active');
        if (btn) btn.classList.add('active');
        // ... weather/map 데이터 로드 함수 호출
    }
    // ... 나머지 데이터 관리 로직은 기존과 동일하게 유지
  </script>
</body>
</html>
