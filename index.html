<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Kobe Trip & Memory</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ff758c" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    :root { --primary: #ff5e7e; --bg: #f8f9fe; --card: #ffffff; --text: #2d3436; --text-sub: #8395a7; --border: #f1f2f6; --radius: 18px; --shadow: 0 8px 20px rgba(0, 0, 0, 0.04); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    
    .app-header { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color: white; padding: 26px 20px 20px; border-radius: 0 0 28px 28px; position: sticky; top: 0; z-index: 10; }
    .container { max-width: 540px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.02); }
    
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .sub-tab-btn { background: white; border: 1px solid var(--border); color: var(--text-sub); padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .sub-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .sort-control { display: flex; gap: 8px; margin-bottom: 12px; font-size: 0.8rem; justify-content: flex-end; }
    .sort-control select { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-sub); }

    .gift-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .gift-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); position: relative; display: flex; flex-direction: column; }
    .gift-card.used { opacity: 0.5; filter: grayscale(85%); }
    .gift-img-wrap { height: 130px; background: #f8f9fc; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .gift-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .gift-dday-badge { position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.65); color: white; font-size: 0.72rem; padding: 4px 8px; border-radius: 8px; }
    .gift-dday-badge.urgent { background: #ff4757; }
    
    .gift-quick-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; z-index: 2; }
    .gift-action-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.9); border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; }
    
    .gift-body { padding: 12px; flex: 1; }
    .gift-brand { font-size: 0.7rem; color: var(--primary); font-weight: 700; }
    .gift-name { font-size: 0.85rem; font-weight: 700; margin: 4px 0; }
    .btn-toggle-use { width: 100%; padding: 6px; border: none; border-radius: 8px; font-size: 0.75rem; font-weight: 700; background: #f1f2f6; color: #57606f; cursor: pointer; }
    .btn-toggle-use.is-used { background: #2ed573; color: white; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: white; border-radius: 24px; width: 100%; max-width: 400px; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .form-control { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; }
    .btn { padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; width: 100%; margin-top: 5px; }
    .btn-primary { background: var(--primary); color: white; }
    .ocr-loader { padding: 10px; background: #ffe8ee; color: var(--primary); font-size: 0.8rem; border-radius: 8px; margin-bottom: 10px; display: none; text-align: center; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div><div class="header-title">고베 & 아리마 온천 여행 🇯🇵</div></div>
    </div>
  </header>

  <div class="container">
    <div id="view-coupons" class="tab-view active">
      <div class="sort-control">
        <select id="sortSelect" onchange="renderGifticons()">
          <option value="dday">기한 임박순</option>
          <option value="name">이름순</option>
          <option value="recent">최신 등록순</option>
        </select>
      </div>
      <div class="gift-grid" id="gifticonContainer"></div>
    </div>
  </div>

  <button class="fab" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></button>

  <!-- 항목 추가/수정 모달 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-bottom:15px;">기프티콘 추가</h3>
      <input type="hidden" id="editItemId">
      
      <div class="form-group">
        <label>쿠폰 사진 (자동인식)</label>
        <input type="file" class="form-control" id="giftImage" accept="image/*" onchange="handleImageOCR(this)">
        <div id="ocrLoader" class="ocr-loader">🔍 AI 분석 중... 기다려주세요</div>
      </div>
      <input type="text" class="form-control" id="giftBrand" placeholder="브랜드명">
      <input type="text" class="form-control" id="itemName" placeholder="상품명">
      <input type="date" class="form-control" id="giftDueDate">
      <textarea class="form-control" id="itemMemo" rows="2" placeholder="메모"></textarea>
      
      <button class="btn btn-primary" onclick="saveItem()">저장하기</button>
      <button class="btn" style="background:#f1f2f6;" onclick="closeModal()">취소</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let appData = { gifticons: [] };

    db.collection("couple_space").doc("shared_data").onSnapshot(doc => {
      if (doc.exists) { appData = doc.data(); renderGifticons(); }
    });

    function saveData() { db.collection("couple_space").doc("shared_data").set(appData); }

    // 1. OCR (이미지 자동 인식)
    function handleImageOCR(input) {
      if (!input.files || !input.files[0]) return;
      document.getElementById('ocrLoader').style.display = 'block';
      Tesseract.recognize(input.files[0], 'kor+eng').then(({ data: { text } }) => {
        document.getElementById('ocrLoader').style.display = 'none';
        
        // 날짜 파싱 (년.월.일 혹은 년-월-일)
        const dateRegex = /(202[0-9])[\.\-\/\s년]\s*([0-1]?[0-9])[\.\-\/\s월]\s*([0-3]?[0-9])/;
        const match = text.match(dateRegex);
        if (match) document.getElementById('giftDueDate').value = `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
        
        // 브랜드/상품명 추출 간단 로직
        const lines = text.split('\n');
        if(lines[0]) document.getElementById('giftBrand').value = lines[0].substring(0, 10);
        if(lines[1]) document.getElementById('itemName').value = lines[1].substring(0, 15);
      });
    }

    // 2. 정렬 로직
    function renderGifticons() {
      const container = document.getElementById('gifticonContainer');
      let list = [...(appData.gifticons || [])];
      const sortType = document.getElementById('sortSelect').value;

      if (sortType === 'dday') list.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
      else if (sortType === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
      else list.sort((a, b) => b.id - a.id);

      container.innerHTML = list.map(g => `
        <div class="gift-card ${g.isUsed ? 'used' : ''}">
          <div class="gift-quick-actions">
            <button class="gift-action-btn" onclick="editGifticon(${g.id})"><i class="fa-solid fa-pen"></i></button>
            <button class="gift-action-btn" onclick="deleteGifticon(${g.id})"><i class="fa-solid fa-trash-can"></i></button>
          </div>
          <div class="gift-img-wrap" onclick="alert('바코드 클릭시 전체화면 기능은 나중에 추가 가능합니다')">
            <img src="${g.img}" alt="쿠폰">
            <div class="gift-dday-badge ${getGiftDDay(g.dueDate).urgent ? 'urgent' : ''}">${g.isUsed ? '사용완료' : getGiftDDay(g.dueDate).text}</div>
          </div>
          <div class="gift-body">
            <div class="gift-brand">${g.brand}</div>
            <div class="gift-name">${g.name}</div>
            <button class="btn-toggle-use ${g.isUsed ? 'is-used' : ''}" onclick="toggleGiftUse(${g.id})">${g.isUsed ? '사용 취소' : '사용하기'}</button>
          </div>
        </div>
      `).join('');
    }

    function toggleGiftUse(id) {
      const g = appData.gifticons.find(i => i.id === id);
      if(g) { g.isUsed = !g.isUsed; saveData(); }
    }
    
    function deleteGifticon(id) {
      if(confirm('삭제할까요?')) {
        appData.gifticons = appData.gifticons.filter(i => i.id !== id);
        saveData();
      }
    }

    function editGifticon(id) {
      const g = appData.gifticons.find(i => i.id === id);
      document.getElementById('editItemId').value = g.id;
      document.getElementById('giftBrand').value = g.brand;
      document.getElementById('itemName').value = g.name;
      document.getElementById('giftDueDate').value = g.dueDate;
      document.getElementById('addModal').classList.add('active');
    }

    function saveItem() {
      const id = parseInt(document.getElementById('editItemId').value);
      const brand = document.getElementById('giftBrand').value;
      const name = document.getElementById('itemName').value;
      const dueDate = document.getElementById('giftDueDate').value;
      
      if(id) {
        const idx = appData.gifticons.findIndex(i => i.id === id);
        appData.gifticons[idx] = { ...appData.gifticons[idx], brand, name, dueDate };
      } else {
        appData.gifticons.push({ id: Date.now(), brand, name, dueDate, isUsed: false, img: 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400' });
      }
      saveData();
      closeModal();
    }

    function closeModal() { document.getElementById('addModal').classList.remove('active'); }
    function openAddModal() { document.getElementById('addModal').classList.add('active'); }
    function getGiftDDay(dateStr) {
        if (!dateStr) return { text: '기한없음', urgent: false };
        const d = new Date(dateStr);
        const today = new Date();
        const diff = Math.ceil((d - today) / (1000*60*60*24));
        return { text: diff < 0 ? '만료' : `D-${diff}`, urgent: diff <= 7 };
    }
  </script>
</body>
</html>
