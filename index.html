<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Love Planner & Storage</title>
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #ffe8ee;
      --primary-dark: #e04565;
      --accent: #6c5ce7;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      padding: 26px 20px 20px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 1.35rem; font-weight: 700; }
    .d-day-pill {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Container */
    .container { max-width: 540px; margin: 0 auto; padding: 16px; }

    /* Tabs */
    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .sub-tab-btn {
      background: white;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sub-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(255, 94, 126, 0.3);
    }

    /* Cards & Timeline */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.02);
    }

    /* Editable Travel Quick Memo */
    .memo-card {
      background: #fff8f8;
      border: 1px solid #ffd1d8;
      margin-bottom: 16px;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .memo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .memo-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #e84393;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .memo-btn {
      background: white;
      border: 1px solid #ffccd5;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .memo-body {
      font-size: 0.82rem;
      color: #555;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .memo-edit-area {
      width: 100%;
      height: 90px;
      border-radius: 10px;
      border: 1px solid #ffccd5;
      padding: 10px;
      font-size: 0.82rem;
      resize: none;
      outline: none;
      display: none;
      font-family: inherit;
    }

    .timeline-item {
      display: flex;
      gap: 14px;
      position: relative;
      padding-bottom: 20px;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 19px;
      top: 36px;
      bottom: 0;
      width: 2px;
      background: #f0f0f5;
    }
    .timeline-item:last-child::before { display: none; }
    .timeline-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      z-index: 1;
    }
    .timeline-content { flex: 1; }
    .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .timeline-time { font-size: 0.78rem; font-weight: 700; color: var(--primary); }
    .timeline-title { font-size: 1.02rem; font-weight: 700; color: #222; margin-bottom: 4px; }
    .timeline-memo { font-size: 0.85rem; color: #636e72; line-height: 1.45; }

    /* Map Box */
    .map-preview-box {
      border-radius: 12px;
      overflow: hidden;
      margin: 10px 0;
      border: 1px solid var(--border);
      height: 160px;
      background: #eef1f6;
    }
    .map-preview-box iframe { width: 100%; height: 100%; border: 0; }

    .btn-maps {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
    }

    /* Gifticon & Places */
    .gift-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .gift-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .gift-card.used { opacity: 0.5; filter: grayscale(85%); }
    .gift-img-wrap {
      height: 120px;
      background: #f1f3f9;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .gift-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .gift-dday-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    .gift-dday-badge.urgent { background: #ff4757; }
    .gift-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .gift-brand { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }
    .gift-name { font-size: 0.88rem; font-weight: 700; color: #2d3436; margin: 2px 0 8px; }
    .gift-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .btn-toggle-use {
      background: #f1f2f6;
      border: none;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: #57606f;
    }
    .btn-toggle-use.is-used { background: #2ed573; color: white; }

    .place-card {
      display: flex;
      gap: 14px;
      align-items: center;
      background: white;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .place-category-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: #fff0f3;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* Floating & Nav */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 86px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 20px rgba(255, 94, 126, 0.4);
      cursor: pointer;
      border: none;
      z-index: 99;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      border-radius: 20px 20px 0 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #a4b0be;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      gap: 4px;
      border: none;
      background: none;
    }
    .nav-item i { font-size: 1.3rem; }
    .nav-item.active { color: var(--primary); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: #555; }
    .form-control { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.9rem; outline: none; }
    .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #f1f2f6; color: #57606f; }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="header-top">
      <div>
        <div class="header-title">고베 여행 & 커플 공간 🇯🇵</div>
        <p style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">2026.08.30 (일) ~ 09.02 (수)</p>
      </div>
      <div class="d-day-pill">
        <i class="fa-solid fa-heart"></i>
        <span id="ddayText">D-Day 계산중</span>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- 1. 여행 일정 탭 -->
    <div id="view-travel" class="tab-view active">
      <div class="sub-tabs" id="dayTabs">
        <button class="sub-tab-btn active" onclick="switchDay(1)">Day 1 (8/30)</button>
        <button class="sub-tab-btn" onclick="switchDay(2)">Day 2 (8/31)</button>
        <button class="sub-tab-btn" onclick="switchDay(3)">Day 3 (9/01)</button>
        <button class="sub-tab-btn" onclick="switchDay(4)">Day 4 (9/02)</button>
      </div>

      <!-- 첫 화면 직접 수정 가능한 여행 메모/체크리스트 -->
      <div class="memo-card">
        <div class="memo-header">
          <div class="memo-title">
            <i class="fa-solid fa-clipboard-check"></i>
            <span>여행 메모 & 체크포인트</span>
          </div>
          <button class="memo-btn" id="memoActionBtn" onclick="toggleMemoEdit()">✏️ 수정</button>
        </div>
        <div class="memo-body" id="memoDisplay"></div>
        <textarea class="memo-edit-area" id="memoInput"></textarea>
      </div>

      <!-- 타임라인 리스트 -->
      <div id="timelineContainer"></div>
    </div>

    <!-- 2. 맛집 / 가볼 곳 탭 -->
    <div id="view-places" class="tab-view">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="filterPlaces('all', this)">전체보기</button>
        <button class="sub-tab-btn" onclick="filterPlaces('맛집', this)">🥩 맛집</button>
        <button class="sub-tab-btn" onclick="filterPlaces('카페', this)">☕ 카페</button>
        <button class="sub-tab-btn" onclick="filterPlaces('명소', this)">🎡 명소</button>
      </div>
      <div id="placesContainer"></div>
    </div>

    <!-- 3. 기프티콘 보관함 탭 -->
    <div id="view-coupons" class="tab-view">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="filterGifticons('available', this)">사용 가능</button>
        <button class="sub-tab-btn" onclick="filterGifticons('all', this)">전체보기</button>
        <button class="sub-tab-btn" onclick="filterGifticons('used', this)">사용 완료</button>
      </div>
      <div class="gift-grid" id="gifticonContainer"></div>
    </div>

  </div>

  <!-- 추가 FAB 버튼 -->
  <button class="fab" onclick="openAddModal()">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- 하단 네비게이션 바 -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchNav('travel', this)">
      <i class="fa-solid fa-plane-departure"></i>
      <span>고베일정</span>
    </button>
    <button class="nav-item" onclick="switchNav('places', this)">
      <i class="fa-solid fa-utensils"></i>
      <span>맛집/가볼곳</span>
    </button>
    <button class="nav-item" onclick="switchNav('coupons', this)">
      <i class="fa-solid fa-ticket"></i>
      <span>기프티콘</span>
    </button>
  </nav>

  <!-- 항목 추가 모달 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <h3 style="font-size: 1.15rem; margin-bottom: 16px;">새 항목 추가</h3>
      
      <div class="form-group">
        <label>구분</label>
        <select class="form-control" id="itemType" onchange="toggleFormFields()">
          <option value="travel">✈️ 여행 일정</option>
          <option value="place">🍽️ 맛집 / 가볼 곳</option>
          <option value="gifticon">🎁 기프티콘</option>
        </select>
      </div>

      <!-- 여행 일정 필드 -->
      <div id="travelFields">
        <div class="form-group">
          <label>일자 (Day)</label>
          <select class="form-control" id="travelDay">
            <option value="1">Day 1 (8/30)</option>
            <option value="2">Day 2 (8/31)</option>
            <option value="3">Day 3 (9/01)</option>
            <option value="4">Day 4 (9/02)</option>
          </select>
        </div>
        <div class="form-group">
          <label>시간 (예: 12:30)</label>
          <input type="text" class="form-control" id="travelTime" placeholder="예: 14:00">
        </div>
      </div>

      <div class="form-group">
        <label id="nameLabel">이름 / 장소명</label>
        <input type="text" class="form-control" id="itemName" placeholder="예: 고베 모리야 본점">
      </div>

      <!-- 기프티콘 필드 -->
      <div id="gifticonFields" style="display:none;">
        <div class="form-group">
          <label>브랜드</label>
          <input type="text" class="form-control" id="giftBrand" placeholder="예: 스타벅스">
        </div>
        <div class="form-group">
          <label>유효기간</label>
          <input type="date" class="form-control" id="giftDueDate">
        </div>
        <div class="form-group">
          <label>바코드/쿠폰 사진 등록</label>
          <input type="file" class="form-control" id="giftImage" accept="image/*">
        </div>
      </div>

      <div class="form-group">
        <label>메모 & 설명</label>
        <textarea class="form-control" id="itemMemo" rows="2" placeholder="메뉴, 예약정보, 준비사항 등"></textarea>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" onclick="saveItem()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 이미지 확대 모달 -->
  <div class="modal-overlay" id="imgViewModal" onclick="closeImgModal()">
    <div style="max-width: 90%; max-height: 80vh;">
      <img id="enlargedImg" src="" style="width: 100%; height: auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    </div>
  </div>

  <script>
    // 기본 여행 데이터 및 첫 화면 메모
  

    let appData = JSON.parse(localStorage.getItem('kobe_couple_app_v3')) || initialKobeData;
    let isEditingMemo = false;
    let currentDay = 1;
    let activeNav = 'travel';
    let currentPlaceFilter = 'all';
    let currentGiftFilter = 'available';

    function saveData() {
      localStorage.setItem('kobe_couple_app_v3', JSON.stringify(appData));
    }

    // 첫 화면 메모 렌더링 & 토글 편집
    function renderQuickMemo() {
      document.getElementById('memoDisplay').innerText = appData.quickMemo || '메모를 입력해보세요.';
      document.getElementById('memoInput').value = appData.quickMemo || '';
    }

    function toggleMemoEdit() {
      const displayEl = document.getElementById('memoDisplay');
      const inputEl = document.getElementById('memoInput');
      const btnEl = document.getElementById('memoActionBtn');

      if (!isEditingMemo) {
        // 수정 모드 진입
        isEditingMemo = true;
        displayEl.style.display = 'none';
        inputEl.style.display = 'block';
        inputEl.focus();
        btnEl.innerText = '💾 저장';
      } else {
        // 저장 처리
        isEditingMemo = false;
        appData.quickMemo = inputEl.value;
        saveData();
        displayEl.innerText = appData.quickMemo;
        displayEl.style.display = 'block';
        inputEl.style.display = 'none';
        btnEl.innerText = '✏️ 수정';
      }
    }

    // D-Day 계산
    function calculateDDay() {
      const tripDate = new Date('2026-08-30');
      const today = new Date();
      tripDate.setHours(0,0,0,0);
      today.setHours(0,0,0,0);
      const diff = Math.ceil((tripDate - today) / (1000 * 60 * 60 * 24));
      
      const el = document.getElementById('ddayText');
      if (diff > 0) el.innerText = `고베 D-${diff}`;
      else if (diff === 0) el.innerText = `고베 D-Day 오늘 출발! ✈️`;
      else if (diff >= -3) el.innerText = `고베 여행 중 (${Math.abs(diff)+1}일차) 🇯🇵`;
      else el.innerText = `고베 여행 추억 💖`;
    }

    // 네비게이션 전환
    function switchNav(nav, btn) {
      activeNav = nav;
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`view-${nav}`).classList.add('active');
      btn.classList.add('active');

      if (nav === 'travel') renderTravel();
      if (nav === 'places') renderPlaces();
      if (nav === 'coupons') renderGifticons();
    }

    // 여행 Day 탭 전환
    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('#dayTabs .sub-tab-btn').forEach((b, idx) => {
        b.classList.toggle('active', idx + 1 === day);
      });
      renderTravel();
    }

    // 여행 타임라인 렌더링
    function renderTravel() {
      const container = document.getElementById('timelineContainer');
      const items = appData.travel.filter(i => i.day === currentDay);

      if (items.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#a4b0be; padding:30px;">등록된 일정이 없습니다. + 버튼을 눌러 추가해보세요!</div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="card timeline-item">
          <div class="timeline-icon"><i class="fa-solid ${item.icon || 'fa-location-dot'}"></i></div>
          <div class="timeline-content">
            <div class="timeline-header">
              <span class="timeline-time">${item.time || '시간 미정'}</span>
              <button onclick="deleteTravel(${item.id})" style="border:none; background:none; color:#ff7675; cursor:pointer; font-size:0.8rem;"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            <div class="timeline-title">${item.title}</div>
            <div class="timeline-memo">${item.memo || ''}</div>
            
            ${item.showMap ? `
              <div class="map-preview-box">
                <iframe src="https://maps.google.com/maps?q=${encodeURIComponent(item.query || item.title)}&t=&z=15&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>
              </div>
            ` : ''}

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <a class="btn-maps" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.query || item.title)}" target="_blank">
                <i class="fa-brands fa-google"></i> 구글 지도에서 보기
              </a>
              <button onclick="toggleMiniMap(${item.id})" style="border:none; background:none; color:#636e72; font-size:0.75rem; cursor:pointer;">
                ${item.showMap ? '🗺️ 미니맵 접기' : '🗺️ 미니맵 보기'}
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleMiniMap(id) {
      const item = appData.travel.find(t => t.id === id);
      if (item) {
        item.showMap = !item.showMap;
        saveData();
        renderTravel();
      }
    }

    function deleteTravel(id) {
      if (confirm('이 일정을 삭제할까요?')) {
        appData.travel = appData.travel.filter(t => t.id !== id);
        saveData();
        renderTravel();
      }
    }

    // 맛집 렌더링
    function filterPlaces(cat, btn) {
      currentPlaceFilter = cat;
      document.querySelectorAll('#view-places .sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPlaces();
    }

    function renderPlaces() {
      const container = document.getElementById('placesContainer');
      const filtered = currentPlaceFilter === 'all' 
        ? appData.places 
        : appData.places.filter(p => p.category === currentPlaceFilter);

      container.innerHTML = filtered.map(p => `
        <div class="place-card">
          <div class="place-category-icon">
            <i class="fa-solid ${p.category === '카페' ? 'fa-mug-hot' : (p.category === '명소' ? 'fa-camera-retro' : 'fa-utensils')}"></i>
          </div>
          <div style="flex:1;">
            <span style="font-size:0.72rem; color:var(--primary); font-weight:700;">#${p.category}</span>
            <div style="font-size:0.98rem; font-weight:700; margin:2px 0;">${p.title}</div>
            <div style="font-size:0.8rem; color:var(--text-sub); line-height:1.3;">${p.desc}</div>
          </div>
          <a class="btn-maps" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.query || p.title)}" target="_blank">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
        </div>
      `).join('');
    }

    // 기프티콘 렌더링
    function filterGifticons(type, btn) {
      currentGiftFilter = type;
      document.querySelectorAll('#view-coupons .sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGifticons();
    }

    function getGiftDDay(dateStr) {
      if (!dateStr) return { text: '기한없음', urgent: false };
      const today = new Date();
      today.setHours(0,0,0,0);
      const due = new Date(dateStr);
      due.setHours(0,0,0,0);
      const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
      
      if (diff < 0) return { text: '만료됨', urgent: true };
      if (diff === 0) return { text: '오늘 마감!', urgent: true };
      return { text: `D-${diff}`, urgent: diff <= 7 };
    }

    function renderGifticons() {
      const container = document.getElementById('gifticonContainer');
      let list = appData.gifticons;
      if (currentGiftFilter === 'available') list = list.filter(g => !g.isUsed);
      if (currentGiftFilter === 'used') list = list.filter(g => g.isUsed);

      container.innerHTML = list.map(g => {
        const dday = getGiftDDay(g.dueDate);
        return `
          <div class="gift-card ${g.isUsed ? 'used' : ''}">
            <div class="gift-img-wrap" onclick="viewImage('${g.img || 'https://via.placeholder.com/300x200?text=Gifticon'}')">
              <img src="${g.img || 'https://via.placeholder.com/300x200?text=Gifticon'}" alt="쿠폰">
              <div class="gift-dday-badge ${dday.urgent ? 'urgent' : ''}">${g.isUsed ? '사용완료' : dday.text}</div>
            </div>
            <div class="gift-body">
              <div>
                <div class="gift-brand">${g.brand}</div>
                <div class="gift-name">${g.name}</div>
              </div>
              <div class="gift-footer">
                <span style="font-size:0.72rem; color:#a4b0be;">~${g.dueDate || '무기한'}</span>
                <button class="btn-toggle-use ${g.isUsed ? 'is-used' : ''}" onclick="toggleGiftUse(${g.id})">
                  ${g.isUsed ? '취소' : '사용'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleGiftUse(id) {
      const g = appData.gifticons.find(item => item.id === id);
      if (g) {
        g.isUsed = !g.isUsed;
        saveData();
        renderGifticons();
      }
    }

    function viewImage(src) {
      document.getElementById('enlargedImg').src = src;
      document.getElementById('imgViewModal').classList.add('active');
    }
    function closeImgModal() {
      document.getElementById('imgViewModal').classList.remove('active');
    }

    // 모달 및 추가 기능
    function openAddModal() {
      document.getElementById('itemType').value = activeNav === 'coupons' ? 'gifticon' : (activeNav === 'places' ? 'place' : 'travel');
      toggleFormFields();
      document.getElementById('addModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('itemName').value = '';
      document.getElementById('itemMemo').value = '';
    }

    function toggleFormFields() {
      const type = document.getElementById('itemType').value;
      document.getElementById('travelFields').style.display = type === 'travel' ? 'block' : 'none';
      document.getElementById('gifticonFields').style.display = type === 'gifticon' ? 'block' : 'none';
      document.getElementById('nameLabel').innerText = type === 'gifticon' ? '쿠폰명' : '이름 / 장소명';
    }

    function saveItem() {
      const type = document.getElementById('itemType').value;
      const name = document.getElementById('itemName').value.trim();
      const memo = document.getElementById('itemMemo').value.trim();
      if (!name) return alert('이름을 입력해주세요!');

      if (type === 'travel') {
        appData.travel.push({
          id: Date.now(),
          day: parseInt(document.getElementById('travelDay').value),
          time: document.getElementById('travelTime').value.trim() || '시간 미정',
          title: name,
          memo: memo,
          query: name,
          icon: 'fa-location-dot',
          showMap: true
        });
        renderTravel();
      } else if (type === 'place') {
        appData.places.push({
          id: Date.now(),
          category: '맛집',
          title: name,
          desc: memo,
          query: name
        });
        renderPlaces();
      } else if (type === 'gifticon') {
        const fileInput = document.getElementById('giftImage');
        const brand = document.getElementById('giftBrand').value.trim() || '기타';
        const dueDate = document.getElementById('giftDueDate').value;

        if (fileInput.files && fileInput.files[0]) {
          const reader = new FileReader();
          reader.onload = function(e) {
            appData.gifticons.push({
              id: Date.now(),
              brand: brand,
              name: name,
              dueDate: dueDate,
              isUsed: false,
              img: e.target.result
            });
            saveData();
            renderGifticons();
          };
          reader.readAsDataURL(fileInput.files[0]);
        } else {
          appData.gifticons.push({
            id: Date.now(),
            brand: brand,
            name: name,
            dueDate: dueDate,
            isUsed: false,
            img: 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400'
          });
          saveData();
          renderGifticons();
        }
      }

      saveData();
      closeModal();
    }

    // 초기 실행
    calculateDDay();
    renderQuickMemo();
    renderTravel();
  </script>
</body>
</html>
