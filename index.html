<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Love Planner & Storage</title>
  <!-- Phosphor Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #ffe8ee;
      --primary-dark: #e04565;
      --accent: #6c5ce7;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 12px 28px rgba(255, 94, 126, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      padding: 30px 20px 24px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.5px; }
    .d-day-pill {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Container */
    .container { max-width: 540px; margin: 0 auto; padding: 18px 16px; }

    /* Tab Contents */
    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Day Selector Tabs for Trip */
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .sub-tab-btn {
      background: white;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sub-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(255, 94, 126, 0.3);
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.02);
      position: relative;
    }

    /* Timeline Items (Travel Plan) */
    .timeline-item {
      display: flex;
      gap: 14px;
      position: relative;
      padding-bottom: 20px;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 19px;
      top: 36px;
      bottom: 0;
      width: 2px;
      background: #f0f0f5;
    }
    .timeline-item:last-child::before { display: none; }
    .timeline-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      z-index: 1;
    }
    .timeline-content { flex: 1; }
    .timeline-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .timeline-time { font-size: 0.78rem; font-weight: 600; color: var(--primary); margin-bottom: 2px; }
    .timeline-title { font-size: 1.02rem; font-weight: 700; color: #222; }
    .timeline-memo { font-size: 0.85rem; color: #636e72; margin: 6px 0 10px; line-height: 1.4; }
    
    /* Map Embed Card */
    .map-preview-box {
      border-radius: 12px;
      overflow: hidden;
      margin: 10px 0;
      border: 1px solid var(--border);
      height: 160px;
      background: #eef1f6;
    }
    .map-preview-box iframe { width: 100%; height: 100%; border: 0; }

    .btn-maps {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-maps:hover { background: #e0e7ff; }

    /* Gifticon Card Grid */
    .gift-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .gift-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .gift-card.used { opacity: 0.55; filter: grayscale(80%); }
    .gift-img-wrap {
      height: 120px;
      background: #f1f3f9;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .gift-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .gift-dday-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    .gift-dday-badge.urgent { background: #ff4757; }
    .gift-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .gift-brand { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }
    .gift-name { font-size: 0.9rem; font-weight: 700; color: #2d3436; margin: 2px 0 8px; }
    .gift-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .gift-due { font-size: 0.72rem; color: #a4b0be; }
    .btn-toggle-use {
      background: #f1f2f6;
      border: none;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: #57606f;
    }
    .btn-toggle-use.is-used { background: #2ed573; color: white; }

    /* Places / Wishlist */
    .place-card {
      display: flex;
      gap: 14px;
      align-items: center;
      background: white;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .place-category-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #fff0f3;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .place-info { flex: 1; }
    .place-title { font-size: 0.98rem; font-weight: 700; margin-bottom: 3px; }
    .place-desc { font-size: 0.8rem; color: var(--text-sub); line-height: 1.3; }

    /* Floating Action Button & Modals */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 86px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 20px rgba(255, 94, 126, 0.4);
      cursor: pointer;
      border: none;
      z-index: 99;
      transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.92); }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      border-radius: 20px 20px 0 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #a4b0be;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      gap: 4px;
      transition: color 0.2s;
      border: none;
      background: none;
    }
    .nav-item i { font-size: 1.3rem; }
    .nav-item.active { color: var(--primary); }

    /* Modal Form */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: #555; }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #f1f2f6; color: #57606f; }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="header-top">
      <div>
        <div class="header-title">우리만의 플래너 ✈️</div>
        <p style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">함께 만드는 여행 & 일상 보관함</p>
      </div>
      <div class="d-day-pill" id="travelDDay">
        <i class="fa-solid fa-heart"></i>
        <span>고베 D-14</span>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- 1. 여행 일정 (Timeline & Mini Map) -->
    <div id="view-travel" class="tab-view active">
      <div class="sub-tabs" id="dayTabs">
        <button class="sub-tab-btn active" onclick="switchDay(1)">Day 1 (8/30)</button>
        <button class="sub-tab-btn" onclick="switchDay(2)">Day 2 (8/31)</button>
        <button class="sub-tab-btn" onclick="switchDay(3)">Day 3 (9/01)</button>
        <button class="sub-tab-btn" onclick="switchDay(4)">Day 4 (9/02)</button>
      </div>

      <div class="card" style="margin-bottom: 16px; background: #fffdf8; border-color: #ffeaa7;">
        <div style="font-size: 0.88rem; font-weight: 700; color: #d63031; margin-bottom: 4px;">
          <i class="fa-solid fa-circle-info"></i> 여행 메모 & 체크
        </div>
        <div style="font-size: 0.8rem; color: #636e72;">
          여권 유효기간 확인, 간사이 쓰루패스/이코카 카드 준비, 변압기(돼지코) 챙기기!
        </div>
      </div>

      <!-- 타임라인 리스트 -->
      <div id="timelineContainer"></div>
    </div>

    <!-- 2. 가고싶은 곳 / 맛집 -->
    <div id="view-places" class="tab-view">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="filterPlaces('all', this)">전체보기</button>
        <button class="sub-tab-btn" onclick="filterPlaces('고베', this)">고베</button>
        <button class="sub-tab-btn" onclick="filterPlaces('오사카', this)">오사카</button>
        <button class="sub-tab-btn" onclick="filterPlaces('카페', this)">카페/디저트</button>
      </div>
      <div id="placesContainer"></div>
    </div>

    <!-- 3. 기프티콘 보관함 -->
    <div id="view-coupons" class="tab-view">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="filterGifticons('available', this)">사용 가능</button>
        <button class="sub-tab-btn" onclick="filterGifticons('all', this)">전체보기</button>
        <button class="sub-tab-btn" onclick="filterGifticons('used', this)">사용 완료</button>
      </div>
      <div class="gift-grid" id="gifticonContainer"></div>
    </div>

  </div>

  <!-- 추가 버튼 (FAB) -->
  <button class="fab" onclick="openAddModal()">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchNav('travel', this)">
      <i class="fa-solid fa-plane-departure"></i>
      <span>여행일정</span>
    </button>
    <button class="nav-item" onclick="switchNav('places', this)">
      <i class="fa-solid fa-utensils"></i>
      <span>맛집/명소</span>
    </button>
    <button class="nav-item" onclick="switchNav('coupons', this)">
      <i class="fa-solid fa-ticket"></i>
      <span>기프티콘</span>
    </button>
  </nav>

  <!-- 항목 추가 모달 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <h3 style="font-size: 1.15rem; margin-bottom: 16px;" id="modalTitle">새 항목 추가</h3>
      
      <div class="form-group">
        <label>구분</label>
        <select class="form-control" id="itemType" onchange="toggleFormFields()">
          <option value="travel">✈️ 여행 일정</option>
          <option value="place">🍽️ 맛집 / 가볼 곳</option>
          <option value="gifticon">🎁 기프티콘</option>
        </select>
      </div>

      <!-- 여행 폼 -->
      <div id="travelFields">
        <div class="form-group">
          <label>일자 (Day)</label>
          <select class="form-control" id="travelDay">
            <option value="1">Day 1</option>
            <option value="2">Day 2</option>
            <option value="3">Day 3</option>
            <option value="4">Day 4</option>
          </select>
        </div>
        <div class="form-group">
          <label>시간 (예: 12:30)</label>
          <input type="text" class="form-control" id="travelTime" placeholder="12:30">
        </div>
      </div>

      <div class="form-group">
        <label id="nameLabel">이름 / 장소명</label>
        <input type="text" class="form-control" id="itemName" placeholder="예: 고베 모리야 스테이크 본점">
      </div>

      <!-- 기프티콘 전용 필드 -->
      <div id="gifticonFields" style="display:none;">
        <div class="form-group">
          <label>브랜드</label>
          <input type="text" class="form-control" id="giftBrand" placeholder="예: 스타벅스, BHC">
        </div>
        <div class="form-group">
          <label>유효기간</label>
          <input type="date" class="form-control" id="giftDueDate">
        </div>
        <div class="form-group">
          <label>바코드/쿠폰 이미지 업로드</label>
          <input type="file" class="form-control" id="giftImage" accept="image/*">
        </div>
      </div>

      <div class="form-group">
        <label>메모 & 설명</label>
        <textarea class="form-control" id="itemMemo" rows="2" placeholder="주문할 메뉴, 예약 번호 등"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" onclick="saveItem()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 이미지 확대 팝업 모달 -->
  <div class="modal-overlay" id="imgViewModal" onclick="closeImgModal()">
    <div style="max-width: 90%; max-height: 80vh;">
      <img id="enlargedImg" src="" style="width: 100%; height: auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    </div>
  </div>

  <script>
    // 초기 기본 데이터
    const defaultData = {
      travel: [
        { id: 1, day: 1, time: '11:00', title: '간사이 국제공항 도착', memo: '고속페리(Bay Shuttle) 타고 고베로 이동하기', query: 'Kansai International Airport' },
        { id: 2, day: 1, time: '15:00', title: '고베 메리켄 파크 오리엔탈 호텔', memo: '체크인 & 짐 보관 후 하버랜드 산책', query: 'Kobe Meriken Park Oriental Hotel', showMap: true },
        { id: 3, day: 2, time: '12:00', title: '고베 모리야 본점 (스테이크)', memo: 'A5 등급 고베규 런치 코스 예약 완료', query: 'Mouriya Honten Kobe', showMap: true },
        { id: 4, day: 2, time: '15:00', title: '기타노 이진칸 & 스타벅스', memo: '이국적인 서양식 건물 구경하고 사진 찍기', query: 'Kitano Ijinkan-Gai Kobe' },
        { id: 5, day: 3, time: '18:30', title: '고베 하버랜드 모자이크', memo: '야경 보면서 대관람차 타기 & 쇼핑', query: 'Kobe Harborland umie' }
      ],
      places: [
        { id: 1, category: '고베', title: '모리야 본점', desc: '육즙 가득한 정통 철판 고베규 맛집', query: 'Mouriya Kobe' },
        { id: 2, category: '카페', title: '스타벅스 기타노이진칸점', desc: '등록유형문화재 건물에 있는 특별한 레트로 카페', query: 'Starbucks Coffee Kobe Kitano Ijinkan' },
        { id: 3, category: '오사카', title: '우메다 공중정원', desc: '노을 및 도시 야경 명소', query: 'Umeda Sky Building' }
      ],
      gifticons: [
        { id: 1, brand: '스타벅스', name: '아메리카노 T 2잔 + 부드러운 생크림 카스텔라', dueDate: '2026-10-30', isUsed: false, img: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400' },
        { id: 2, brand: 'BHC', name: '뿌링클 + 콜라 1.25L', dueDate: '2026-09-05', isUsed: false, img: 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400' },
        { id: 3, brand: '배스킨라빈스', name: '파인트 아이스크림', dueDate: '2026-08-20', isUsed: true, img: 'https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400' }
      ]
    };

    let appData = JSON.parse(localStorage.getItem('couple_app_data')) || defaultData;
    let currentDay = 1;
    let activeNav = 'travel';
    let currentPlaceFilter = 'all';
    let currentGiftFilter = 'available';

    function saveData() {
      localStorage.setItem('couple_app_data', JSON.stringify(appData));
    }

    // 네비게이션 탭 전환
    function switchNav(nav, btn) {
      activeNav = nav;
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`view-${nav}`).classList.add('active');
      btn.classList.add('active');

      if (nav === 'travel') renderTravel();
      if (nav === 'places') renderPlaces();
      if (nav === 'coupons') renderGifticons();
    }

    // 여행 일차 전환
    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('#dayTabs .sub-tab-btn').forEach((b, idx) => {
        b.classList.toggle('active', idx + 1 === day);
      });
      renderTravel();
    }

    // 1. 여행 일정 렌더링 (구글 지도 미니맵 & 링크 포함)
    function renderTravel() {
      const container = document.getElementById('timelineContainer');
      const items = appData.travel.filter(i => i.day === currentDay);

      if (items.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#a4b0be; padding:30px;">등록된 일정이 없습니다. + 버튼을 눌러 추가해보세요!</div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="card timeline-item">
          <div class="timeline-icon"><i class="fa-solid fa-location-dot"></i></div>
          <div class="timeline-content">
            <div class="timeline-header">
              <span class="timeline-time">${item.time || '시간 미정'}</span>
              <button onclick="deleteTravel(${item.id})" style="border:none; background:none; color:#ff7675; cursor:pointer; font-size:0.8rem;"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            <div class="timeline-title">${item.title}</div>
            <div class="timeline-memo">${item.memo || ''}</div>
            
            ${item.showMap ? `
              <div class="map-preview-box">
                <iframe src="https://maps.google.com/maps?q=${encodeURIComponent(item.query || item.title)}&t=&z=14&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>
              </div>
            ` : ''}

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <a class="btn-maps" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.query || item.title)}" target="_blank">
                <i class="fa-brands fa-google"></i> 구글 지도에서 보기
              </a>
              <button onclick="toggleMiniMap(${item.id})" style="border:none; background:none; color:#636e72; font-size:0.75rem; cursor:pointer;">
                ${item.showMap ? '🗺️ 미니맵 접기' : '🗺️ 미니맵 보기'}
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleMiniMap(id) {
      const item = appData.travel.find(t => t.id === id);
      if (item) {
        item.showMap = !item.showMap;
        saveData();
        renderTravel();
      }
    }

    function deleteTravel(id) {
      if (confirm('이 일정을 삭제할까요?')) {
        appData.travel = appData.travel.filter(t => t.id !== id);
        saveData();
        renderTravel();
      }
    }

    // 2. 맛집 / 가볼 곳 렌더링
    function filterPlaces(cat, btn) {
      currentPlaceFilter = cat;
      document.querySelectorAll('#view-places .sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPlaces();
    }

    function renderPlaces() {
      const container = document.getElementById('placesContainer');
      const filtered = currentPlaceFilter === 'all' 
        ? appData.places 
        : appData.places.filter(p => p.category === currentPlaceFilter);

      container.innerHTML = filtered.map(p => `
        <div class="place-card">
          <div class="place-category-icon">
            <i class="fa-solid fa-utensils"></i>
          </div>
          <div class="place-info">
            <span style="font-size:0.72rem; color:var(--primary); font-weight:700;">#${p.category}</span>
            <div class="place-title">${p.title}</div>
            <div class="place-desc">${p.desc}</div>
          </div>
          <a class="btn-maps" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.query || p.title)}" target="_blank">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
        </div>
      `).join('');
    }

    // 3. 기프티콘 렌더링 & D-Day 계산
    function filterGifticons(type, btn) {
      currentGiftFilter = type;
      document.querySelectorAll('#view-coupons .sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGifticons();
    }

    function getDDayInfo(dateStr) {
      if (!dateStr) return { text: '기한 없음', urgent: false };
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(dateStr);
      due.setHours(0, 0, 0, 0);
      const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
      
      if (diff < 0) return { text: '만료됨', urgent: true };
      if (diff === 0) return { text: 'D-Day 오늘!', urgent: true };
      return { text: `D-${diff}`, urgent: diff <= 7 };
    }

    function renderGifticons() {
      const container = document.getElementById('gifticonContainer');
      let list = appData.gifticons;
      if (currentGiftFilter === 'available') list = list.filter(g => !g.isUsed);
      if (currentGiftFilter === 'used') list = list.filter(g => g.isUsed);

      container.innerHTML = list.map(g => {
        const dday = getDDayInfo(g.dueDate);
        return `
          <div class="gift-card ${g.isUsed ? 'used' : ''}">
            <div class="gift-img-wrap" onclick="viewImage('${g.img || 'https://via.placeholder.com/300x200?text=No+Image'}')">
              <img src="${g.img || 'https://via.placeholder.com/300x200?text=No+Image'}" alt="쿠폰">
              <div class="gift-dday-badge ${dday.urgent ? 'urgent' : ''}">${g.isUsed ? '사용완료' : dday.text}</div>
            </div>
            <div class="gift-body">
              <div>
                <div class="gift-brand">${g.brand}</div>
                <div class="gift-name">${g.name}</div>
              </div>
              <div class="gift-footer">
                <span class="gift-due">~${g.dueDate || '기한없음'}</span>
                <button class="btn-toggle-use ${g.isUsed ? 'is-used' : ''}" onclick="toggleGiftUse(${g.id})">
                  ${g.isUsed ? '완료' : '사용하기'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleGiftUse(id) {
      const g = appData.gifticons.find(item => item.id === id);
      if (g) {
        g.isUsed = !g.isUsed;
        saveData();
        renderGifticons();
      }
    }

    function viewImage(src) {
      document.getElementById('enlargedImg').src = src;
      document.getElementById('imgViewModal').classList.add('active');
    }
    function closeImgModal() {
      document.getElementById('imgViewModal').classList.remove('active');
    }

    // 모달 및 데이터 추가 핸들러
    function openAddModal() {
      document.getElementById('itemType').value = activeNav === 'coupons' ? 'gifticon' : (activeNav === 'places' ? 'place' : 'travel');
      toggleFormFields();
      document.getElementById('addModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('itemName').value = '';
      document.getElementById('itemMemo').value = '';
    }

    function toggleFormFields() {
      const type = document.getElementById('itemType').value;
      document.getElementById('travelFields').style.display = type === 'travel' ? 'block' : 'none';
      document.getElementById('gifticonFields').style.display = type === 'gifticon' ? 'block' : 'none';
      document.getElementById('nameLabel').innerText = type === 'gifticon' ? '상품명' : '이름 / 장소명';
    }

    function saveItem() {
      const type = document.getElementById('itemType').value;
      const name = document.getElementById('itemName').value.trim();
      const memo = document.getElementById('itemMemo').value.trim();
      if (!name) return alert('이름을 입력해주세요!');

      if (type === 'travel') {
        appData.travel.push({
          id: Date.now(),
          day: parseInt(document.getElementById('travelDay').value),
          time: document.getElementById('travelTime').value.trim(),
          title: name,
          memo: memo,
          query: name,
          showMap: true
        });
        renderTravel();
      } else if (type === 'place') {
        appData.places.push({
          id: Date.now(),
          category: '위시',
          title: name,
          desc: memo,
          query: name
        });
        renderPlaces();
      } else if (type === 'gifticon') {
        const fileInput = document.getElementById('giftImage');
        const brand = document.getElementById('giftBrand').value.trim() || '기타';
        const dueDate = document.getElementById('giftDueDate').value;

        if (fileInput.files && fileInput.files[0]) {
          const reader = new FileReader();
          reader.onload = function(e) {
            appData.gifticons.push({
              id: Date.now(),
              brand: brand,
              name: name,
              dueDate: dueDate,
              isUsed: false,
              img: e.target.result
            });
            saveData();
            renderGifticons();
          };
          reader.readAsDataURL(fileInput.files[0]);
        } else {
          appData.gifticons.push({
            id: Date.now(),
            brand: brand,
            name: name,
            dueDate: dueDate,
            isUsed: false,
            img: 'https://via.placeholder.com/300x200?text=' + encodeURIComponent(brand)
          });
          saveData();
          renderGifticons();
        }
      }

      saveData();
      closeModal();
    }

    // 초기 실행
    renderTravel();
  </script>
</body>
</html>
