<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뚜❣️쫑</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    :root { --primary: #ff5e7e; --bg: #f8f9fe; --text: #2d3436; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); padding-bottom: 90px; }
    
    .app-header { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); color: white; padding: 26px 20px 20px; border-radius: 0 0 28px 28px; position: sticky; top: 0; z-index: 10; }
    .container { max-width: 540px; margin: 0 auto; padding: 16px; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; box-shadow: 0 -4px 16px rgba(0,0,0,0.05); display: flex; z-index: 50; border-radius: 20px 20px 0 0; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #a4b0be; font-size: 0.7rem; font-weight: 600; cursor: pointer; border: none; background: none; }
    .nav-item.active { color: var(--primary); }
    .nav-item i { font-size: 1.2rem; margin-bottom: 3px; }
    
    /* 체크리스트 등 기존 스타일 유지 */
    .card { background: white; border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    .check-row { display: flex; align-items: center; padding: 12px; background: white; border-radius: 12px; margin-bottom: 8px; border: 1px solid #eee; }
    .check-row.checked { opacity: 0.5; text-decoration: line-through; }
    .fab { position: fixed; right: 20px; bottom: 86px; width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; z-index: 50; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-title">고베 & 아리마 온천 여행 🇯🇵</div>
    </div>
  </header>

  <div class="container">
    <!-- 1. 일정 탭 -->
    <div id="view-travel" class="tab-view active">
      <div id="checklistContainer"></div>
    </div>
    <!-- 2. 맛집 탭 -->
    <div id="view-places" class="tab-view">맛집 컨텐츠</div>
    <!-- 3. 날씨 탭 -->
    <div id="view-weather" class="tab-view">날씨 컨텐츠</div>
    <!-- 4. 지도 탭 -->
    <div id="view-map" class="tab-view">지도 컨텐츠</div>
    <!-- 5. 기프티콘 탭 -->
    <div id="view-coupons" class="tab-view">기프티콘 컨텐츠</div>
  </div>

  <button class="fab" onclick="alert('추가 기능')"><i class="fa-solid fa-plus"></i></button>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('travel', this)"><i class="fa-solid fa-plane"></i><span>일정</span></button>
    <button class="nav-item" onclick="switchTab('places', this)"><i class="fa-solid fa-utensils"></i><span>맛집</span></button>
    <button class="nav-item" onclick="switchTab('weather', this)"><i class="fa-solid fa-cloud-sun"></i><span>날씨</span></button>
    <button class="nav-item" onclick="switchTab('map', this)"><i class="fa-solid fa-map"></i><span>지도</span></button>
    <button class="nav-item" onclick="switchTab('coupons', this)"><i class="fa-solid fa-ticket"></i><span>기프티콘</span></button>
  </nav>

  <script>
    function switchTab(tabId, btn) {
      // 1. 모든 탭 숨기기
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      // 2. 선택한 탭 보이기
      document.getElementById('view-' + tabId).classList.add('active');
      // 3. 네비게이션 버튼 활성화
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
