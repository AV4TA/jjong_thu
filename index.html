<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뚜❣️쫑</title>

  <!-- PWA & 모바일 홈 화면 설정 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="뚜❣️쫑" />
  <meta name="theme-color" content="#ff758c" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Pink%20Heart.png" />
  <link rel="icon" href="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Pink%20Heart.png" />

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #ffe8ee;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 22px;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; min-height: 100vh; }

    /* Header */
    .home-header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      padding: 36px 20px 28px;
      border-radius: 0 0 32px 32px;
      box-shadow: 0 8px 24px rgba(255, 117, 140, 0.35);
      text-align: center;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      backdrop-filter: blur(6px);
      margin-bottom: 12px;
    }
    .home-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
    .home-sub { font-size: 0.88rem; opacity: 0.9; margin-top: 6px; }

    /* Container */
    .container { max-width: 500px; margin: 0 auto; padding: 24px 18px; }

    .section-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Menu Cards */
    .menu-grid { display: flex; flex-direction: column; gap: 16px; }
    
    .menu-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .menu-card:active { transform: scale(0.98); }

    .menu-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--primary);
    }
    .menu-card.coupon-card::before { background: #6c5ce7; }

    .menu-left { display: flex; align-items: center; gap: 18px; }
    .menu-icon {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .coupon-card .menu-icon { background: #f0edff; color: #6c5ce7; }

    .menu-title { font-size: 1.15rem; font-weight: 700; color: #2d3436; margin-bottom: 4px; }
    .menu-desc { font-size: 0.82rem; color: var(--text-sub); line-height: 1.35; }
    .menu-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      background: #fff0f3;
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 6px;
    }
    .coupon-card .menu-badge { background: #f0edff; color: #6c5ce7; }

    .menu-arrow {
      color: #dcdde1;
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    .menu-card:hover .menu-arrow { transform: translateX(4px); color: var(--primary); }

    /* Footer Note */
    .footer-note {
      text-align: center;
      font-size: 0.78rem;
      color: #a4b0be;
      margin-top: 36px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header class="home-header">
    <div class="header-badge">
      <i class="fa-solid fa-heart"></i>
      <span>I LOVE YOU</span>
      <i class="fa-solid fa-heart"></i>
    </div>
    <h1 class="home-title">뚜❣️쫑</h1>
    <p class="home-sub">우리의 홈페이지 ✨</p>
  </header>

  <div class="container">
    <div class="section-label">
      <i class="fa-solid fa-compass"></i>
      <span>바로가기 메뉴</span>
    </div>

    <div class="menu-grid">
      <!-- 1. 고베 여행 계획서 -->
      <a href="kobe.html" class="menu-card">
        <div class="menu-left">
          <div class="menu-icon">
            <i class="fa-solid fa-plane-departure"></i>
          </div>
          <div>
            <div class="menu-title">고베 & 아리마 온천 🇯🇵</div>
            <div class="menu-desc">일정표, 뚜/쫑 체크리스트, 맛집, 날씨</div>
            <div class="menu-badge" id="ddayBadge">2026.08.30 ~ 09.02</div>
          </div>
        </div>
        <div class="menu-arrow">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>

      <!-- 2. 기프티콘 보관함 -->
      <a href="gifticon.html" class="menu-card coupon-card">
        <div class="menu-left">
          <div class="menu-icon">
            <i class="fa-solid fa-ticket"></i>
          </div>
          <div>
            <div class="menu-title">기프티콘 보관함 🎁</div>
          </div>
        </div>
        <div class="menu-arrow">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>
    </div>

    <div class="footer-note">
      뚜 & 쫑<br>
      since 2020.10.31 ❤️
    </div>
  </div>

<script>
    // 서비스 워커 등록 (PWA 앱 설치 활성화)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
    // D-Day 계산
    const tripDate = new Date('2026-08-30');
    const today = new Date();
    tripDate.setHours(0,0,0,0);
    today.setHours(0,0,0,0);
    const diff = Math.ceil((tripDate - today) / (1000 * 60 * 60 * 24));
    
    const badge = document.getElementById('ddayBadge');
    if (diff > 0) badge.innerText = `고베 여행 D-${diff} 🛫`;
    else if (diff === 0) badge.innerText = `오늘 고베 출발! 🛫`;
    else if (diff >= -3) badge.innerText = `고베 여행 중 (${Math.abs(diff)+1}일차) 🇯🇵`;
  </script>
</body>
</html>
