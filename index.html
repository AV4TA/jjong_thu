<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뚜❣️쫑</title>

  <!-- PWA & 모바일 홈 화면 설정 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="뚜❣️쫑" />
  <meta name="theme-color" content="#ff758c" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Pink%20Heart.png" />
  <link rel="icon" href="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Smilies/Pink%20Heart.png" />

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #ffe8ee;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 22px;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; min-height: 100vh; }

    /* Header */
    .home-header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      padding: 36px 20px 28px;
      border-radius: 0 0 32px 32px;
      box-shadow: 0 8px 24px rgba(255, 117, 140, 0.35);
      text-align: center;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      backdrop-filter: blur(6px);
      margin-bottom: 12px;
    }
    .home-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
    .home-sub { font-size: 0.88rem; opacity: 0.9; margin-top: 6px; }

    /* Container */
    .container { max-width: 500px; margin: 0 auto; padding: 24px 18px; }

    .section-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Menu Cards */
    .menu-grid { display: flex; flex-direction: column; gap: 16px; }
    
    .menu-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .menu-card:active { transform: scale(0.98); }

    .menu-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--primary);
    }
    .menu-card.coupon-card::before { background: #6c5ce7; }
    .menu-card.baseball-card::before { background: #ea2027; }

    .menu-left { display: flex; align-items: center; gap: 18px; }
    .menu-icon {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .coupon-card .menu-icon { background: #f0edff; color: #6c5ce7; }
    .baseball-card .menu-icon { background: #ffe8ee; color: #ea2027; }

    .menu-title { font-size: 1.15rem; font-weight: 700; color: #2d3436; margin-bottom: 4px; }
    .menu-desc { font-size: 0.82rem; color: var(--text-sub); line-height: 1.35; }
    .menu-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      background: #fff0f3;
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 6px;
    }
    .coupon-card .menu-badge { background: #f0edff; color: #6c5ce7; }
    .baseball-card .menu-badge { background: #ffe8ee; color: #ea2027; }

    .menu-arrow {
      color: #dcdde1;
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    .menu-card:hover .menu-arrow { transform: translateX(4px); color: var(--primary); }

    /* Footer Note */
    .footer-note {
      text-align: center;
      font-size: 0.78rem;
      color: #a4b0be;
      margin-top: 36px;
      line-height: 1.5;
    }

    /* 🔒 PIN 잠금 화면 */
    .pin-overlay {
      position: fixed;
      inset: 0;
      background: #1e272e;
      color: white;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      backdrop-filter: blur(8px);
    }
    .pin-overlay.hidden { display: none !important; }

    .pin-badge {
      font-size: 2.6rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 10px rgba(255, 107, 129, 0.4));
    }
    .pin-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .pin-desc {
      font-size: 0.85rem;
      color: #a4b0be;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .pin-dots {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
    }
    .pin-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid #57606f;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pin-dot.filled {
      background: #ff5e7e;
      border-color: #ff5e7e;
      box-shadow: 0 0 14px rgba(255, 94, 126, 0.7);
      transform: scale(1.15);
    }

    /* 자동 로그인 체크박스 UI */
    .auto-login-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ced6e0;
      user-select: none;
    }
    .auto-login-box input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #ff5e7e;
      cursor: pointer;
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 270px;
    }
    .pin-key {
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: white;
      font-size: 1.55rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, transform 0.1s;
    }
    .pin-key:active {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(0.92);
    }
    .pin-key.btn-action {
      font-size: 1.1rem;
      background: transparent;
      color: #a4b0be;
    }
    .pin-key.btn-action:active {
      background: transparent;
      color: white;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-9px); }
      40%, 80% { transform: translateX(9px); }
    }
    .shake { animation: shake 0.35s ease-in-out; }
  </style>
</head>
<body>

  <div id="pinLockScreen" class="pin-overlay">
    <div class="pin-badge">💖</div>
    <div class="pin-title">뚜쫑 비밀 공간</div>
    <div class="pin-desc">둘만의 6자리 암호를 입력해주세요</div>

    <div class="pin-dots" id="pinDotsContainer">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>

    <!-- 자동 로그인 선택 체크박스 (기본 체크됨) -->
    <label class="auto-login-box">
      <input type="checkbox" id="chkAutoLogin" checked>
      <span>이 기기에서 자동 로그인 유지</span>
    </label>

    <div class="pin-keypad">
      <button type="button" class="pin-key" onclick="pressPin('1')">1</button>
      <button type="button" class="pin-key" onclick="pressPin('2')">2</button>
      <button type="button" class="pin-key" onclick="pressPin('3')">3</button>
      <button type="button" class="pin-key" onclick="pressPin('4')">4</button>
      <button type="button" class="pin-key" onclick="pressPin('5')">5</button>
      <button type="button" class="pin-key" onclick="pressPin('6')">6</button>
      <button type="button" class="pin-key" onclick="pressPin('7')">7</button>
      <button type="button" class="pin-key" onclick="pressPin('8')">8</button>
      <button type="button" class="pin-key" onclick="pressPin('9')">9</button>
      <button type="button" class="pin-key btn-action" onclick="clearPin()">취소</button>
      <button type="button" class="pin-key" onclick="pressPin('0')">0</button>
      <button type="button" class="pin-key btn-action" onclick="deletePin()"><i class="fa-solid fa-delete-left"></i></button>
    </div>
  </div>

  <header class="home-header">
    <div class="header-badge">
      <i class="fa-solid fa-heart"></i>
      <span>I LOVE YOU</span>
      <i class="fa-solid fa-heart"></i>
    </div>
    <h1 class="home-title">뚜❣️쫑</h1>
    <p class="home-sub">우리의 홈페이지 ✨</p>
  </header>

  <div class="container">
    <div class="section-label">
      <i class="fa-solid fa-compass"></i>
      <span>바로가기 메뉴</span>
    </div>

    <div class="menu-grid">
      <!-- 1. 고베 여행 계획서 -->
      <a href="kobe.html" class="menu-card">
        <div class="menu-left">
          <div class="menu-icon">
            <i class="fa-solid fa-plane-departure"></i>
          </div>
          <div>
            <div class="menu-title">고베 & 아리마 온천 🇯🇵</div>
            <div class="menu-desc">일정표, 뚜/쫑 체크리스트, 맛집, 날씨</div>
            <div class="menu-badge" id="ddayBadge">2026.08.30 ~ 09.02</div>
          </div>
        </div>
        <div class="menu-arrow">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>

      <!-- 2. 기프티콘 보관함 -->
      <a href="gifticon.html" class="menu-card coupon-card">
        <div class="menu-left">
          <div class="menu-icon">
            <i class="fa-solid fa-ticket"></i>
          </div>
          <div>
            <div class="menu-title">기프티콘 보관함 🎁</div>
            <div class="menu-desc">우리 둘만의 쿠폰 보관 & 바코드 확인</div>
            <div class="menu-badge">모바일 쿠폰함</div>
          </div>
        </div>
        <div class="menu-arrow">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>

      <!-- 3. 위즈파크 직관 일기 -->
      <a href="baseball.html" class="menu-card baseball-card">
        <div class="menu-left">
          <div class="menu-icon">
            <i class="fa-solid fa-baseball-bat-ball"></i>
          </div>
          <div>
            <div class="menu-title">야구 직관 일기 ⚾</div>
            <div class="menu-desc">kt wiz 직관 경기 기록 & 실시간 승률 계산</div>
            <div class="menu-badge">kt wiz 승리요정 🔥</div>
          </div>
        </div>
        <div class="menu-arrow">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>
    </div>

    <div class="footer-note">
      뚜 & 쫑<br>
      since 2020.10.31 ❤️
    </div>
  </div>

  <script>
    const PIN_HASH = "81c3c97800ba8cb4f5f5c3a372330a846c4f0376d40f2b2db841f4f5a34e028b";

    let enteredPin = "";

    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, "0")).join("");
    }

    // 자동 로그인 또는 세션 로그인 확인
    document.addEventListener('DOMContentLoaded', () => {
      const isAutoUnlocked = localStorage.getItem("ddo_jjong_auth_token") === PIN_HASH;
      const isSessionUnlocked = sessionStorage.getItem("ddo_jjong_unlocked") === "true";

      if (isAutoUnlocked || isSessionUnlocked) {
        const lockEl = document.getElementById("pinLockScreen");
        if (lockEl) lockEl.classList.add("hidden");
      }
    });

    function pressPin(digit) {
      if (enteredPin.length >= 6) return;
      enteredPin += digit;
      updatePinDots();

      if (enteredPin.length === 6) {
        setTimeout(verifyPin, 100);
      }
    }

    function deletePin() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
      }
    }

    function clearPin() {
      enteredPin = "";
      updatePinDots();
    }

    function updatePinDots() {
      const dots = document.querySelectorAll(".pin-dot");
      dots.forEach((dot, idx) => {
        if (idx < enteredPin.length) {
          dot.classList.add("filled");
        } else {
          dot.classList.remove("filled");
        }
      });
    }

    async function verifyPin() {
      const inputHash = await sha256(enteredPin);
      
      if (inputHash === PIN_HASH) {
        const isAuto = document.getElementById("chkAutoLogin").checked;
        if (isAuto) {
          localStorage.setItem("ddo_jjong_auth_token", PIN_HASH); // 기기에 영구 기억
        }
        sessionStorage.setItem("ddo_jjong_unlocked", "true");

        const lockEl = document.getElementById("pinLockScreen");
        if (lockEl) lockEl.classList.add("hidden");
      } else {
        const dotsContainer = document.getElementById("pinDotsContainer");
        if (dotsContainer) dotsContainer.classList.add("shake");
        if (navigator.vibrate) navigator.vibrate(200);

        setTimeout(() => {
          if (dotsContainer) dotsContainer.classList.remove("shake");
          clearPin();
        }, 400);
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const tripDate = new Date('2026-08-30');
    const today = new Date();
    tripDate.setHours(0,0,0,0);
    today.setHours(0,0,0,0);
    const diff = Math.ceil((tripDate - today) / (1000 * 60 * 60 * 24));
    
    const badge = document.getElementById('ddayBadge');
    if (badge) {
      if (diff > 0) badge.innerText = `고베 여행 D-${diff} 🛫`;
      else if (diff === 0) badge.innerText = `오늘 고베 출발! 🛫`;
      else if (diff >= -3) badge.innerText = `고베 여행 중 (${Math.abs(diff)+1}일차) 🇯🇵`;
    }
  </script>
</body>
</html>
