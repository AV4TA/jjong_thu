<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Kobe Trip & Memory</title>

  <!-- PWA & 모바일 홈 화면 바로가기 설정 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="고베여행❤️" />
  <meta name="theme-color" content="#ff758c" />
  
  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:sparkling-heart.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:sparkling-heart.svg" />

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Tesseract.js (클라이언트 OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #ffe8ee;
      --primary-dark: #e04565;
      --accent: #6c5ce7;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      padding: 26px 20px 20px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 1.35rem; font-weight: 700; }
    .d-day-pill {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Container */
    .container { max-width: 540px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

    /* Sync Indicator */
    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      justify-content: flex-end;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #a4b0be; transition: background 0.3s; }
    .sync-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    .sync-dot.syncing { background: #ffa502; }

    /* Tabs */
    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .sub-tab-btn {
      background: white;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sub-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(255, 94, 126, 0.3);
    }

    /* Cards & Timeline */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.02);
    }

    /* ====================================================
       체크리스트 뚜 vs 쫑 탭 & 카드 스타일
       ==================================================== */
    .checklist-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 117, 140, 0.15);
    }

    .person-switch-row {
      display: flex;
      background: #f1f2f6;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
      gap: 4px;
    }
    .person-btn {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #636e72;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .person-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .progress-wrap { margin-bottom: 16px; }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #2d3436;
    }
    .progress-bar-bg {
      height: 10px;
      background: #f1f2f6;
      border-radius: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff758c, #ff5e7e);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 8px;
    }

    .check-add-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .check-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.88rem;
      outline: none;
    }
    .check-input:focus { border-color: var(--primary); }
    .btn-add-item {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .checklist-items { display: flex; flex-direction: column; gap: 8px; }
    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fdfdfd;
      border: 1px solid #f1f2f6;
      padding: 12px 14px;
      border-radius: 14px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .check-row.checked {
      background: #f8f9fa;
      border-color: #e9ecef;
      opacity: 0.6;
    }
    .check-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #dcdde1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.75rem;
      transition: all 0.2s;
    }
    .check-row.checked .custom-checkbox {
      background: var(--primary);
      border-color: var(--primary);
    }
    .check-text { font-size: 0.92rem; font-weight: 600; color: #2d3436; }
    .check-row.checked .check-text { text-decoration: line-through; color: #a4b0be; }
    .btn-del-check {
      background: none;
      border: none;
      color: #ff7675;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px 6px;
    }

    /* 타임라인 */
    .timeline-item { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 19px;
      top: 36px;
      bottom: 0;
      width: 2px;
      background: #f0f0f5;
    }
    .timeline-item:last-child::before { display: none; }
    .timeline-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      z-index: 1;
    }
    .timeline-content { flex: 1; }
    .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .timeline-time { font-size: 0.78rem; font-weight: 700; color: var(--primary); }
    .timeline-title { font-size: 1.02rem; font-weight: 700; color: #222; margin-bottom: 4px; }
    .timeline-memo { font-size: 0.85rem; color: #636e72; line-height: 1.45; }

    /* Map Box */
    .map-preview-box {
      border-radius: 12px;
      overflow: hidden;
      margin: 10px 0;
      border: 1px solid var(--border);
      height: 160px;
      background: #eef1f6;
    }
    .map-preview-box iframe { width: 100%; height: 100%; border: 0; }

    .btn-maps {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
    }

    /* Places */
    .place-card {
      display: flex;
      gap: 14px;
      align-items: center;
      background: white;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .place-category-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: #fff0f3;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* Weather */
    .weather-hero {
      background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
      color: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(9, 132, 227, 0.25);
    }
    .weather-hero-top { display: flex; justify-content: space-between; align-items: center; }
    .weather-city-name { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .weather-main-temp { font-size: 2.8rem; font-weight: 800; line-height: 1; margin: 12px 0 6px; }
    .weather-condition { font-size: 0.95rem; font-weight: 600; opacity: 0.95; }
    .weather-extra-info {
      display: flex;
      gap: 14px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 0.8rem;
    }
    .weather-forecast-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }
    .forecast-card {
      background: white;
      border-radius: 14px;
      padding: 12px 10px;
      min-width: 74px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .forecast-day { font-size: 0.75rem; font-weight: 700; color: #636e72; margin-bottom: 4px; }
    .forecast-icon { font-size: 1.3rem; margin: 4px 0; }
    .forecast-temp { font-size: 0.78rem; font-weight: 700; color: #2d3436; }
    .cloth-tip-box {
      background: #fff8e7;
      border: 1px solid #ffeaa7;
      border-radius: 16px;
      padding: 16px;
      font-size: 0.84rem;
      color: #634a00;
      line-height: 1.5;
    }

    /* Gifticon Section */
    .gift-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sort-control select { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 0.78rem; color: #57606f; background: white; outline: none; }
    .gift-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .gift-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; }
    .gift-card.used { opacity: 0.55; filter: grayscale(80%); }
    .gift-img-wrap { height: 130px; background: #f8f9fc; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 6px; }
    .gift-img-wrap img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
    .gift-dday-badge { position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.65); color: white; font-size: 0.72rem; font-weight: 700; padding: 4px 8px; border-radius: 8px; backdrop-filter: blur(4px); }
    .gift-dday-badge.urgent { background: #ff4757; }
    .gift-quick-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; z-index: 2; }
    .gift-action-btn { width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; color: #57606f; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .gift-action-btn.del { color: #ff4757; }
    .gift-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .gift-brand { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }
    .gift-name { font-size: 0.88rem; font-weight: 700; color: #2d3436; margin: 2px 0 8px; line-height: 1.3; }
    .gift-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .btn-toggle-use { background: #f1f2f6; border: none; font-size: 0.72rem; font-weight: 700; padding: 5px 8px; border-radius: 6px; cursor: pointer; color: #57606f; }
    .btn-toggle-use.is-used { background: #2ed573; color: white; }

    /* Floating & Nav */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 86px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 20px rgba(255, 94, 126, 0.4);
      cursor: pointer;
      border: none;
      z-index: 50;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      border-radius: 20px 20px 0 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #a4b0be;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      gap: 4px;
      border: none;
      background: none;
      width: 25%;
    }
    .nav-item i { font-size: 1.25rem; }
    .nav-item.active { color: var(--primary); }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { display: flex; z-index: 999; opacity: 1; pointer-events: auto; }
    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: #555; }
    .form-control { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.9rem; outline: none; }
    .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #f1f2f6; color: #57606f; }

    .ocr-loader {
      display: none;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #4338ca;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      margin-top: 6px;
      align-items: center;
      gap: 8px;
    }
    .ocr-loader.active { display: flex; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }

    .gift-view-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      position: relative;
    }
    .gift-modal-close-btn {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 32px;
      height: 32px;
      background: #2d3436;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    .gift-view-img-box {
      width: 100%;
      max-height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
      background: #fafafa;
    }
    .gift-view-img-box img { max-width: 100%; max-height: 460px; object-fit: contain; display: block; }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="header-top">
      <div>
        <div class="header-title">고베 & 아리마 온천 여행 🇯🇵</div>
        <p style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">2026.08.30 (일) ~ 09.02 (수)</p>
      </div>
      <div class="d-day-pill">
        <i class="fa-solid fa-heart"></i>
        <span id="ddayText">D-Day 계산중</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncStatusText">서버 연결 중...</span>
    </div>
    
    <!-- 1. 여행 일정 탭 -->
    <div id="view-travel" class="tab-view active">
      <div class="sub-tabs" id="dayTabs">
        <button class="sub-tab-btn active" onclick="switchDay('ready', this)">🧳 여행준비</button>
        <button class="sub-tab-btn" onclick="switchDay(1, this)">Day 1 (8/30)</button>
        <button class="sub-tab-btn" onclick="switchDay(2, this)">Day 2 (8/31)</button>
        <button class="sub-tab-btn" onclick="switchDay(3, this)">Day 3 (9/01)</button>
        <button class="sub-tab-btn" onclick="switchDay(4, this)">Day 4 (9/02)</button>
      </div>

      <!-- 뚜 vs 쫑 분리형 체크리스트 섹션 -->
      <div id="readyChecklistSection" class="checklist-card">
        <!-- 뚜 vs 쫑 토글 탭 -->
        <div class="person-switch-row">
          <button class="person-btn active" id="btnPersonThu" onclick="switchPerson('thu')">👸 뚜가 챙길 거</button>
          <button class="person-btn" id="btnPersonJjong" onclick="switchPerson('jjong')">🤴 쫑이 챙길 거</button>
        </div>

        <!-- 달성률 프로그레스 바 -->
        <div class="progress-wrap">
          <div class="progress-header">
            <span id="progressTitle">🎒 뚜의 짐 챙기기</span>
            <span id="progressText">0% 완료 (0/0)</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
          </div>
        </div>

        <!-- 새 준비물 빠른 추가 -->
        <div class="check-add-box">
          <input type="text" id="newCheckInput" class="check-input" placeholder="새 준비물 입력" onkeypress="if(event.key==='Enter') addCheckItem()">
          <button class="btn-add-item" onclick="addCheckItem()">추가</button>
        </div>

        <!-- 체크리스트 목록 -->
        <div class="checklist-items" id="checklistContainer"></div>
      </div>

      <!-- 타임라인 리스트 (Day 1~4) -->
      <div id="timelineContainer" style="display:none;"></div>
    </div>

    <!-- 2. 맛집 / 가볼 곳 탭 -->
    <div id="view-places" class="tab-view">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" onclick="filterPlaces('all', this)">전체보기</button>
        <button class="sub-tab-btn" onclick="filterPlaces('고베', this)">🥩 고베</button>

          checklistThu: remoteData.checklistThu || initialChecklistThu,
          checklistJjong: remoteData.checklistJjong || initialChecklistJjong,
          travel: (remoteData.travel && remoteData.travel.length > 0) ? remoteData.travel : initialKobeData.travel,
          places: (remoteData.places && remoteData.places.length > 0) ? remoteData.places : initialKobeData.places,
          gifticons: remoteData.gifticons || []

          syncDot.className = 'sync-dot';
          syncText.innerText = '저장 실패';

    function renderAll() {

    // ----------------------------------------------------

    function switchPerson(person) {
      currentPerson = person;
      document.getElementById('btnPersonThu').classList.toggle('active', person === 'thu');
      document.getElementById('btnPersonJjong').classList.toggle('active', person === 'jjong');
      renderChecklist();
    }

    function getActiveChecklist() {
      return currentPerson === 'thu' ? (appData.checklistThu || []) : (appData.checklistJjong || []);
    }

    function renderChecklist() {
      const container = document.getElementById('checklistContainer');
      const list = getActiveChecklist();
      const personName = currentPerson === 'thu' ? '뚜' : '쫑';

      document.getElementById('progressTitle').innerText = `🎒 ${personName}의 짐 챙기기`;
      document.getElementById('newCheckInput').placeholder = `${personName}가 챙길 준비물 입력 (예: ${currentPerson === 'thu' ? '고데기, 화장품' : '돼지코, 보조배터리'})`;

      const total = list.length;
      const checkedCount = list.filter(i => i.checked).length;
      const percent = total === 0 ? 0 : Math.round((checkedCount / total) * 100);

      document.getElementById('progressText').innerText = `${percent}% 완료 (${checkedCount}/${total})`;
      document.getElementById('progressBarFill').style.width = `${percent}%`;

      if (list.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#a4b0be; padding:25px;">${personName}의 준비물 목록이 비어있습니다.</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="check-row ${item.checked ? 'checked' : ''}" onclick="toggleCheckItem(${item.id})">
          <div class="check-left">
            <div class="custom-checkbox">
              ${item.checked ? '<i class="fa-solid fa-check"></i>' : ''}
            </div>
            <span class="check-text">${item.text}</span>
          </div>
          <button class="btn-del-check" onclick="event.stopPropagation(); deleteCheckItem(${item.id})">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `).join('');
    }

    function toggleCheckItem(id) {
      const list = getActiveChecklist();
      const item = list.find(i => i.id === id);
      if (item) {
        item.checked = !item.checked;
        saveData();
        renderChecklist();
      }
    }

    function addCheckItem() {
      const input = document.getElementById('newCheckInput');
      const text = input.value.trim();
      if (!text) return;

      const newItem = { id: Date.now(), text: text, checked: false };
      if (currentPerson === 'thu') {
        if (!appData.checklistThu) appData.checklistThu = [];
        appData.checklistThu.push(newItem);
      } else {
        if (!appData.checklistJjong) appData.checklistJjong = [];
        appData.checklistJjong.push(newItem);
      }

      input.value = '';
      saveData();
      renderChecklist();
    }

    function deleteCheckItem(id) {
      if (currentPerson === 'thu') {
        appData.checklistThu = (appData.checklistThu || []).filter(i => i.id !== id);
      } else {
        appData.checklistJjong = (appData.checklistJjong || []).filter(i => i.id !== id);
      }
      saveData();
      renderChecklist();
    }

    // D-Day 계산
    function calculateDDay() {
      const tripDate = new Date('2026-08-30');
      const today = new Date();
      tripDate.setHours(0,0,0,0);
      today.setHours(0,0,0,0);
      const diff = Math.ceil((tripDate - today) / (1000 * 60 * 60 * 24));
      
      const el = document.getElementById('ddayText');
      if (diff > 0) el.innerText = `고베 D-${diff}`;
      else if (diff === 0) el.innerText = `고베 D-Day 오늘 출발! 🛫`;
      else if (diff >= -3) el.innerText = `고베 여행 중 (${Math.abs(diff)+1}일차) 🇯🇵`;
      else el.innerText = `고베 여행 추억 💖`;
    }

    function switchNav(nav, btn) {
      activeNav = nav;
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`view-${nav}`).classList.add('active');
      if (btn) btn.classList.add('active');

      const fab = document.getElementById('mainFab');
      if (nav === 'weather') fab.style.display = 'none';
      else fab.style.display = 'flex';

      renderAll();
    }

    function getWeatherConditionInfo(code) {
      if (code === 0) return { text: '맑음 ☀️', icon: '☀️' };
      if (code === 1 || code === 2) return { text: '대체로 맑음 🌤️', icon: '🌤️' };
      if (code === 3) return { text: '흐림 ☁️', icon: '☁️' };
      if ([45, 48].includes(code)) return { text: '안개 🌫️', icon: '🌫️' };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { text: '비 내림 🌧️', icon: '🌧️' };
      if ([71, 73, 75, 85, 86].includes(code)) return { text: '눈 ❄️', icon: '❄️' };
      if ([95, 96, 99].includes(code)) return { text: '뇌우 ⛈️', icon: '⛈️' };
      return { text: '구름 조금 ⛅', icon: '⛅' };
    }

    async function loadWeatherData() {
      const city = CITY_COORDS[currentWeatherCity];
      document.getElementById('weatherCityName').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${city.name}`;
      
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        const data = await res.json();

        const currentTemp = Math.round(data.current.temperature_2m);
        const cond = getWeatherConditionInfo(data.current.weather_code);
        document.getElementById('weatherCurrentTemp').innerText = `${currentTemp}°C`;
        document.getElementById('weatherConditionText').innerText = cond.text;
        document.getElementById('weatherHumidity').innerText = `${data.current.relative_humidity_2m}%`;
        document.getElementById('weatherWind').innerText = `${Math.round(data.current.wind_speed_10m)}m/s`;
        
        const todayRainProb = data.daily.precipitation_probability_max[0] || 0;
        document.getElementById('weatherRainProb').innerText = `${todayRainProb}%`;

        const forecastContainer = document.getElementById('weatherForecastContainer');
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        
        forecastContainer.innerHTML = data.daily.time.map((t, idx) => {
          const dateObj = new Date(t);
          const dayName = idx === 0 ? '오늘' : `${days[dateObj.getDay()]} (${dateObj.getMonth()+1}/${dateObj.getDate()})`;
          const maxTemp = Math.round(data.daily.temperature_2m_max[idx]);
          const minTemp = Math.round(data.daily.temperature_2m_min[idx]);
          const dayCond = getWeatherConditionInfo(data.daily.weather_code[idx]);

          return `
            <div class="forecast-card">
              <div class="forecast-day">${dayName}</div>
              <div class="forecast-icon">${dayCond.icon}</div>
              <div class="forecast-temp">${maxTemp}° / <span style="color:#8395a7; font-weight:normal;">${minTemp}°</span></div>
            </div>
          `;
        }).join('');

        let tipText = '';
        if (currentTemp >= 28) {
          tipText = '<b>☀️ 한여름 무더위 날씨:</b> 시원한 반팔/민소매와 자외선 차단용 양산, 선글라스를 꼭 챙기세요. 실내 에어컨에 대비해 얇은 린넨 셔츠가 유용합니다.';
        } else if (currentTemp >= 22) {
          tipText = '<b>🌿 쾌적하고 따뜻한 날씨:</b> 반팔에 얇은 가디건이나 셔츠를 걸치기 좋은 완벽한 여행 날씨입니다.';
        } else if (currentTemp >= 16) {
          tipText = '<b>🍂 선선한 간절기 날씨:</b> 낮에는 가볍게 입어도 좋지만 아침/저녁 온천 지대나 야경 산책 시 쌀쌀하니 자켓이나 외투를 준비하세요.';
        } else {
          tipText = '<b>🧥 쌀쌀한 날씨:</b> 따뜻한 니트, 코트와 함께 목을 보호할 수 있는 스카프나 핫팩을 챙기시는 것을 추천합니다.';
        }

        if (todayRainProb >= 50) {
          tipText += '<br><br>☔ <b>비 소식이 있습니다:</b> 가벼운 3단 접이식 우산을 가방에 챙겨두세요!';
        }

        document.getElementById('clothTipBox').innerHTML = `<b>💡 ${city.name} 옷차림 & 챙김 팁:</b><br>${tipText}`;

      } catch (err) {
        console.error("Weather fetch error:", err);
        document.getElementById('weatherConditionText').innerText = '날씨를 불러오지 못했습니다.';
      }

    function getGiftDDay(dateStr) {
      if (!dateStr) return { text: '기한없음', urgent: false };
      const today = new Date();
      today.setHours(0,0,0,0);
      const due = new Date(dateStr);
      due.setHours(0,0,0,0);
      const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
      
      if (diff < 0) return { text: '만료됨', urgent: true };
      if (diff === 0) return { text: '오늘 마감!', urgent: true };
      return { text: `D-${diff}`, urgent: diff <= 7 };
    }

    function extractGifticonInfo(rawText) {
      const text = rawText.replace(/\r/g, '');
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      const globalDateRegex = /(202[0-9])[\.\-\/\s년]\s*([0-1]?[0-9])[\.\-\/\s월]\s*([0-3]?[0-9])/g;
      const allDates = [...text.matchAll(globalDateRegex)];

      if (allDates.length > 0) {
        const lastMatch = allDates[allDates.length - 1];
        const year = lastMatch[1];
        const month = lastMatch[2].padStart(2, '0');
        const day = lastMatch[3].padStart(2, '0');
        document.getElementById('giftDueDate').value = `${year}-${month}-${day}`;
      }

      const brands = [
        '스타벅스', 'Starbucks', '투썸플레이스', '투썸', '메가커피', '컴포즈커피', '컴포즈',
        '배스킨라빈스', '베스킨라빈스', 'BHC', 'BBQ', '교촌치킨', '교촌', '맘스터치',
        '올리브영', 'CU', 'GS25', '세븐일레븐', '버거킹', '맥도날드', '도미노피자',
        '이디야', '파리바게뜨', '파리바게트', '뚜레쥬르', '배달의민족', '카카오톡', '요기요'
      ];

      for (let brand of brands) {
        if (text.includes(brand)) {
          document.getElementById('giftBrand').value = brand.replace('베스킨라빈스', '배스킨라빈스').replace('파리바게트', '파리바게뜨');
          break;
        }
      }

      const ignoreWords = ['교환권', '모바일', '쿠폰', '바코드', '유효기간', '주문번호', '발행처', '사용처', '금액권', '사용불가', '원', 'No.', 'kakao', 'gift'];
      let candidateTitle = '';

      for (let line of lines) {
        if (/(202[0-9])/.test(line)) continue;
        if (/^\d+$/.test(line.replace(/[-\s]/g, ''))) continue;
        if (line.length < 2 || line.length > 35) continue;
        
        let hasIgnore = ignoreWords.some(w => line.includes(w));
        if (!hasIgnore) {
          candidateTitle = line.replace(/[^\w\sㄱ-ㅎㅏ-ㅣ가-힣+()]/g, '').trim();
          if (candidateTitle.length >= 2) break;
        }
      }

      if (candidateTitle && !document.getElementById('itemName').value) {
        document.getElementById('itemName').value = candidateTitle;
      }
    }

    function compressAndSaveImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

        appData.places.push({
          id: Date.now(),
          category: '고베',
          title: name,
          desc: memo,
          query: name
        });
        saveData();
        renderPlaces();
        closeModal();
      } else if (type === 'gifticon') {
        if (!appData.gifticons) appData.gifticons = [];
        const fileInput = document.getElementById('giftImage');
        const brand = document.getElementById('giftBrand').value.trim() || '기타';
        const dueDate = document.getElementById('giftDueDate').value;

        if (editId) {
          const targetIndex = appData.gifticons.findIndex(g => g.id === parseInt(editId));
          if (targetIndex > -1) {
            if (fileInput.files && fileInput.files[0]) {
              compressAndSaveImage(fileInput.files[0], function(compressedBase64) {
                appData.gifticons[targetIndex].brand = brand;
                appData.gifticons[targetIndex].name = name;
                appData.gifticons[targetIndex].dueDate = dueDate;
                appData.gifticons[targetIndex].memo = memo;
                appData.gifticons[targetIndex].img = compressedBase64;
                saveData();
                renderGifticons();
                closeModal();
              });
              return;
            } else {
              appData.gifticons[targetIndex].brand = brand;
              appData.gifticons[targetIndex].name = name;
              appData.gifticons[targetIndex].dueDate = dueDate;
              appData.gifticons[targetIndex].memo = memo;
              saveData();
              renderGifticons();
              closeModal();
              return;
            }
          }
        }

        if (fileInput.files && fileInput.files[0]) {
          compressAndSaveImage(fileInput.files[0], function(compressedBase64) {
            appData.gifticons.push({
              id: Date.now(),
              brand: brand,
              name: name,
              dueDate: dueDate,
              memo: memo,
              isUsed: false,
              img: compressedBase64
            });
            saveData();
            renderGifticons();
            closeModal();
          });
        } else {
          appData.gifticons.push({
            id: Date.now(),
            brand: brand,
            name: name,
            dueDate: dueDate,
            memo: memo,
            isUsed: false,
            img: editingGifticonExistingImg || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400'
          });
          saveData();
          renderGifticons();
          closeModal();
        }
      }
    }

    calculateDDay();
    renderAll();
  </script>
</body>
</html>
