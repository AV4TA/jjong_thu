name: Update Lineup Data

on:
  workflow_dispatch:
  schedule:
    # 한국 시간 기준: 11:30, 16:30, 17:10, 17:40, 18:10
    - cron: '30 2,7,8,9 * * *'

jobs:
  update-lineup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Lineup Updater
        run: python fetch_lineup.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ktwiz_data.json
          git commit -m "Update Lineup & Starter Pitcher" || echo "No changes to commit"
          git push || echo "Nothing to push"
