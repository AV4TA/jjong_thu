name: update-lineup

on:
  workflow_dispatch:
  schedule:
    # 한국 시간 기준 스케줄
    - cron: '0 15,19 * * *'
    - cron: '30 2,7,8 * * *'
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  update-lineup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Lineup Updater
        run: |
          node fetch_lineup.js || echo "Script finished with non-fatal warning"

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ktwiz_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Lineup & Starter Pitcher" && git push origin HEAD:${{ github.ref }})
