name: Update KT Wiz Baseball Data

on:
  schedule:
    # 한국 시간 기준: 00:00, 06:00, 13:00, 18:00, 22:00 (UTC 기준 15, 21, 4, 9, 13)
    - cron: '0 15,21,4,9,13 * * *'
  workflow_dispatch: # 수동 실행 지원

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Crawler Script
        run: python crawler.py

      - name: Pull Remote Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --rebase

      - name: Commit and Push Updated Data
        run: |
          git add baseball.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update KT Wiz Data [skip ci]" && git push)
