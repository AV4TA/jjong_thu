<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뚜쫑 서울 데이트 🍽️ | 서울 맛집 & 카페 TOP 15</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff758c" />

  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:fork-and-knife-with-plate.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:fork-and-knife-with-plate.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- 데이터 통합 파일 연동 (place 폴더 안) -->
  <script src="place/placesData.js"></script>

  <style>
    :root {
      --primary: #ff5e7e;
      --primary-soft: #fff0f3;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #2d3436;
      --text-sub: #8395a7;
      --border: #f1f2f6;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

    .app-header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      padding: 18px 20px;
      border-radius: 0 0 24px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.25);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.2);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-title { font-size: 1.25rem; font-weight: 800; }

    .container { max-width: 520px; margin: 0 auto; padding: 14px 16px; }

    .location-bar {
      background: white;
      padding: 10px 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
    }
    .radius-tag {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-left: 4px;
    }
    .btn-refresh-gps {
      background: var(--primary-soft);
      border: none;
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tab-bar {
      display: flex;
      gap: 6px;
      background: white;
      padding: 6px;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 4px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .filter-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .filter-scroll-box {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      flex: 1;
    }
    .filter-scroll-box::-webkit-scrollbar { display: none; }
    .filter-chip {
      white-space: nowrap;
      background: white;
      border: 1px solid var(--border);
      color: #57606f;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-chip.active {
      background: #2f3542;
      color: white;
      border-color: #2f3542;
    }

    .sort-toggle-box {
      display: flex;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px;
      margin-left: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .sort-btn {
      border: none;
      background: transparent;
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
    }
    .sort-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .place-list { display: flex; flex-direction: column; gap: 12px; }
    
    .place-card {
      background: white;
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .top-rank-badge {
      position: absolute;
      top: -6px;
      left: 16px;
      background: linear-gradient(135deg, #ff5e7e 0%, #ff758c 100%);
      color: white;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(255, 94, 126, 0.3);
    }

    .place-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 4px;
    }
    .place-title-group { display: flex; flex-direction: column; gap: 2px; }
    .place-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #2d3436;
      line-height: 1.3;
    }
    .place-rating-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffa502;
    }
    .review-text {
      color: #747d8c;
      font-weight: 600;
      font-size: 0.76rem;
    }
    .place-category {
      font-size: 0.78rem;
      color: #747d8c;
      font-weight: 600;
    }
    .place-distance {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f1f2f6;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--primary);
      white-space: nowrap;
    }
    .place-address {
      font-size: 0.82rem;
      color: #8395a7;
      line-height: 1.35;
    }
    
    .dessert-box {
      background: #fff8fa;
      border: 1px dashed #ffd1dc;
      padding: 8px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #d63031;
    }
    .dessert-tag-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .dessert-badge {
      background: white;
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid #ffd1dc;
      font-size: 0.76rem;
      font-weight: 800;
    }

    .place-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid #f8f9fa;
    }
    .link-group { display: flex; gap: 6px; }
    .btn-map-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      text-decoration: none;
    }
    .btn-kakao { background: #fee500; color: #3c1e1e; }
    .btn-naver { background: #03c75a; color: white; }

    .btn-heart {
      background: none;
      border: none;
      font-size: 1.45rem;
      color: #dcdde1;
      cursor: pointer;
      transition: transform 0.15s, color 0.15s;
      padding: 4px 6px;
    }
    .btn-heart.active { color: var(--primary); transform: scale(1.15); }

    .state-box {
      background: white;
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      color: var(--text-sub);
      font-weight: 700;
      box-shadow: var(--shadow);
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(47, 53, 66, 0.9);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 9999;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
      <div>
        <div class="header-title">서울 데이트 맛집 & 카페 TOP 15 ✨</div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="location-bar">
      <span>
        <i class="fa-solid fa-location-crosshairs" style="color:var(--primary); margin-right:4px;"></i> 
        <span id="txtLocation">내 위치 수신 중...</span>
        <span class="radius-tag" id="txtCoord">주소 확인 중</span>
      </span>
      <button class="btn-refresh-gps" onclick="getLocation()"><i class="fa-solid fa-rotate-right"></i> 갱신</button>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('tab-food', this)">🍽️ 서울 맛집 TOP 15</button>
      <button class="tab-btn" onclick="switchTab('tab-cafe', this)">☕ 감성 카페 TOP 15</button>
      <button class="tab-btn" onclick="switchTab('tab-wish', this)">💖 또 갈 곳</button>
    </div>

    <!-- 1. 맛집 탭 -->
    <div id="tab-food" class="tab-content active">
      <div class="filter-wrapper">
        <div class="filter-scroll-box">
          <button class="filter-chip active" onclick="setFoodCategory('전체', this)">전체</button>
          <button class="filter-chip" onclick="setFoodCategory('한식', this)">한식 🍚</button>
          <button class="filter-chip" onclick="setFoodCategory('일식', this)">일식 🍣</button>
          <button class="filter-chip" onclick="setFoodCategory('양식', this)">양식 🍝</button>
          <button class="filter-chip" onclick="setFoodCategory('중식', this)">중식 🥟</button>
          <button class="filter-chip" onclick="setFoodCategory('분식', this)">분식 🍢</button>
          <button class="filter-chip" onclick="setFoodCategory('고기', this)">고기 🥩</button>
        </div>
        <div class="sort-toggle-box">
          <button class="sort-btn active" id="btnSortDist" onclick="setSortMode('dist', this)">📍 가까운순</button>
          <button class="sort-btn" id="btnSortRating" onclick="setSortMode('rating', this)">⭐ 별점순</button>
        </div>
      </div>

      <div id="foodList" class="place-list"></div>
    </div>

    <!-- 2. 카페 탭 -->
    <div id="tab-cafe" class="tab-content">
      <div class="filter-wrapper" style="justify-content: flex-end;">
        <div class="sort-toggle-box">
          <button class="sort-btn active" id="btnSortDistCafe" onclick="setSortMode('dist', this)">📍 가까운순</button>
          <button class="sort-btn" id="btnSortRatingCafe" onclick="setSortMode('rating', this)">⭐ 별점순</button>
        </div>
      </div>
      <div id="cafeList" class="place-list"></div>
    </div>

    <!-- 3. 또 갈 곳 탭 -->
    <div id="tab-wish" class="tab-content">
      <div id="wishList" class="place-list">
        <div class="state-box">💖 하트로 찜한 '또 갈 곳'이 여기에 표시됩니다.</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">알림</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const wishCollection = db.collection("couple_space").doc("data").collection("saved_places");

    let currentLat = 37.5665; 
    let currentLng = 126.9780;
    let selectedFoodCategory = '전체';
    let currentActiveTab = 'tab-food';
    let currentSortMode = 'dist'; 
    let wishMap = {};

    function showToast(msg) {
      const t = document.getElementById("toastMsg");
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      currentActiveTab = tabId;

      if (tabId === 'tab-food') renderCuratedList('food');
      else if (tabId === 'tab-cafe') renderCuratedList('cafe');
      else if (tabId === 'tab-wish') renderWishList();
    }

    function setFoodCategory(cat, btn) {
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedFoodCategory = cat;
      renderCuratedList('food');
    }

    function setSortMode(mode, btn) {
      currentSortMode = mode;
      
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      if (mode === 'dist') {
        document.getElementById('btnSortDist').classList.add('active');
        document.getElementById('btnSortDistCafe').classList.add('active');
      } else {
        document.getElementById('btnSortRating').classList.add('active');
        document.getElementById('btnSortRatingCafe').classList.add('active');
      }

      renderCuratedList(currentActiveTab === 'tab-food' ? 'food' : 'cafe');
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function getLocation() {
      const txt = document.getElementById("txtLocation");
      const coord = document.getElementById("txtCoord");
      if (txt) txt.innerText = "GPS 수신 중...";

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            if (txt) txt.innerText = "내 위치 수신 완료 📍";
            
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}&zoom=18&addressdetails=1`, {
                headers: { 'Accept-Language': 'ko' }
              });
              const data = await res.json();
              if (data && data.address) {
                const addr = data.address;
                const district = addr.borough || addr.city_district || addr.suburb || addr.city || '';
                const neighborhood = addr.dong || addr.neighbourhood || addr.village || addr.road || '';
                if (coord) coord.innerText = `${district} ${neighborhood}`.trim() || "서울 중심가";
              } else {
                if (coord) coord.innerText = "서울 핫플 권역";
              }
            } catch (e) {
              if (coord) coord.innerText = "서울 권역";
            }

            renderCuratedList(currentActiveTab === 'tab-food' ? 'food' : 'cafe');
          },
          () => {
            if (txt) txt.innerText = "서울 중심 기준 정렬";
            if (coord) coord.innerText = "서울시 중구 (기본값)";
            renderCuratedList(currentActiveTab === 'tab-food' ? 'food' : 'cafe');
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      } else {
        if (txt) txt.innerText = "GPS 미지원";
        if (coord) coord.innerText = "위치 확인 불가";
        renderCuratedList(currentActiveTab === 'tab-food' ? 'food' : 'cafe');
      }
    }

    function renderCuratedList(type) {
      const container = document.getElementById(type === 'food' ? 'foodList' : 'cafeList');
      
      if (typeof CURATED_PLACES === 'undefined' || !CURATED_PLACES) {
        container.innerHTML = `<div class="state-box">핫플레이스 데이터를 불러오는 중입니다...</div>`;
        return;
      }

      let list = CURATED_PLACES.filter(p => p.type === type);

      if (type === 'food' && selectedFoodCategory !== '전체') {
        list = list.filter(p => p.cat === selectedFoodCategory);
      }

      list = list.map(p => ({
        ...p,
        dist: calculateDistance(currentLat, currentLng, p.lat, p.lon)
      }));

      if (currentSortMode === 'dist') {
        list.sort((a, b) => a.dist - b.dist);
      } else if (currentSortMode === 'rating') {
        list.sort((a, b) => parseFloat(b.rating || 4.5) - parseFloat(a.rating || 4.5));
      }

      // TOP 15개 슬라이싱
      const top15 = list.slice(0, 15);

      if (top15.length === 0) {
        container.innerHTML = `<div class="state-box">해당 조건에 일치하는 장소가 없습니다.</div>`;
        return;
      }

      container.innerHTML = top15.map((p, idx) => {
        const distText = p.dist >= 1000 ? `${(p.dist / 1000).toFixed(1)}km` : `${p.dist}m`;
        const walkMin = Math.max(1, Math.round(p.dist / 67));
        const isSaved = Boolean(wishMap[p.id]);

        const kakaoSearchUrl = `https://map.kakao.com/link/search/${encodeURIComponent(p.name)}`;
        const naverSearchUrl = `https://m.map.naver.com/search2/search.naver?query=${encodeURIComponent(p.name)}`;

        return `
          <div class="place-card">
            <div class="top-rank-badge">서울 TOP ${idx + 1}</div>
            <div class="place-card-top">
              <div class="place-title-group">
                <div class="place-title">${p.name}</div>
                <div class="place-rating-row">
                  <span>⭐ ${p.rating || '4.7'}</span>
                  <span class="review-text">(${p.reviews || '인기 데이트 핫플'})</span>
                </div>
                <div class="place-category">${p.cat || p.cuisine || ''}</div>
              </div>
              <div class="place-distance">
                <i class="fa-solid ${p.dist < 1500 ? 'fa-person-walking' : 'fa-car'}"></i> 
                ${distText} (${p.dist < 1500 ? `도보 ${walkMin}분` : '이동'})
              </div>
            </div>

            <div class="place-address">${p.addr}</div>

            ${type === 'cafe' && p.desserts ? `
              <div class="dessert-box">
                <span>✨ 대표 디저트:</span>
                <div class="dessert-tag-group">
                  <span class="dessert-badge">${p.desserts[0]}</span>
                  <span class="dessert-badge">${p.desserts[1]}</span>
                </div>
              </div>
            ` : ''}

            <div class="place-actions">
              <div class="link-group">
                <a href="${kakaoSearchUrl}" target="_blank" class="btn-map-link btn-kakao">
                  <i class="fa-solid fa-comment"></i> 카카오맵
                </a>
                <a href="${naverSearchUrl}" target="_blank" class="btn-map-link btn-naver">
                  <i class="fa-solid fa-n"></i> 네이버지도
                </a>
              </div>
              <button class="btn-heart ${isSaved ? 'active' : ''}" 
                onclick="toggleWish(this, '${p.id}', '${p.name.replace(/'/g, "\\'")}', '${p.cat || p.cuisine || ''}', '${kakaoSearchUrl}', '${p.addr}', '${type}')" 
                title="또 갈 곳 저장">
                <i class="fa-solid fa-heart"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleWish(btn, id, name, category, url, address, type) {
      const isSaved = Boolean(wishMap[id]);

      if (isSaved) {
        wishCollection.doc(id).delete().then(() => {
          btn.classList.remove('active');
          showToast(`'${name}' 또 갈 곳에서 삭제되었습니다.`);
        });
      } else {
        wishCollection.doc(id).set({
          name: name,
          category: category,
          url: url,
          address: address,
          type: type,
          savedAt: Date.now()
        }).then(() => {
          btn.classList.add('active');
          showToast(`'${name}' 또 갈 곳에 저장 완료! 💖`);
        });
      }
    }

    function renderWishList() {
      const container = document.getElementById("wishList");
      const list = Object.entries(wishMap).map(([id, item]) => ({ id, ...item }));

      if (list.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <i class="fa-solid fa-heart-crack" style="font-size:2rem; color:#ffb8c6; margin-bottom:10px;"></i><br>
            아직 저장된 '또 갈 곳'이 없습니다.<br>
            맛집과 카페에서 하트(❤️)를 눌러보세요!
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="place-card">
          <div class="place-card-top">
            <div>
              <div class="place-title">${item.name}</div>
              <div class="place-category">${item.category || (item.type === 'cafe' ? '카페' : '음식점')}</div>
            </div>
            <span style="font-size:0.75rem; color:#ff758c; font-weight:800;">💖 저장됨</span>
          </div>

          <div class="place-address">${item.address || ''}</div>

          <div class="place-actions">
            <a href="${item.url}" target="_blank" class="btn-map-link btn-kakao">
              <i class="fa-solid fa-location-arrow"></i> 카카오맵 바로가기
            </a>
            <button class="btn-heart active" onclick="deleteWish('${item.id}', '${item.name.replace(/'/g, "\\'")}')" title="삭제">
              <i class="fa-solid fa-heart"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function deleteWish(id, name) {
      wishCollection.doc(id).delete().then(() => {
        showToast(`'${name}' 또 갈 곳에서 삭제되었습니다.`);
      });
    }

    function listenWishlist() {
      wishCollection.onSnapshot(snapshot => {
        wishMap = {};
        snapshot.forEach(doc => {
          wishMap[doc.id] = doc.data();
        });
        if (currentActiveTab === 'tab-wish') renderWishList();
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      listenWishlist();
      getLocation();
    });
  </script>
</body>
</html>
