      font-weight: 700;

      border-radius: 6px;
      font-size: 0.75rem;
      margin-left: 4px;

      color: var(--primary);

      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;

    .tab-bar {
      display: flex;
      gap: 6px;
      background: white;
      padding: 6px;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 4px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;

    .tab-btn.active {
      background: var(--primary);
      color: white;

      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: none;

      font-size: 0.85rem;

      { id: "c_gn1", type: "cafe", name: "강릉 테라로사 경포호수점", cuisine: "북카페 > 핸드드립 명소", addr: "강원 강릉시 난설헌로 145", lat: 37.7915, lon: 128.9102, desserts: ["☕ 핸드드립 파나마", "🍰 피칸파이"] }
    ];

    function showToast(msg) {
      const t = document.getElementById("toastMsg");
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      currentActiveTab = tabId;

      if (tabId === 'tab-food') renderCuratedList('food');
      else if (tabId === 'tab-cafe') renderCuratedList('cafe');
      else if (tabId === 'tab-wish') renderWishList();
    }

    function setFoodCategory(cat, btn) {
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedFoodCategory = cat;
      renderCuratedList('food');
    }

    // Haversine 거리 계산 함수
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // meters
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function getLocation() {
      const txt = document.getElementById("txtLocation");
      txt.innerText = "내 위치 계산 중...";

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            txt.innerText = "GPS 위치 수신 완료 📍";
            renderCuratedList(currentActiveTab === 'tab-food' ? 'food' : 'cafe');
          },
          () => {
            txt.innerText = "기본 위치 적용";
            renderCuratedList(currentActiveTab === 'tab-food' ? 'food' : 'cafe');
          },
          { enableHighAccuracy: true, timeout: 4000 }
        );
      } else {
        txt.innerText = "GPS 미지원";
        renderCuratedList(currentActiveTab === 'tab-food' ? 'food' : 'cafe');
      }
    }

    // 도감 기반 초고속 정렬 & Top 5 렌더링
    function renderCuratedList(type) {
      const container = document.getElementById(type === 'food' ? 'foodList' : 'cafeList');
      
      let list = CURATED_PLACES.filter(p => p.type === type);

      if (type === 'food' && selectedFoodCategory !== '전체') {
        list = list.filter(p => p.cat === selectedFoodCategory);
      }

      // 내 현재 위치 기준 실시간 거리 계산 및 정렬
      list = list.map(p => ({
        ...p,
        dist: calculateDistance(currentLat, currentLng, p.lat, p.lon)
      })).sort((a, b) => a.dist - b.dist);

      const top5 = list.slice(0, 5);

      container.innerHTML = top5.map((p, idx) => {
        const distText = p.dist >= 1000 ? `${(p.dist / 1000).toFixed(1)}km` : `${p.dist}m`;
        const walkMin = Math.max(1, Math.round(p.dist / 67));
        const isSaved = Boolean(wishMap[p.id]);

        const kakaoSearchUrl = `https://map.kakao.com/link/search/${encodeURIComponent(p.name)}`;
        const naverSearchUrl = `https://m.map.naver.com/search2/search.naver?query=${encodeURIComponent(p.name)}`;

        return `
          <div class="place-card">
            <div class="top-rank-badge">추천 TOP ${idx + 1}</div>
            <div class="place-card-top">
              <div>
                <div class="place-title">${p.name}</div>
                <div class="place-category">${p.cuisine}</div>
              </div>
              <div class="place-distance">
                <i class="fa-solid ${p.dist < 1500 ? 'fa-person-walking' : 'fa-car'}"></i> 
                ${distText} (${p.dist < 1500 ? `도보 ${walkMin}분` : '차량 이동'})
              </div>
            </div>

            <div class="place-address">${p.addr}</div>

            ${type === 'cafe' && p.desserts ? `
              <div class="dessert-box">
                <span>✨ 대표 디저트:</span>
                <div class="dessert-tag-group">
                  <span class="dessert-badge">${p.desserts[0]}</span>
                  <span class="dessert-badge">${p.desserts[1]}</span>
                </div>
              </div>
            ` : ''}

            <div class="place-actions">
              <div class="link-group">
                <a href="${kakaoSearchUrl}" target="_blank" class="btn-map-link btn-kakao">
                  <i class="fa-solid fa-comment"></i> 카카오맵
                </a>
                <a href="${naverSearchUrl}" target="_blank" class="btn-map-link btn-naver">
                  <i class="fa-solid fa-n"></i> 네이버지도
                </a>
              </div>
              <button class="btn-heart ${isSaved ? 'active' : ''}" 
                onclick="toggleWish(this, '${p.id}', '${p.name.replace(/'/g, "\\'")}', '${p.cuisine}', '${kakaoSearchUrl}', '${p.addr}', '${type}')" 
                title="또 갈 곳 저장">
                <i class="fa-solid fa-heart"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleWish(btn, id, name, category, url, address, type) {
      const isSaved = Boolean(wishMap[id]);

      if (isSaved) {
        wishCollection.doc(id).delete().then(() => {
          btn.classList.remove('active');
          showToast(`'${name}' 또 갈 곳에서 삭제되었습니다.`);
        });
      } else {
        wishCollection.doc(id).set({
          name: name,
          category: category,
          url: url,
          address: address,
          type: type,
          savedAt: Date.now()
        }).then(() => {
          btn.classList.add('active');
          showToast(`'${name}' 또 갈 곳에 저장 완료! 💖`);
        });
      }
    }

    function renderWishList() {
      const container = document.getElementById("wishList");
      const list = Object.entries(wishMap).map(([id, item]) => ({ id, ...item }));

      if (list.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <i class="fa-solid fa-heart-crack" style="font-size:2rem; color:#ffb8c6; margin-bottom:10px;"></i><br>
            아직 저장된 '또 갈 곳'이 없습니다.<br>
            맛집과 카페에서 하트(❤️)를 눌러보세요!
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="place-card">
          <div class="place-card-top">
            <div>
              <div class="place-title">${item.name}</div>
              <div class="place-category">${item.category || (item.type === 'cafe' ? '카페' : '음식점')}</div>
            </div>
            <span style="font-size:0.75rem; color:#ff758c; font-weight:800;">💖 저장됨</span>
          </div>

          <div class="place-address">${item.address || ''}</div>

          <div class="place-actions">
            <a href="${item.url}" target="_blank" class="btn-map-link btn-kakao">
              <i class="fa-solid fa-location-arrow"></i> 카카오맵 바로가기
            </a>
            <button class="btn-heart active" onclick="deleteWish('${item.id}', '${item.name.replace(/'/g, "\\'")}')" title="삭제">
              <i class="fa-solid fa-heart"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function deleteWish(id, name) {
      wishCollection.doc(id).delete().then(() => {
        showToast(`'${name}' 또 갈 곳에서 삭제되었습니다.`);
      });
    }

    function listenWishlist() {
      wishCollection.onSnapshot(snapshot => {
        wishMap = {};
        snapshot.forEach(doc => {
          wishMap[doc.id] = doc.data();
        });
        if (currentActiveTab === 'tab-wish') renderWishList();
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      listenWishlist();
      getLocation();
    });
  </script>
</body>
</html>
