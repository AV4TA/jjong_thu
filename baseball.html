<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>위즈파크 직관 일기 ⚾ | kt wiz</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1e272e" />
  
  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:baseball.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:baseball.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --kt-red: #ea2027;
      --kt-dark: #1e272e;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2f3542;
      --text-sub: #747d8c;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #1e272e 0%, #2f3542 50%, #ea2027 100%);
      color: white;
      padding: 22px 18px 20px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(234, 32, 39, 0.25);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.15);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.3rem; font-weight: 900; letter-spacing: -0.5px; }
    .header-badge {
      background: rgba(234, 32, 39, 0.9);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 16px; }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      justify-content: flex-end;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #a4b0be; }
    .sync-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    .sync-dot.syncing { background: #ffa502; }

    /* 대시보드 요약 카드 */
    .dashboard-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .dashboard-card::before {
      content: '⚾';
      position: absolute;
      right: -10px;
      bottom: -15px;
      font-size: 6rem;
      opacity: 0.05;
      pointer-events: none;
    }
    .dash-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .dash-title { font-size: 0.95rem; font-weight: 800; color: #2f3542; display: flex; align-items: center; gap: 6px; }
    .win-rate-pill {
      background: #ffeaa7;
      color: #d63031;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
    }
    .dash-stats-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 8px;
      text-align: center;
    }
    .stat-box {
      background: #f8f9fa;
      padding: 12px 6px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; }
    .stat-val { font-size: 1.25rem; font-weight: 900; color: #2f3542; }
    .stat-val.rate { color: var(--kt-red); }
    .fairy-comment {
      margin-top: 14px;
      padding: 10px 14px;
      background: #fff0f3;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #e04565;
      text-align: center;
    }

    /* 직관 기록 카드 리스트 */
    .game-list { display: flex; flex-direction: column; gap: 14px; }
    .game-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .game-card-header {
      padding: 14px 16px;
      background: #fdfdfd;
      border-bottom: 1px solid #f1f2f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-date { font-size: 0.85rem; font-weight: 800; color: var(--text-sub); }
    .game-result-badge {
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 900;
      color: white;
    }
    .game-result-badge.win { background: #ea2027; }
    .game-result-badge.lose { background: #57606f; }
    .game-result-badge.draw { background: #ffa502; }
    .game-result-badge.scheduled { background: #747d8c; }

    .game-card-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .matchup-box {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px 0;
    }
    .team-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .team-name { font-size: 1.05rem; font-weight: 900; }
    .team-name.kt { color: var(--kt-red); }
    .score-text { font-size: 1.45rem; font-weight: 900; color: #2f3542; }

    .game-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #f8f9fc;
      padding: 12px;
      border-radius: 14px;
      font-size: 0.85rem;
    }
    .game-meta-item { display: flex; align-items: center; gap: 6px; color: #57606f; }
    .game-meta-item i { color: var(--kt-red); }

    .game-memo {
      font-size: 0.88rem;
      color: #2f3542;
      line-height: 1.45;
      background: #fafafa;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #f1f2f6;
    }

    .game-card-footer {
      padding: 10px 16px;
      border-top: 1px solid #f1f2f6;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-action-icon {
      background: none;
      border: none;
      color: #a4b0be;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 4px;
    }
    .btn-action-icon.del:hover { color: #ff4757; }

    /* FAB */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--kt-red);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 8px 24px rgba(234, 32, 39, 0.4);
      cursor: pointer;
      border: none;
      z-index: 50;
      transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.92); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; color: #2f3542; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; color: #333; }
    .form-control { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.95rem; outline: none; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }
    .btn { flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; }
    .btn-primary { background: var(--kt-red); color: white; }
    .btn-secondary { background: #f1f2f6; color: #57606f; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <a href="index.html" class="btn-home" title="홈으로"><i class="fa-solid fa-house"></i></a>
        <div>
          <div class="header-title">위즈파크 직관 일기 ⚾</div>
          <p style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">kt wiz 승리로드 🔥</p>
        </div>
      </div>
      <div class="header-badge">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>V2 마법</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncStatusText">서버 연결 중...</span>
    </div>

    <!-- 대시보드 요약 -->
    <div class="dashboard-card">
      <div class="dash-top">
        <div class="dash-title"><i class="fa-solid fa-trophy" style="color:#ffa502;"></i> 직관 전적 요약</div>
        <div class="win-rate-pill" id="badgeFairy">✨ 승리 요정</div>
      </div>
      <div class="dash-stats-row">
        <div class="stat-box">
          <span class="stat-label">직관</span>
          <span class="stat-val" id="statTotal">0회</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">승/무/패</span>
          <span class="stat-val" style="font-size: 1.05rem;" id="statRecord">0승 0패</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">승률</span>
          <span class="stat-val rate" id="statWinRate">0%</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">연승</span>
          <span class="stat-val" style="color:#2ed573;" id="statStreak">0연승</span>
        </div>
      </div>
      <div class="fairy-comment" id="fairyCommentText">위즈파크로 응원하러 가볼까요? 🧙‍♂️⚾</div>
    </div>

    <!-- 직관 다이어리 목록 -->
    <div id="tab-games" class="game-list"></div>
  </div>

  <button class="fab" id="fabAddBtn" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></button>

  <!-- 직관 경기 등록 모달 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 class="modal-title">⚾ 직관 경기 기록</h3>
      <input type="hidden" id="editGameId" value="">

      <div class="form-row">
        <div class="form-group">
          <label>경기 날짜</label>
          <input type="date" class="form-control" id="gameDate">
        </div>
        <div class="form-group">
          <label>경기 결과</label>
          <select class="form-control" id="gameResult">
            <option value="win">🔴 승리 (WIN!)</option>
            <option value="lose">⚫ 패배 (LOSE)</option>
            <option value="draw">🟡 무승부 (DRAW)</option>
            <option value="scheduled">⚪ 직관 예정</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>상대 구단</label>
          <select class="form-control" id="gameOpponent">
            <option value="LG 트윈스">LG 트윈스</option>
            <option value="SSG 랜더스">SSG 랜더스</option>
            <option value="두산 베어스">두산 베어스</option>
            <option value="KIA 타이거즈">KIA 타이거즈</option>
            <option value="삼성 라이온즈">삼성 라이온즈</option>
            <option value="롯데 자이언츠">롯데 자이언츠</option>
            <option value="한화 이글스">한화 이글스</option>
            <option value="NC 다이노스">NC 다이노스</option>
            <option value="키움 히어로즈">키움 히어로즈</option>
          </select>
        </div>
        <div class="form-group">
          <label>최종 스코어 (선택)</label>
          <input type="text" class="form-control" id="gameScore" placeholder="예: 7 : 4">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>구장 및 좌석 위치</label>
          <input type="text" class="form-control" id="gameSeat" placeholder="예: 위즈파크 1루 응원지정석">
        </div>
        <div class="form-group">
          <label>오늘의 MVP</label>
          <input type="text" class="form-control" id="gameMVP" placeholder="예: 강백호, 쿠에바스">
        </div>
      </div>

      <div class="form-group">
        <label>직관 일기 & 한 줄 메모</label>
        <textarea class="form-control" id="gameMemo" rows="3" placeholder="경기 분위기, 응원 후기 등 둘만의 직관 기록"></textarea>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveGame()">기록 저장하기</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 야구 직관 전용 독립 서브컬렉션
    const baseballCollection = db.collection("couple_space").doc("data").collection("baseball_games");

    let gameList = [];

    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncStatusText');

    // Firestore 실시간 동기화
    baseballCollection.onSnapshot((snapshot) => {
      const list = [];
      snapshot.forEach(doc => {
        list.push({ id: doc.id, ...doc.data() });
      });
      gameList = list;
      if (syncDot) syncDot.className = 'sync-dot online';
      if (syncText) syncText.innerText = '실시간 동기화 완료';
      updateDashboard();
      renderGames();
    }, error => {
      console.error("Firestore sync error:", error);
      if (syncDot) syncDot.className = 'sync-dot';
      if (syncText) syncText.innerText = '연결 오류';
    });

    function setSyncStatus(isSyncing) {
      if (isSyncing) {
        if (syncDot) syncDot.className = 'sync-dot syncing';
        if (syncText) syncText.innerText = '저장 중...';
      } else {
        if (syncDot) syncDot.className = 'sync-dot online';
        if (syncText) syncText.innerText = '실시간 동기화 완료';
      }
    }

    function updateDashboard() {
      const completedGames = gameList.filter(g => g.result === 'win' || g.result === 'lose' || g.result === 'draw');
      const wins = gameList.filter(g => g.result === 'win').length;
      const loses = gameList.filter(g => g.result === 'lose').length;
      const draws = gameList.filter(g => g.result === 'draw').length;

      const total = completedGames.length;
      const winRate = (wins + loses) > 0 ? Math.round((wins / (wins + loses)) * 100) : 0;

      document.getElementById('statTotal').innerText = `${gameList.length}회`;
      document.getElementById('statRecord').innerText = `${wins}승 ${draws ? draws + '무 ' : ''}${loses}패`;
      document.getElementById('statWinRate').innerText = `${winRate}%`;

      // 연승 계산
      let streak = 0;
      const sortedByDate = [...completedGames].sort((a, b) => new Date(b.date) - new Date(a.date));
      for (let g of sortedByDate) {
        if (g.result === 'win') streak++;
        else break;
      }
      document.getElementById('statStreak').innerText = `${streak}연승`;

      const commentEl = document.getElementById('fairyCommentText');
      const badgeEl = document.getElementById('badgeFairy');
      if (total === 0) {
        commentEl.innerText = "올 시즌 첫 직관을 등록해보세요! 🧙‍♂️⚾";
        badgeEl.innerText = "✨ 첫 직관 대기";
      } else if (winRate >= 70) {
        commentEl.innerText = `승률 ${winRate}%! 뚜쫑은 kt wiz의 절대적인 승리요정 🧚💖`;
        badgeEl.innerText = "🔥 승리 요정";
      } else if (winRate >= 50) {
        commentEl.innerText = `오늘도 승리의 함성을 함께 질러봐요! ⚡`;
        badgeEl.innerText = "⚾ 든든한 위즈팬";
      } else {
        commentEl.innerText = "다음 경기엔 반드시 승리한다! kt wiz 파이팅! 🔥";
        badgeEl.innerText = "✨ 열혈 응원단";
      }
    }

    function renderGames() {
      const container = document.getElementById('tab-games');
      let list = [...gameList];

      list.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

      if (list.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 50px 10px; color:#a4b0be;">
            <i class="fa-solid fa-baseball-bat-ball" style="font-size:3rem; margin-bottom:12px; color:#ea2027; opacity:0.4;"></i>
            <p style="font-size:1rem; font-weight:800; color:#4b5563;">아직 등록된 직관 기록이 없습니다.</p>
            <p style="font-size:0.85rem; margin-top:4px;">우측 하단의 <b>+</b> 버튼을 눌러 첫 직관을 기록해보세요!</p>
          </div>
        `;
        return;
      }

      const resultText = { win: 'WIN 🔴', lose: 'LOSE ⚫', draw: 'DRAW 🟡', scheduled: '직관 예정 ⚪' };

      container.innerHTML = list.map(g => `
        <div class="game-card">
          <div class="game-card-header">
            <span class="game-date">📅 ${g.date || '날짜 미정'}</span>
            <span class="game-result-badge ${g.result || 'win'}">${resultText[g.result] || 'WIN'}</span>
          </div>
          <div class="game-card-body">
            <div class="matchup-box">
              <div class="team-col">
                <span class="team-name kt">kt wiz</span>
              </div>
              <span class="score-text">${g.score || 'VS'}</span>
              <div class="team-col">
                <span class="team-name">${g.opponent || '상대팀'}</span>
              </div>
            </div>

            <div class="game-meta-grid">
              <div class="game-meta-item"><i class="fa-solid fa-chair"></i> ${g.seat || '좌석 미정'}</div>
              <div class="game-meta-item"><i class="fa-solid fa-star"></i> MVP: ${g.mvp || 'kt wiz 선수단'}</div>
            </div>

            ${g.memo ? `<div class="game-memo">📝 ${g.memo}</div>` : ''}
          </div>
          <div class="game-card-footer">
            <button class="btn-action-icon" onclick="editGame('${g.id}')"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-action-icon del" onclick="deleteGame('${g.id}')"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
      `).join('');
    }

    function saveGame() {
      const editId = document.getElementById('editGameId').value;
      const date = document.getElementById('gameDate').value;
      const result = document.getElementById('gameResult').value;
      const opponent = document.getElementById('gameOpponent').value;
      const score = document.getElementById('gameScore').value.trim();
      const seat = document.getElementById('gameSeat').value.trim();
      const mvp = document.getElementById('gameMVP').value.trim();
      const memo = document.getElementById('gameMemo').value.trim();
      const submitBtn = document.getElementById('btnSaveSubmit');

      if (!date) return alert('경기 날짜를 선택해주세요!');

      submitBtn.disabled = true;
      submitBtn.innerText = '저장 중...';
      setSyncStatus(true);

      const docId = editId || String(Date.now());
      const dataObj = {
        date: date,
        result: result,
        opponent: opponent,
        score: score,
        seat: seat,
        mvp: mvp,
        memo: memo,
        updatedAt: Date.now()
      };

      baseballCollection.doc(docId).set(dataObj, { merge: true })
        .then(() => {
          setSyncStatus(false);
          submitBtn.disabled = false;
          submitBtn.innerText = '기록 저장하기';
          closeModal();
        })
        .catch(err => {
          console.error("저장 실패:", err);
          setSyncStatus(false);
          submitBtn.disabled = false;
          submitBtn.innerText = '기록 저장하기';
          alert("저장 중 오류가 발생했습니다: " + err.message);
        });
    }

    function editGame(id) {
      const g = gameList.find(item => item.id === id);
      if (!g) return;
      document.getElementById('editGameId').value = g.id;
      document.getElementById('gameDate').value = g.date || '';
      document.getElementById('gameResult').value = g.result || 'win';
      document.getElementById('gameOpponent').value = g.opponent || 'LG 트윈스';
      document.getElementById('gameScore').value = g.score || '';
      document.getElementById('gameSeat').value = g.seat || '';
      document.getElementById('gameMVP').value = g.mvp || '';
      document.getElementById('gameMemo').value = g.memo || '';
      document.getElementById('addModal').classList.add('active');
    }

    function deleteGame(id) {
      if (confirm('이 직관 기록을 삭제할까요?')) {
        setSyncStatus(true);
        baseballCollection.doc(id).delete()
          .then(() => setSyncStatus(false))
          .catch(err => { console.error(err); setSyncStatus(false); });
      }
    }

    function openAddModal() {
      document.getElementById('editGameId').value = '';
      document.getElementById('gameDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('gameScore').value = '';
      document.getElementById('gameSeat').value = '';
      document.getElementById('gameMVP').value = '';
      document.getElementById('gameMemo').value = '';
      document.getElementById('addModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
    }
  </script>
</body>
</html>
