<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>위즈파크 직관 일기 ⚾ | kt wiz</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1e272e" />
  
  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:baseball.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:baseball.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --kt-red: #ea2027;
      --kt-dark: #1e272e;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2f3542;
      --text-sub: #747d8c;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #1e272e 0%, #2f3542 50%, #ea2027 100%);
      color: white;
      padding: 22px 18px 20px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(234, 32, 39, 0.25);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.15);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.3rem; font-weight: 900; letter-spacing: -0.5px; }
    .header-badge {
      background: rgba(234, 32, 39, 0.9);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 16px; }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      justify-content: flex-end;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #a4b0be; }
    .sync-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    .sync-dot.syncing { background: #ffa502; }

    /* 대시보드 요약 카드 */
    .dashboard-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .dashboard-card::before {
      content: '⚾';
      position: absolute;
      right: -10px;
      bottom: -15px;
      font-size: 6rem;
      opacity: 0.05;
      pointer-events: none;
    }
    .dash-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .dash-title { font-size: 0.95rem; font-weight: 800; color: #2f3542; display: flex; align-items: center; gap: 6px; }
    .win-rate-pill {
      background: #ffeaa7;
      color: #d63031;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
    }
    .dash-stats-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 8px;
      text-align: center;
    }
    .stat-box {
      background: #f8f9fa;
      padding: 12px 6px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; }
    .stat-val { font-size: 1.25rem; font-weight: 900; color: #2f3542; }
    .stat-val.rate { color: var(--kt-red); }
    .fairy-comment {
      margin-top: 14px;
      padding: 10px 14px;
      background: #fff0f3;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #e04565;
      text-align: center;
    }

    /* 직관 기록 카드 리스트 */
    .game-list { display: flex; flex-direction: column; gap: 14px; }
    .game-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .game-card-header {
      padding: 14px 16px;
      background: #fdfdfd;
      border-bottom: 1px solid #f1f2f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-date { font-size: 0.88rem; font-weight: 800; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
    .game-result-badge {
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 900;
      color: white;
    }
    .game-result-badge.win { background: #ea2027; }
    .game-result-badge.lose { background: #57606f; }
    .game-result-badge.draw { background: #ffa502; }
    .game-result-badge.scheduled { background: #747d8c; }
    .game-result-badge.canceled { background: #a4b0be; }

    .game-card-body { padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
    .matchup-box {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 0;
    }
    .team-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .team-name { font-size: 1.15rem; font-weight: 900; }
    .team-name.kt { color: var(--kt-red); }
    .score-text { font-size: 1.55rem; font-weight: 900; color: #2f3542; letter-spacing: 1px; }

    .game-stadium-tag {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 700;
    }

    .game-card-footer {
      padding: 10px 16px;
      border-top: 1px solid #f1f2f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-update-score {
      background: #f1f2f6;
      border: none;
      color: #57606f;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-update-score:active { background: var(--kt-red); color: white; }

    .btn-del-game {
      background: none;
      border: none;
      color: #a4b0be;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 4px;
    }
    .btn-del-game:hover { color: #ff4757; }

    /* 자동 조회 알림 바 */
    .auto-fetch-box {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #4338ca;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 요약 미리보기 박스 */
    .preview-summary {
      background: #f8f9fc;
      border: 1px dashed #dcdde1;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
    }
    .preview-row { display: flex; justify-content: space-between; font-weight: 700; }

    /* FAB */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--kt-red);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 8px 24px rgba(234, 32, 39, 0.4);
      cursor: pointer;
      border: none;
      z-index: 50;
      transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.92); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; color: #2f3542; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; color: #333; }
    .form-control { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 1rem; font-weight: 600; outline: none; }
    .btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; }
    .btn-primary { background: var(--kt-red); color: white; }
    .btn-secondary { background: #f1f2f6; color: #57606f; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <a href="index.html" class="btn-home" title="홈으로"><i class="fa-solid fa-house"></i></a>
        <div>
          <div class="header-title">위즈파크 직관 일기 ⚾</div>
          <p style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">뚜쫑 커플의 kt wiz 직관 승률 🔥</p>
        </div>
      </div>
      <div class="header-badge">
        <i class="fa-solid fa-bolt"></i>
        <span>KBO 자동</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncStatusText">서버 연결 중...</span>
    </div>

    <!-- 대시보드 요약 -->
    <div class="dashboard-card">
      <div class="dash-top">
        <div class="dash-title"><i class="fa-solid fa-trophy" style="color:#ffa502;"></i> 직관 전적 요약</div>
        <div class="win-rate-pill" id="badgeFairy">✨ 승리 요정</div>
      </div>
      <div class="dash-stats-row">
        <div class="stat-box">
          <span class="stat-label">직관</span>
          <span class="stat-val" id="statTotal">0회</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">승/무/패</span>
          <span class="stat-val" style="font-size: 1.05rem;" id="statRecord">0승 0패</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">승률</span>
          <span class="stat-val rate" id="statWinRate">0%</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">연승</span>
          <span class="stat-val" style="color:#2ed573;" id="statStreak">0연승</span>
        </div>
      </div>
      <div class="fairy-comment" id="fairyCommentText">직관 날짜를 등록해보세요! 🧙‍♂️⚾</div>
    </div>

    <!-- 직관 다이어리 목록 -->
    <div id="tab-games" class="game-list"></div>
  </div>

  <button class="fab" id="fabAddBtn" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></button>

  <!-- 직관 경기 등록 모달 (날짜만 선택) -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 class="modal-title">⚾ 직관 날짜 선택</h3>

      <div class="form-group">
        <label>경기 날짜</label>
        <input type="date" class="form-control" id="gameDate" onchange="fetchKboGameData(this.value)">
      </div>

      <div class="auto-fetch-box" id="autoFetchBox">
        <i class="fa-solid fa-circle-notch fa-spin" id="fetchSpinner"></i>
        <span id="autoFetchText">KBO 공식 DB에서 경기 결과를 조회하는 중...</span>
      </div>

      <!-- 자동 분석된 경기 요약 정보 미리보기 -->
      <div class="preview-summary" id="previewSummary">
        <div class="preview-row">
          <span style="color:var(--text-sub);">상대 구단:</span>
          <span id="previewOpponent" style="color:#2f3542;">-</span>
        </div>
        <div class="preview-row">
          <span style="color:var(--text-sub);">최종 결과:</span>
          <span id="previewResult" style="color:var(--kt-red);">-</span>
        </div>
        <div class="preview-row">
          <span style="color:var(--text-sub);">구장 위치:</span>
          <span id="previewStadium" style="color:#57606f;">-</span>
        </div>
      </div>

      <!-- 히든 필드 (자동 세팅 후 Firestore 저장용) -->
      <input type="hidden" id="fetchedOpponent" value="">
      <input type="hidden" id="fetchedResult" value="">
      <input type="hidden" id="fetchedScore" value="">
      <input type="hidden" id="fetchedStadium" value="">

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveGame()">직관 기록 추가</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const baseballCollection = db.collection("couple_space").doc("data").collection("baseball_games");

    let gameList = [];

    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncStatusText');

    // Firestore 실시간 동기화
    baseballCollection.onSnapshot((snapshot) => {
      const list = [];
      snapshot.forEach(doc => {
        list.push({ id: doc.id, ...doc.data() });
      });
      gameList = list;
      if (syncDot) syncDot.className = 'sync-dot online';
      if (syncText) syncText.innerText = '실시간 동기화 완료';
      updateDashboard();
      renderGames();
    }, error => {
      console.error("Firestore sync error:", error);
      if (syncDot) syncDot.className = 'sync-dot';
      if (syncText) syncText.innerText = '연결 오류';
    });

    function setSyncStatus(isSyncing) {
      if (isSyncing) {
        if (syncDot) syncDot.className = 'sync-dot syncing';
        if (syncText) syncText.innerText = '저장 중...';
      } else {
        if (syncDot) syncDot.className = 'sync-dot online';
        if (syncText) syncText.innerText = '실시간 동기화 완료';
      }
    }

    // ★ KBO 공식 실시간 경기 데이터 100% 자동 분석 함수
    async function fetchKboGameData(dateStr) {
      if (!dateStr) return;
      const boxText = document.getElementById('autoFetchText');
      const spinner = document.getElementById('fetchSpinner');
      spinner.style.display = 'inline-block';
      boxText.innerText = `${dateStr} kt wiz 경기 데이터 분석 중...`;

      const targetUrl = `https://api-gw.sports.naver.com/schedule/games?upperCategoryId=kbaseball&fromDate=${dateStr}&toDate=${dateStr}&size=50`;
      
      try {
        let responseData = null;

        try {
          const res = await fetch(targetUrl);
          if (res.ok) responseData = await res.json();
        } catch (e) {
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
          const res = await fetch(proxyUrl);
          if (res.ok) responseData = await res.json();
        }

        const games = (responseData && responseData.result && responseData.result.games) ? responseData.result.games : [];
        
        const ktGame = games.find(g => 
          (g.homeTeamName && g.homeTeamName.includes('KT')) ||
          (g.awayTeamName && g.awayTeamName.includes('KT')) ||
          g.homeTeamCode === 'KT' || g.awayTeamCode === 'KT'
        );

        spinner.style.display = 'none';

        if (!ktGame) {
          boxText.innerText = `해당 날짜에는 kt wiz 경기 일정이 없습니다.`;
          document.getElementById('previewOpponent').innerText = '경기 없음';
          document.getElementById('previewResult').innerText = '-';
          document.getElementById('previewStadium').innerText = '-';
          return;
        }

        const isHome = (ktGame.homeTeamName && ktGame.homeTeamName.includes('KT')) || ktGame.homeTeamCode === 'KT';
        const opponentRaw = isHome ? ktGame.awayTeamName : ktGame.homeTeamName;
        const stadium = ktGame.stadium || (isHome ? '수원 케이티위즈파크' : '원정 구장');

        const teamMap = {
          'LG': 'LG 트윈스', 'SSG': 'SSG 랜더스', '두산': '두산 베어스', 'KIA': 'KIA 타이거즈',
          '삼성': '삼성 라이온즈', '롯데': '롯데 자이언츠', '한화': '한화 이글스', 'NC': 'NC 다이노스', '키움': '키움 히어로즈'
        };
        const mappedOpponent = teamMap[opponentRaw] || Object.values(teamMap).find(t => t.includes(opponentRaw)) || opponentRaw;
        
        const stadiumText = isHome ? `수원 위즈파크 (홈)` : `${stadium} (원정)`;
        const statusCode = ktGame.statusCode || '';
        const status = ktGame.status || '';

        let result = 'scheduled';
        let scoreStr = 'VS';
        let resultLabel = '⚪ 직관 예정';

        if (status.includes('취소') || statusCode === 'CANCEL') {
          result = 'canceled';
          scoreStr = '취소';
          resultLabel = '🌧️ 우천/경기 취소';
          boxText.innerText = `🌧️ ${mappedOpponent}전 취소된 경기입니다.`;
        } else if (statusCode === 'RESULT' || status.includes('종료') || (ktGame.homeTeamScore !== undefined && ktGame.awayTeamScore !== undefined && ktGame.homeTeamScore !== null)) {
          const ktScore = isHome ? ktGame.homeTeamScore : ktGame.awayTeamScore;
          const oppScore = isHome ? ktGame.awayTeamScore : ktGame.homeTeamScore;

          scoreStr = `KT ${ktScore} : ${oppScore} ${opponentRaw}`;

          if (ktScore > oppScore) {
            result = 'win';
            resultLabel = `🔴 승리 (KT ${ktScore} : ${oppScore})`;
            boxText.innerText = `🔴 ${ktScore}:${oppScore} [kt wiz 승리!] 데이터가 로드되었습니다.`;
          } else if (ktScore < oppScore) {
            result = 'lose';
            resultLabel = `⚫ 패배 (KT ${ktScore} : ${oppScore})`;
            boxText.innerText = `⚫ ${ktScore}:${oppScore} [kt wiz 패배] 데이터가 로드되었습니다.`;
          } else {
            result = 'draw';
            resultLabel = `🟡 무승부 (KT ${ktScore} : ${oppScore})`;
            boxText.innerText = `🟡 ${ktScore}:${oppScore} [무승부] 데이터가 로드되었습니다.`;
          }
        } else {
          result = 'scheduled';
          scoreStr = 'VS';
          resultLabel = '⚪ 직관 예정';
          boxText.innerText = `⚪ ${mappedOpponent}전 직관 예정 경기로 로드되었습니다.`;
        }

        // 히든 필드 & 미리보기 UI 업데이트
        document.getElementById('fetchedOpponent').value = mappedOpponent;
        document.getElementById('fetchedResult').value = result;
        document.getElementById('fetchedScore').value = scoreStr;
        document.getElementById('fetchedStadium').value = stadiumText;

        document.getElementById('previewOpponent').innerText = `${mappedOpponent} (${isHome ? '홈' : '원정'})`;
        document.getElementById('previewResult').innerText = resultLabel;
        document.getElementById('previewStadium').innerText = stadiumText;

      } catch (err) {
        spinner.style.display = 'none';
        boxText.innerText = `경기 데이터를 가져오지 못했습니다.`;
      }
    }

    // 카드에서 바로 경기결과 최신 갱신
    async function updateGameResultById(id, dateStr) {
      if (!dateStr) return alert('날짜 정보가 없습니다.');
      const targetUrl = `https://api-gw.sports.naver.com/schedule/games?upperCategoryId=kbaseball&fromDate=${dateStr}&toDate=${dateStr}&size=50`;
      
      try {
        let responseData = null;
        try {
          const res = await fetch(targetUrl);
          if (res.ok) responseData = await res.json();
        } catch(e) {
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
          const res = await fetch(proxyUrl);
          if (res.ok) responseData = await res.json();
        }

        const games = (responseData && responseData.result && responseData.result.games) ? responseData.result.games : [];
        const ktGame = games.find(g => 
          (g.homeTeamName && g.homeTeamName.includes('KT')) ||
          (g.awayTeamName && g.awayTeamName.includes('KT')) ||
          g.homeTeamCode === 'KT' || g.awayTeamCode === 'KT'
        );

        if (!ktGame) return alert('해당 날짜에 kt wiz 경기 데이터가 없습니다.');

        const isHome = (ktGame.homeTeamName && ktGame.homeTeamName.includes('KT')) || ktGame.homeTeamCode === 'KT';
        const opponentRaw = isHome ? ktGame.awayTeamName : ktGame.homeTeamName;

        let result = 'scheduled';
        let scoreStr = 'VS';

        if ((ktGame.status && ktGame.status.includes('취소')) || ktGame.statusCode === 'CANCEL') {
          result = 'canceled';
          scoreStr = '취소';
        } else if (ktGame.statusCode === 'RESULT' || (ktGame.status && ktGame.status.includes('종료'))) {
          const ktScore = isHome ? ktGame.homeTeamScore : ktGame.awayTeamScore;
          const oppScore = isHome ? ktGame.awayTeamScore : ktGame.homeTeamScore;
          scoreStr = `KT ${ktScore} : ${oppScore} ${opponentRaw}`;
          result = ktScore > oppScore ? 'win' : (ktScore < oppScore ? 'lose' : 'draw');
        } else {
          return alert('아직 경기가 시작되지 않았거나 진행 중입니다.');
        }

        setSyncStatus(true);
        baseballCollection.doc(id).update({
          result: result,
          score: scoreStr,
          updatedAt: Date.now()
        }).then(() => {
          setSyncStatus(false);
          alert('경기 결과가 최신 상태로 갱신되었습니다! ✨');
        });

      } catch(err) {
        alert('경기 결과를 가져오지 못했습니다: ' + err.message);
      }
    }

    function updateDashboard() {
      const completedGames = gameList.filter(g => g.result === 'win' || g.result === 'lose' || g.result === 'draw');
      const wins = gameList.filter(g => g.result === 'win').length;
      const loses = gameList.filter(g => g.result === 'lose').length;
      const draws = gameList.filter(g => g.result === 'draw').length;

      const total = completedGames.length;
      const winRate = (wins + loses) > 0 ? Math.round((wins / (wins + loses)) * 100) : 0;

      document.getElementById('statTotal').innerText = `${gameList.length}회`;
      document.getElementById('statRecord').innerText = `${wins}승 ${draws ? draws + '무 ' : ''}${loses}패`;
      document.getElementById('statWinRate').innerText = `${winRate}%`;

      let streak = 0;
      const sortedByDate = [...completedGames].sort((a, b) => new Date(b.date) - new Date(a.date));
      for (let g of sortedByDate) {
        if (g.result === 'win') streak++;
        else break;
      }
      document.getElementById('statStreak').innerText = `${streak}연승`;

      const commentEl = document.getElementById('fairyCommentText');
      const badgeEl = document.getElementById('badgeFairy');
      if (total === 0) {
        commentEl.innerText = "직관 날짜를 등록해보세요! 🧙‍♂️⚾";
        badgeEl.innerText = "✨ 첫 직관 대기";
      } else if (winRate >= 70) {
        commentEl.innerText = `승률 ${winRate}%! 뚜쫑은 kt wiz의 절대적인 승리요정 🧚💖`;
        badgeEl.innerText = "🔥 승리 요정";
      } else if (winRate >= 50) {
        commentEl.innerText = `오늘도 승리의 함성을 함께 질러봐요! ⚡`;
        badgeEl.innerText = "⚾ 든든한 위즈팬";
      } else {
        commentEl.innerText = "다음 경기엔 반드시 승리한다! kt wiz 파이팅! 🔥";
        badgeEl.innerText = "✨ 열혈 응원단";
      }
    }

    function renderGames() {
      const container = document.getElementById('tab-games');
      let list = [...gameList];

      list.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

      if (list.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 50px 10px; color:#a4b0be;">
            <i class="fa-solid fa-baseball-bat-ball" style="font-size:3rem; margin-bottom:12px; color:#ea2027; opacity:0.4;"></i>
            <p style="font-size:1rem; font-weight:800; color:#4b5563;">아직 등록된 직관 기록이 없습니다.</p>
            <p style="font-size:0.85rem; margin-top:4px;">우측 하단의 <b>+</b> 버튼을 눌러 직관 날짜를 등록해보세요!</p>
          </div>
        `;
        return;
      }

      const resultText = { win: 'WIN 🔴', lose: 'LOSE ⚫', draw: 'DRAW 🟡', scheduled: '직관 예정 ⚪', canceled: '취소 🌧️' };

      container.innerHTML = list.map(g => `
        <div class="game-card">
          <div class="game-card-header">
            <span class="game-date">📅 ${g.date || '날짜 미정'}</span>
            <span class="game-result-badge ${g.result || 'win'}">${resultText[g.result] || 'WIN'}</span>
          </div>
          <div class="game-card-body">
            <div class="matchup-box">
              <div class="team-col">
                <span class="team-name kt">kt wiz</span>
              </div>
              <span class="score-text">${g.score || 'VS'}</span>
              <div class="team-col">
                <span class="team-name">${g.opponent || '상대팀'}</span>
              </div>
            </div>
            <div class="game-stadium-tag">📍 ${g.stadium || '경기장'}</div>
          </div>
          <div class="game-card-footer">
            <div>
              ${g.result === 'scheduled' ? `
                <button class="btn-update-score" onclick="updateGameResultById('${g.id}', '${g.date}')">
                  <i class="fa-solid fa-rotate"></i> 결과 갱신
                </button>
              ` : '<span></span>'}
            </div>
            <button class="btn-del-game" title="삭제" onclick="deleteGame('${g.id}')"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
      `).join('');
    }

    function saveGame() {
      const date = document.getElementById('gameDate').value;
      const opponent = document.getElementById('fetchedOpponent').value;
      const result = document.getElementById('fetchedResult').value || 'scheduled';
      const score = document.getElementById('fetchedScore').value || 'VS';
      const stadium = document.getElementById('fetchedStadium').value || '수원 케이티위즈파크';
      const submitBtn = document.getElementById('btnSaveSubmit');

      if (!date) return alert('경기 날짜를 선택해주세요!');
      if (!opponent || opponent === '경기 없음') return alert('해당 날짜에는 kt wiz 경기 일정이 없습니다.');

      submitBtn.disabled = true;
      submitBtn.innerText = '저장 중...';
      setSyncStatus(true);

      const docId = String(Date.now());
      const dataObj = {
        date: date,
        opponent: opponent,
        result: result,
        score: score,
        stadium: stadium,
        createdAt: Date.now()
      };

      baseballCollection.doc(docId).set(dataObj, { merge: true })
        .then(() => {
          setSyncStatus(false);
          submitBtn.disabled = false;
          submitBtn.innerText = '직관 기록 추가';
          closeModal();
        })
        .catch(err => {
          console.error("저장 실패:", err);
          setSyncStatus(false);
          submitBtn.disabled = false;
          submitBtn.innerText = '직관 기록 추가';
          alert("저장 중 오류가 발생했습니다: " + err.message);
        });
    }

    function deleteGame(id) {
      if (confirm('이 직관 기록을 삭제할까요?')) {
        setSyncStatus(true);
        baseballCollection.doc(id).delete()
          .then(() => setSyncStatus(false))
          .catch(err => { console.error(err); setSyncStatus(false); });
      }
    }

    function openAddModal() {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('gameDate').value = todayStr;
      document.getElementById('fetchedOpponent').value = '';
      document.getElementById('fetchedResult').value = '';
      document.getElementById('fetchedScore').value = '';
      document.getElementById('fetchedStadium').value = '';
      document.getElementById('addModal').classList.add('active');
      
      // 모달 오픈 시 오늘 날짜 경기 자동 조회
      fetchKboGameData(todayStr);
    }

    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
    }
  </script>
</body>
