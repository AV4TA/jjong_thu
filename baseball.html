<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kt wiz 직관 일기 ⚾</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root { --kt-red: #ea2027; --bg: #f5f6fa; }
    body { font-family: 'Pretendard', sans-serif; background: var(--bg); padding-bottom: 80px; }
    .header { background: var(--kt-red); color: white; padding: 20px; font-weight: 800; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .game-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .btn-fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; background: var(--kt-red); color: white; border-radius: 50%; border: none; font-size: 1.5rem; }
  </style>
</head>
<body>
  <div class="header">⚾ kt wiz 직관 일기</div>
  <div class="container" id="gameList"></div>
  <button class="btn-fab" onclick="alert('직관 추가 모달 오픈')">+</button>

  <script>
    // 데이터 불러오기
    async function loadData() {
      const res = await fetch('./ktwiz_data.json?t=' + Date.now());
      const data = await res.json();
      renderGames(data.schedule);
    }
    
    function renderGames(schedule) {
      const container = document.getElementById('gameList');
      container.innerHTML = Object.values(schedule).map(g => `
        <div class="card">
          <div style="font-size: 0.8rem; color: #888;">${g.date}</div>
          <div style="font-weight: 800;">${g.opponent} vs KT</div>
          <div>결과: ${g.score}</div>
        </div>
      `).join('');
    }
    loadData();
  </script>
</body>
</html>
