<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>위즈파크 직관 일기 ⚾ | kt wiz</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1e272e" />
  
  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:baseball.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:baseball.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --kt-red: #ea2027;
      --kt-dark: #1e272e;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2f3542;
      --text-sub: #747d8c;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    .app-header {
      background: linear-gradient(135deg, #1e272e 0%, #2f3542 50%, #ea2027 100%);
      color: white;
      padding: 20px 18px 16px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 6px 20px rgba(234, 32, 39, 0.25);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.15);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.5px; }

    /* 상단 4개 탭 */
    .tab-bar {
      display: flex;
      gap: 6px;
      background: white;
      padding: 6px;
      border-radius: 16px;
      margin: 14px 16px 8px;
      box-shadow: var(--shadow);
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 4px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--kt-red);
      color: white;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 10px 16px; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 요약 카드 */
    .dashboard-card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .dashboard-card::before {
      content: '⚾';
      position: absolute;
      right: -10px;
      bottom: -15px;
      font-size: 5.5rem;
      opacity: 0.05;
      pointer-events: none;
    }
    .dash-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .dash-title { font-size: 0.92rem; font-weight: 800; color: #2f3542; display: flex; align-items: center; gap: 6px; }
    .win-rate-pill {
      background: #ffeaa7;
      color: #d63031;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 800;
    }
    .dash-stats-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 8px;
      text-align: center;
    }
    .stat-box {
      background: #f8f9fa;
      padding: 10px 4px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .stat-label { font-size: 0.72rem; color: var(--text-sub); font-weight: 700; }
    .stat-val { font-size: 1.15rem; font-weight: 900; color: #2f3542; }
    .stat-val.rate { color: var(--kt-red); }
    .fairy-comment {
      margin-top: 12px;
      padding: 8px 12px;
      background: #fff0f3;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #e04565;
      text-align: center;
    }

    /* 카드 리스트 */
    .game-list { display: flex; flex-direction: column; gap: 12px; }
    .game-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .game-card-header {
      padding: 12px 14px;
      background: #fdfdfd;
      border-bottom: 1px solid #f1f2f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-date { font-size: 0.85rem; font-weight: 800; color: var(--text-sub); }
    .game-result-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 900;
      color: white;
    }
    .game-result-badge.win { background: #ea2027; }
    .game-result-badge.lose { background: #57606f; }
    .game-result-badge.draw { background: #ffa502; }
    .game-result-badge.scheduled { background: #747d8c; }
    .game-result-badge.canceled { background: #a4b0be; }

    .game-card-body { padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; }
    .matchup-box { display: flex; align-items: center; justify-content: space-around; }
    .team-col { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 80px; }
    .team-name { font-size: 1.05rem; font-weight: 900; text-align: center; }
    .team-name.kt { color: var(--kt-red); }
    .score-text { font-size: 1.25rem; font-weight: 900; color: #2f3542; letter-spacing: 0.5px; }
    .game-stadium-tag { text-align: center; font-size: 0.8rem; color: var(--text-sub); font-weight: 700; }

    .game-card-footer {
      padding: 8px 14px;
      border-top: 1px solid #f1f2f6;
      display: flex;
      justify-content: flex-end;
      background: #fafafa;
    }
    .btn-del-game { background: none; border: none; color: #a4b0be; font-size: 0.9rem; cursor: pointer; padding: 4px; }
    .btn-del-game:hover { color: #ff4757; }

    /* 오늘 경기 카드 */
    .today-card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .today-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #f1f2f6;
    }
    .today-date-badge { font-size: 0.85rem; font-weight: 800; color: var(--kt-red); }
    .today-time-badge { font-size: 0.78rem; font-weight: 700; color: var(--text-sub); }
    .today-matchup { display: flex; justify-content: space-around; align-items: center; margin: 12px 0 16px; }
    .today-team { font-size: 1.2rem; font-weight: 900; }
    .today-team.kt { color: var(--kt-red); }
    .today-vs { font-size: 1.3rem; font-weight: 900; color: #57606f; }

    .lineup-box { background: #f8f9fa; border-radius: 14px; padding: 14px; }
    .lineup-title { font-size: 0.85rem; font-weight: 800; color: #57606f; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .pitcher-tag { background: #eef2ff; color: #4338ca; padding: 3px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; }
    .lineup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .lineup-item { background: white; border: 1px solid #eef0f4; border-radius: 8px; padding: 7px 6px; font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center; }
    .order-num { font-weight: 900; color: var(--kt-red); margin-right: 4px; }
    .player-name { font-weight: 700; color: #2f3542; }
    .player-pos { font-size: 0.7rem; color: var(--text-sub); }

    /* 순위 & 기록 테이블 */
    .table-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    .custom-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.82rem; }
    .custom-table th { padding: 10px 4px; font-weight: 800; color: var(--text-sub); border-bottom: 1.5px solid #eef0f4; }
    .custom-table td { padding: 11px 4px; font-weight: 700; border-bottom: 1px solid #f8f9fa; color: #2f3542; }
    .custom-table tr.kt-row { background: #fff0f3; font-weight: 900; color: var(--kt-red); }
    .custom-table tr.kt-row td { color: var(--kt-red); }

    .sub-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .sub-tab-btn { flex: 1; padding: 8px; border: 1px solid var(--border); background: #f8f9fa; border-radius: 10px; font-size: 0.82rem; font-weight: 800; cursor: pointer; color: #57606f; }
    .sub-tab-btn.active { background: #2f3542; color: white; border-color: #2f3542; }

    /* FAB & Modal */
    .fab {
      position: fixed; right: 20px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
      background: var(--kt-red); color: white; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; box-shadow: 0 8px 24px rgba(234, 32, 39, 0.4); cursor: pointer; border: none; z-index: 50;
    }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: white; border-radius: 24px; width: 100%; max-width: 400px; padding: 22px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 0.95rem; font-weight: 700; outline: none; }
    .btn { flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; }
    .btn-primary { background: var(--kt-red); color: white; }
    .btn-secondary { background: #f1f2f6; color: #57606f; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <a href="index.html" class="btn-home" title="홈으로"><i class="fa-solid fa-house"></i></a>
        <div>
          <div class="header-title">위즈파크 직관 일기 ⚾</div>
          <p style="font-size: 0.78rem; opacity: 0.9; margin-top: 2px;">뚜쫑 커플의 kt wiz 직관 승률 🔥</p>
        </div>
      </div>
    </div>
  </header>

  <!-- 4대 메인 탭 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tab-diary', this)"><i class="fa-solid fa-ticket"></i> 직관기록</button>
    <button class="tab-btn" onclick="switchTab('tab-today', this)"><i class="fa-solid fa-calendar-day"></i> 오늘경기</button>
    <button class="tab-btn" onclick="switchTab('tab-rank', this)"><i class="fa-solid fa-ranking-star"></i> 리그순위</button>
    <button class="tab-btn" onclick="switchTab('tab-player', this)"><i class="fa-solid fa-users"></i> 선수기록</button>
  </div>

  <div class="container">
    <!-- 탭 1: 직관 다이어리 -->
    <div id="tab-diary" class="tab-content active">
      <div class="dashboard-card">
        <div class="dash-top">
          <div class="dash-title"><i class="fa-solid fa-trophy" style="color:#ffa502;"></i> 직관 전적 요약</div>
          <div class="win-rate-pill" id="badgeFairy">✨ 승리 요정</div>
        </div>
        <div class="dash-stats-row">
          <div class="stat-box"><span class="stat-label">직관</span><span class="stat-val" id="statTotal">0회</span></div>
          <div class="stat-box"><span class="stat-label">승/무/패</span><span class="stat-val" style="font-size:1rem;" id="statRecord">0승 0패</span></div>
          <div class="stat-box"><span class="stat-label">승률</span><span class="stat-val rate" id="statWinRate">0%</span></div>

          <span class="today-date-badge" id="todayDateTxt">📅 오늘 경기 일정</span>
          <span class="today-time-badge" id="todayStadiumTxt">-</span>
        </div>
        <div class="today-matchup">
          <span class="today-team kt">kt wiz</span>
          <span class="today-vs" id="todayScoreOrVs">VS</span>

        <div class="lineup-box">
          <div class="lineup-title">
            <span>📋 선발 타순 (1~9번)</span>
            <span class="pitcher-tag" id="todayPitcherTxt">선발: -</span>
          </div>
          <div class="lineup-grid" id="todayLineupGrid">
            <div style="grid-column: span 3; text-align: center; color: var(--text-sub); font-size: 0.8rem; padding: 10px 0;">
              경기 1~2시간 전 라인업이 자동 등록됩니다.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 탭 3: KBO 리그 순위 -->
    <div id="tab-rank" class="tab-content">
      <div class="table-card">
        <table class="custom-table">
          <thead>
            <tr>
              <th>순위</th><th>구단</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>승률</th><th>게임차</th>

          <button class="sub-tab-btn" id="btnTabPitcher" onclick="switchPlayerCategory('pitcher')">🔥 투수 기록</button>

          <table class="custom-table">
            <thead>
              <tr><th>선수</th><th>평자책</th><th>승</th><th>패</th><th>세이브</th><th>탈삼진</th></tr>
            </thead>
            <tbody id="pitcherTableBody">
              <tr><td colspan="6" style="padding:20px 0;">투수 기록 로딩 중...</td></tr>
            </tbody>
          </table>

  <!-- 직관 경기 추가 모달 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 style="font-size:1.2rem; font-weight:800; margin-bottom:14px;">⚾ 직관 날짜 선택</h3>
      <div class="form-group">
        <label>경기 날짜</label>
        <input type="date" class="form-control" id="gameDate" onchange="matchKtGame(this.value)">
      </div>
      <div style="background:#f8f9fc; border:1px dashed #dcdde1; border-radius:12px; padding:12px; margin-bottom:16px; font-size:0.88rem; display:flex; flex-direction:column; gap:6px;">
        <div style="display:flex; justify-content:space-between; font-weight:700;"><span style="color:var(--text-sub);">상대팀</span><span id="txtOpponent">-</span></div>
        <div style="display:flex; justify-content:space-between; font-weight:700;"><span style="color:var(--text-sub);">결과</span><span id="txtResult" style="color:var(--kt-red);">-</span></div>
        <div style="display:flex; justify-content:space-between; font-weight:700;"><span style="color:var(--text-sub);">구장</span><span id="txtStadium" style="color:#57606f;">-</span></div>
      </div>
      <input type="hidden" id="autoOpponent"><input type="hidden" id="autoResult"><input type="hidden" id="autoScore"><input type="hidden" id="autoStadium">
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveGame()">기록 추가</button>
      </div>
    </div>
  </div>

  <script>
    const teamFullMap = {
      'LG': 'LG 트윈스', 'SSG': 'SSG 랜더스', '두산': '두산 베어스', 'KIA': 'KIA 타이거즈',
      '삼성': '삼성 라이온즈', '롯데': '롯데 자이언츠', '한화': '한화 이글스', 'NC': 'NC 다이노스', '키움': '키움 히어로즈', 'KT': 'kt wiz'
    };

    function normalizeTeam(name) {
      if (!name) return '상대팀';
      for (const [k, v] of Object.entries(teamFullMap)) {
        if (name.includes(k)) return v;
      }
      return name;
    }

    function normalizeScore(score, oppName) {
      if (!score) return 'VS';
      if (score.includes('KT') || score.includes('VS') || score.includes('취소')) return score;
      // '5 : 4' 처럼 숫자만 있는 경우
      const parts = score.split(':').map(s => s.trim());
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return `KT ${parts[0]} : ${parts[1]} ${normalizeTeam(oppName).split(' ')[0]}`;
      }
      return score;
    }

    function normalizeStadium(stadium) {
      if (!stadium || stadium === '수원') return '수원 위즈파크 (홈)';
      return stadium;
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const baseballCollection = db.collection("couple_space").doc("data").collection("baseball_games");

    let gameList = [];
    let serverKboData = {};

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function switchPlayerCategory(type) {
      const isHitter = type === 'hitter';
      document.getElementById('btnTabHitter').classList.toggle('active', isHitter);
      document.getElementById('btnTabPitcher').classList.toggle('active', !isHitter);
      document.getElementById('hitterTableBox').style.display = isHitter ? 'block' : 'none';
      document.getElementById('pitcherTableBox').style.display = isHitter ? 'none' : 'block';
    }

    async function loadKboJson() {
      try {
        const res = await fetch('./ktwiz_data.json?t=' + Date.now());
        if (res.ok) {
          serverKboData = await res.json();
          renderTodayMatch(serverKboData.todayMatch, serverKboData.todayLineup);
          renderRankings(serverKboData.rankings);
          renderPlayerStats(serverKboData.playerStats);
        }
      } catch(e){ console.warn("JSON 로드 대기"); }
    }
    loadKboJson();

    function renderTodayMatch(todayMatch, todayLineup) {
      if (!todayMatch) {
        document.getElementById('todayDateTxt').innerText = '📅 오늘 경기 일정 없음';
        document.getElementById('todayStadiumTxt').innerText = '휴식일 🏖️';
        document.getElementById('todayScoreOrVs').innerText = '-';
        document.getElementById('todayOpponentTxt').innerText = '-';
        return;
      }
      document.getElementById('todayDateTxt').innerText = `📅 ${todayMatch.date} (${todayMatch.time || '18:30'})`;
      document.getElementById('todayStadiumTxt').innerText = `📍 ${normalizeStadium(todayMatch.stadium)}`;
      document.getElementById('todayScoreOrVs').innerText = todayMatch.score;
      document.getElementById('todayOpponentTxt').innerText = normalizeTeam(todayMatch.opponent);

      if (todayLineup) {
        document.getElementById('todayPitcherTxt').innerText = `선발: ${todayLineup.pitcher || '미발표'}`;
        const grid = document.getElementById('todayLineupGrid');
        if (todayLineup.batters && todayLineup.batters.length > 0) {
          grid.innerHTML = todayLineup.batters.map(b => `
            <div class="lineup-item">
              <div><span class="order-num">${b.order}</span><span class="player-name">${b.name}</span></div>
              <span class="player-pos">${b.pos}</span>
            </div>
          `).join('');
        }
      }
    }

    function renderRankings(rankings) {
      const tbody = document.getElementById('rankingTableBody');
      if (!rankings || rankings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="padding:20px 0;">순위 데이터를 불러오는 중...</td></tr>`;
        return;
      }
      tbody.innerHTML = rankings.map(r => `
        <tr class="${r.teamName && (r.teamName.includes('KT') || r.teamName.includes('kt')) ? 'kt-row' : ''}">
          <td><b>${r.rank}</b></td>
          <td>${r.teamName}</td>
          <td>${r.games}</td>
          <td>${r.win}</td>
          <td>${r.draw || 0}</td>
          <td>${r.lose}</td>
          <td>${r.wra}</td>
          <td>${r.gameDiff}</td>
        </tr>
      `).join('');
    }

    function renderPlayerStats(stats) {
      if (!stats) return;
      const hBody = document.getElementById('hitterTableBody');
      if (stats.batters && stats.batters.length > 0) {
        hBody.innerHTML = stats.batters.map(b => `
          <tr>
            <td><b>${b.name}</b></td><td>${b.hra}</td><td>${b.hit}</td><td>${b.hr}</td><td>${b.rbi}</td><td>${b.ops}</td>
          </tr>
        `).join('');
      } else {
        hBody.innerHTML = `<tr><td colspan="6" style="padding:20px 0;">타자 기록이 없습니다.</td></tr>`;
      }

      const pBody = document.getElementById('pitcherTableBody');
      if (stats.pitchers && stats.pitchers.length > 0) {
        pBody.innerHTML = stats.pitchers.map(p => `
          <tr>
            <td><b>${p.name}</b></td><td>${p.era}</td><td>${p.win}</td><td>${p.lose}</td><td>${p.save}</td><td>${p.so}</td>
          </tr>
        `).join('');
      } else {
        pBody.innerHTML = `<tr><td colspan="6" style="padding:20px 0;">투수 기록이 없습니다.</td></tr>`;
      }
    }

    baseballCollection.onSnapshot((snapshot) => {
      const list = [];
      snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
      gameList = list;
      updateDashboard();
      renderGames();
    });

    function updateDashboard() {
      const completedGames = gameList.filter(g => g.result === 'win' || g.result === 'lose' || g.result === 'draw');
      const wins = gameList.filter(g => g.result === 'win').length;
      const loses = gameList.filter(g => g.result === 'lose').length;
      const draws = gameList.filter(g => g.result === 'draw').length;
      const winRate = (wins + loses) > 0 ? Math.round((wins / (wins + loses)) * 100) : 0;

      document.getElementById('statTotal').innerText = `${gameList.length}회`;
      document.getElementById('statRecord').innerText = `${wins}승 ${draws ? draws + '무 ' : ''}${loses}패`;
      document.getElementById('statWinRate').innerText = `${winRate}%`;

      let streak = 0;
      const sorted = [...completedGames].sort((a, b) => new Date(b.date) - new Date(a.date));
      for (let g of sorted) {
        if (g.result === 'win') streak++; else break;
      }
      document.getElementById('statStreak').innerText = `${streak}연승`;

      const commentEl = document.getElementById('fairyCommentText');
      const badgeEl = document.getElementById('badgeFairy');
      if (gameList.length === 0) {
        commentEl.innerText = "직관 날짜를 등록해보세요! 🧙‍♂️⚾";
        badgeEl.innerText = "✨ 첫 직관 대기";
      } else if (winRate >= 70) {
        commentEl.innerText = `승률 ${winRate}%! 뚜쫑은 kt wiz의 절대적인 승리요정 🧚💖`;
        badgeEl.innerText = "🔥 승리 요정";
      } else if (winRate >= 50) {
        commentEl.innerText = `오늘도 승리의 함성을 함께 질러봐요! ⚡`;
        badgeEl.innerText = "⚾ 든든한 위즈팬";
      } else {
        commentEl.innerText = "다음 경기엔 반드시 승리한다! kt wiz 파이팅! 🔥";
        badgeEl.innerText = "✨ 열혈 응원단";
      }
    }

    function renderGames() {
      const container = document.getElementById('gameListContainer');
      let list = [...gameList].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

      if (list.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px 10px; color:#a4b0be; font-size:0.9rem; font-weight:800;">등록된 직관 기록이 없습니다. + 버튼을 눌러 추가해보세요!</div>`;
        return;
      }

      const resText = { win: 'WIN 🔴', lose: 'LOSE ⚫', draw: 'DRAW 🟡', scheduled: '직관 예정 ⚪', canceled: '취소 🌧️' };
      container.innerHTML = list.map(g => {
        const fullOpponent = normalizeTeam(g.opponent);
        const formattedScore = normalizeScore(g.score, fullOpponent);
        const formattedStadium = normalizeStadium(g.stadium);

        return `
          <div class="game-card">
            <div class="game-card-header">
              <span class="game-date">📅 ${g.date}</span>
              <span class="game-result-badge ${g.result || 'scheduled'}">${resText[g.result] || '예정'}</span>
            </div>
            <div class="game-card-body">
              <div class="matchup-box">
                <div class="team-col"><span class="team-name kt">kt wiz</span></div>
                <span class="score-text">${formattedScore}</span>
                <div class="team-col"><span class="team-name">${fullOpponent}</span></div>
              </div>
              <div class="game-stadium-tag">📍 ${formattedStadium}</div>
            </div>
            <div class="game-card-footer">
              <button class="btn-del-game" onclick="deleteGame('${g.id}')"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }

    function matchKtGame(dateStr) {
      if (!dateStr || !serverKboData.schedule) return;
      const gameInfo = serverKboData.schedule[dateStr];
      if (gameInfo) {
        document.getElementById('autoOpponent').value = gameInfo.opponent;
        document.getElementById('autoResult').value = gameInfo.result;
        document.getElementById('autoScore').value = gameInfo.score;
        document.getElementById('autoStadium').value = gameInfo.stadium;

        const resLabels = { win: '🔴 승리', lose: '⚫ 패배', draw: '🟡 무승부', scheduled: '⚪ 직관 예정', canceled: '🌧️ 취소' };
        document.getElementById('txtOpponent').innerText = `${normalizeTeam(gameInfo.opponent)} (${gameInfo.isHome ? '홈' : '원정'})`;
        document.getElementById('txtResult').innerText = resLabels[gameInfo.result] || '⚪ 직관 예정';
        document.getElementById('txtStadium').innerText = normalizeStadium(gameInfo.stadium);
      } else {
        document.getElementById('autoOpponent').value = '';
        document.getElementById('txtOpponent').innerText = '공식 경기 없음';
        document.getElementById('txtResult').innerText = '-';
        document.getElementById('txtStadium').innerText = '-';
      }
    }

    function saveGame() {
      const date = document.getElementById('gameDate').value;
      const opponent = document.getElementById('autoOpponent').value;
      const result = document.getElementById('autoResult').value;
      const score = document.getElementById('autoScore').value;
      const stadium = document.getElementById('autoStadium').value;
      if (!date) return alert('경기 날짜를 선택해주세요!');
      if (!opponent) return alert('해당 날짜에는 kt wiz 공식 경기가 없습니다.');

      baseballCollection.doc(String(Date.now())).set({
        date, opponent, result, score, stadium, createdAt: Date.now()
      }).then(() => closeModal());
    }

    function deleteGame(id) {
      if (confirm('이 직관 기록을 삭제할까요?')) baseballCollection.doc(id).delete();
    }

    function openAddModal() {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('gameDate').value = todayStr;
      document.getElementById('addModal').classList.add('active');
      matchKtGame(todayStr);
    }
    function closeModal() { document.getElementById('addModal').classList.remove('active'); }
  </script>
</body>
</html>
