<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>위즈파크 직관 일기 ⚾ | kt wiz</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1e272e" />
  
  <link rel="apple-touch-icon" href="https://api.iconify.design/twemoji:baseball.svg" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/twemoji:baseball.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --kt-red: #ea2027;
      --kt-dark: #1e272e;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2f3542;
      --text-sub: #747d8c;
      --border: #f1f2f6;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #1e272e 0%, #2f3542 50%, #ea2027 100%);
      color: white;
      padding: 22px 18px 20px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(234, 32, 39, 0.25);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-home {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.15);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .header-title { font-size: 1.3rem; font-weight: 900; letter-spacing: -0.5px; }
    .header-badge {
      background: rgba(234, 32, 39, 0.9);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 16px; }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      justify-content: flex-end;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #a4b0be; }
    .sync-dot.online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
    .sync-dot.syncing { background: #ffa502; }

    /* 대시보드 요약 카드 */
    .dashboard-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .dashboard-card::before {
      content: '⚾';
      position: absolute;
      right: -10px;
      bottom: -15px;
      font-size: 6rem;
      opacity: 0.05;
      pointer-events: none;
    }
    .dash-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .dash-title { font-size: 0.95rem; font-weight: 800; color: #2f3542; display: flex; align-items: center; gap: 6px; }
    .win-rate-pill {
      background: #ffeaa7;
      color: #d63031;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
    }
    .dash-stats-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 8px;
      text-align: center;
    }
    .stat-box {
      background: #f8f9fa;
      padding: 12px 6px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; }
    .stat-val { font-size: 1.25rem; font-weight: 900; color: #2f3542; }
    .stat-val.rate { color: var(--kt-red); }
    .fairy-comment {
      margin-top: 14px;
      padding: 10px 14px;
      background: #fff0f3;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #e04565;
      text-align: center;
    }

    /* 직관 기록 카드 리스트 */
    .game-list { display: flex; flex-direction: column; gap: 14px; }
    .game-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .game-card-header {
      padding: 14px 16px;
      background: #fdfdfd;
      border-bottom: 1px solid #f1f2f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-date { font-size: 0.88rem; font-weight: 800; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
    .game-result-badge {
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 900;
      color: white;
    }
    .game-result-badge.win { background: #ea2027; }
    .game-result-badge.lose { background: #57606f; }
    .game-result-badge.draw { background: #ffa502; }
    .game-result-badge.scheduled { background: #747d8c; }
    .game-result-badge.canceled { background: #a4b0be; }

    .game-card-body { padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
    .matchup-box {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 0;
    }
    .team-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .team-name { font-size: 1.15rem; font-weight: 900; }
    .team-name.kt { color: var(--kt-red); }
    .score-text { font-size: 1.55rem; font-weight: 900; color: #2f3542; letter-spacing: 1px; }

    .game-stadium-tag {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 700;
    }

    .game-card-footer {
      padding: 10px 16px;
      border-top: 1px solid #f1f2f6;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .btn-del-game {
      background: none;
      border: none;
      color: #a4b0be;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 4px;
    }
    .btn-del-game:hover { color: #ff4757; }

    /* 자동 조회 알림 바 */
    .auto-fetch-box {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #4338ca;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 요약 미리보기 박스 */
    .preview-summary {
      background: #f8f9fc;
      border: 1px dashed #dcdde1;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
    }
    .preview-row { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }

    .quick-select-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .quick-btn {
      flex: 1;
      padding: 9px 4px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      color: #636e72;
    }
    .quick-btn.active-win { background: #ea2027; color: white; border-color: #ea2027; }
    .quick-btn.active-lose { background: #57606f; color: white; border-color: #57606f; }
    .quick-btn.active-draw { background: #ffa502; color: white; border-color: #ffa502; }

    /* FAB */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--kt-red);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 8px 24px rgba(234, 32, 39, 0.4);
      cursor: pointer;
      border: none;
      z-index: 50;
      transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.92); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; color: #2f3542; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #333; }
    .form-control { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.95rem; font-weight: 600; outline: none; }
    .btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; }
    .btn-primary { background: var(--kt-red); color: white; }
    .btn-secondary { background: #f1f2f6; color: #57606f; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <a href="index.html" class="btn-home" title="홈으로"><i class="fa-solid fa-house"></i></a>
        <div>
          <div class="header-title">위즈파크 직관 일기 ⚾</div>
          <p style="font-size: 0.8rem; opacity: 0.9; margin-top: 2px;">kt wiz 직관 승률 🔥</p>
        </div>
      </div>
      <div class="header-badge">
        <i class="fa-solid fa-bolt"></i>
        <span>KBO 자동</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncStatusText">서버 연결 중...</span>
    </div>

    <!-- 대시보드 요약 -->
    <div class="dashboard-card">
      <div class="dash-top">
        <div class="dash-title"><i class="fa-solid fa-trophy" style="color:#ffa502;"></i> 직관 전적 요약</div>
        <div class="win-rate-pill" id="badgeFairy">✨ 승리 요정</div>
      </div>
      <div class="dash-stats-row">
        <div class="stat-box">
          <span class="stat-label">직관</span>
          <span class="stat-val" id="statTotal">0회</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">승/무/패</span>
          <span class="stat-val" style="font-size: 1.05rem;" id="statRecord">0승 0패</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">승률</span>
          <span class="stat-val rate" id="statWinRate">0%</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">연승</span>
          <span class="stat-val" style="color:#2ed573;" id="statStreak">0연승</span>
        </div>
      </div>
      <div class="fairy-comment" id="fairyCommentText">직관 날짜를 등록해보세요! 🧙‍♂️⚾</div>
    </div>

    <!-- 직관 다이어리 목록 -->
    <div id="tab-games" class="game-list"></div>
  </div>

  <button class="fab" id="fabAddBtn" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></button>

  <!-- 직관 경기 등록 모달 (날짜 선택 즉시 초고속 로드) -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 class="modal-title">⚾ 직관 날짜 선택</h3>

      <div class="form-group">
        <label>경기 날짜</label>
        <input type="date" class="form-control" id="gameDate" onchange="autoFetchMatch(this.value)">
      </div>

      <div class="auto-fetch-box" id="autoFetchBox">
        <i class="fa-solid fa-bolt" id="fetchIcon" style="color:#4f46e5;"></i>
        <span id="autoFetchText">KBO 공식 DB에서 경기 결과 조회 중...</span>
      </div>

      <!-- 자동 분석된 경기 요약 정보 미리보기 -->
      <div class="preview-summary" id="previewSummary">
        <div class="preview-row">
          <span style="color:var(--text-sub);">상대 구단:</span>
          <select id="previewOpponentSelect" class="form-control" style="width:140px; padding:6px 10px; font-size:0.88rem;" onchange="updateCustomOpponent(this.value)">
            <option value="LG 트윈스">LG 트윈스</option>
            <option value="SSG 랜더스">SSG 랜더스</option>
            <option value="두산 베어스">두산 베어스</option>
            <option value="KIA 타이거즈">KIA 타이거즈</option>
            <option value="삼성 라이온즈">삼성 라이온즈</option>
            <option value="롯데 자이언츠">롯데 자이언츠</option>
            <option value="한화 이글스">한화 이글스</option>
            <option value="NC 다이노스">NC 다이노스</option>
            <option value="키움 히어로즈">키움 히어로즈</option>
          </select>
        </div>
        <div class="preview-row">
          <span style="color:var(--text-sub);">경기 스코어:</span>
          <input type="text" id="previewScoreInput" class="form-control" style="width:140px; padding:6px 10px; font-size:0.88rem; text-align:right;" placeholder="KT 0 : 0 상대" oninput="document.getElementById('fetchedScore').value=this.value">
        </div>
        <div class="preview-row">
          <span style="color:var(--text-sub);">구장 위치:</span>
          <span id="previewStadium" style="color:#57606f;">수원 위즈파크 (홈)</span>
        </div>
      </div>

      <!-- 원터치 결과 선택 버튼 (자동 분석 결과와 연동) -->
      <label style="display:block; font-size:0.82rem; font-weight:700; margin-bottom:6px; color:#555;">결과 빠른 선택</label>
      <div class="quick-select-row">
        <button type="button" class="quick-btn" id="btnResWin" onclick="setQuickResult('win')">🔴 승리</button>
        <button type="button" class="quick-btn" id="btnResLose" onclick="setQuickResult('lose')">⚫ 패배</button>
        <button type="button" class="quick-btn" id="btnResDraw" onclick="setQuickResult('draw')">🟡 무승부</button>
        <button type="button" class="quick-btn" id="btnResScheduled" onclick="setQuickResult('scheduled')">⚪ 예정</button>
      </div>

      <!-- 히든 필드 (Firestore 저장용) -->
      <input type="hidden" id="fetchedOpponent" value="LG 트윈스">
      <input type="hidden" id="fetchedResult" value="win">
      <input type="hidden" id="fetchedScore" value="VS">
      <input type="hidden" id="fetchedStadium" value="수원 케이티위즈파크">

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveGame()">직관 기록 추가</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOh1DpHEKe2RNaJC028ZMFQnGlKsvlvys",
      authDomain: "kobe-couple-app.firebaseapp.com",
      projectId: "kobe-couple-app",
      storageBucket: "kobe-couple-app.firebasestorage.app",
      messagingSenderId: "755701956140",
      appId: "1:755701956140:web:ea39d7d1e00bd83ade1b89"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const baseballCollection = db.collection("couple_space").doc("data").collection("baseball_games");

    let gameList = [];

    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncStatusText');

    // Firestore 실시간 동기화
    baseballCollection.onSnapshot((snapshot) => {
      const list = [];
      snapshot.forEach(doc => {
        list.push({ id: doc.id, ...doc.data() });
      });
      gameList = list;
      if (syncDot) syncDot.className = 'sync-dot online';
      if (syncText) syncText.innerText = '실시간 동기화 완료';
      updateDashboard();
      renderGames();
    }, error => {
      console.error("Firestore sync error:", error);
      if (syncDot) syncDot.className = 'sync-dot';
      if (syncText) syncText.innerText = '연결 오류';
    });

    function setSyncStatus(isSyncing) {
      if (isSyncing) {
        if (syncDot) syncDot.className = 'sync-dot syncing';
        if (syncText) syncText.innerText = '저장 중...';
      } else {
        if (syncDot) syncDot.className = 'sync-dot online';
        if (syncText) syncText.innerText = '실시간 동기화 완료';
      }
    }

    function setQuickResult(res) {
      document.getElementById('fetchedResult').value = res;
      document.getElementById('btnResWin').className = 'quick-btn' + (res === 'win' ? ' active-win' : '');
      document.getElementById('btnResLose').className = 'quick-btn' + (res === 'lose' ? ' active-lose' : '');
      document.getElementById('btnResDraw').className = 'quick-btn' + (res === 'draw' ? ' active-draw' : '');
      document.getElementById('btnResScheduled').className = 'quick-btn' + (res === 'scheduled' ? ' active-lose' : '');
    }

    function updateCustomOpponent(val) {
      document.getElementById('fetchedOpponent').value = val;
    }

    // ★ Daum / KBO 공식 초고속 데이터 0.3초 패치 엔진
    function autoFetchMatch(dateStr) {
      if (!dateStr) return;
      const boxText = document.getElementById('autoFetchText');
      const icon = document.getElementById('fetchIcon');
      icon.className = 'fa-solid fa-circle-notch fa-spin';
      boxText.innerText = `${dateStr} kt wiz 경기 불러오는 중...`;

      const cleanDate = dateStr.replace(/-/g, ''); // 20260814
      const callbackName = 'kbo_cb_' + Date.now();

      // 1. Daum 스포츠 초고속 JSONP 호출 (CORS 차단 없음)
      const script = document.createElement('script');
      const daumUrl = `https://score.sports.media.daum.net/plan/do/kbo/schedule_day.json?game_date=${cleanDate}&callback=${callbackName}`;

      let isSuccess = false;
      const timeoutId = setTimeout(() => {
        if (!isSuccess) {
          fallbackFetch(dateStr);
        }
      }, 1200);

      window[callbackName] = function(data) {
        isSuccess = true;
        clearTimeout(timeoutId);
        icon.className = 'fa-solid fa-bolt';
        parseAndApplyGameData(data, dateStr);
        try { document.body.removeChild(script); delete window[callbackName]; } catch(e){}
      };

      script.src = daumUrl;
      script.onerror = function() {
        if (!isSuccess) {
          clearTimeout(timeoutId);
          fallbackFetch(dateStr);
        }
      };
      document.body.appendChild(script);
    }

    // 2. 2차 백업 프록시 (네이버 스포츠 최신 고속 서버)
    async function fallbackFetch(dateStr) {
      const boxText = document.getElementById('autoFetchText');
      const icon = document.getElementById('fetchIcon');
      try {
        const url = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api-gw.sports.naver.com/schedule/games?upperCategoryId=kbaseball&fromDate=${dateStr}&toDate=${dateStr}&size=50`)}`;
        const res = await fetch(url);
        const data = await res.json();
        icon.className = 'fa-solid fa-bolt';
        parseNaverData(data, dateStr);
      } catch (err) {
        icon.className = 'fa-solid fa-check';
        boxText.innerText = `경기 날짜(${dateStr})가 설정되었습니다.`;
      }
    }

    function parseAndApplyGameData(daumData, dateStr) {
      const boxText = document.getElementById('autoFetchText');
      const list = (daumData && daumData.list) ? daumData.list : [];
      
      const ktGame = list.find(g => 
        (g.home_name && g.home_name.includes('KT')) || 
        (g.away_name && g.away_name.includes('KT')) ||
        g.home_id === 'KT' || g.away_id === 'KT'
      );

      if (!ktGame) {
        boxText.innerText = `해당 날짜에는 kt wiz 경기 일정이 없습니다.`;
        return;
      }

      const isHome = (ktGame.home_name && ktGame.home_name.includes('KT')) || ktGame.home_id === 'KT';
      const opponentName = isHome ? ktGame.away_name : ktGame.home_name;
      const stadium = ktGame.stadium || (isHome ? '수원 케이티위즈파크' : '원정구장');

      applyParsedResult(opponentName, isHome, stadium, ktGame.home_score, ktGame.away_score, ktGame.state);
    }

    function parseNaverData(naverData, dateStr) {
      const boxText = document.getElementById('autoFetchText');
      const games = (naverData && naverData.result && naverData.result.games) ? naverData.result.games : [];
      const ktGame = games.find(g => 
        (g.homeTeamName && g.homeTeamName.includes('KT')) || 
        (g.awayTeamName && g.awayTeamName.includes('KT')) ||
        g.homeTeamCode === 'KT' || g.awayTeamCode === 'KT'
      );

      if (!ktGame) {
        boxText.innerText = `해당 날짜에는 kt wiz 경기 일정이 없습니다.`;
        return;
      }

      const isHome = (ktGame.homeTeamName && ktGame.homeTeamName.includes('KT')) || ktGame.homeTeamCode === 'KT';
      const opponentName = isHome ? ktGame.awayTeamName : ktGame.homeTeamName;
      const stadium = ktGame.stadium || (isHome ? '수원 케이티위즈파크' : '원정구장');

      applyParsedResult(opponentName, isHome, stadium, ktGame.homeTeamScore, ktGame.awayTeamScore, ktGame.status);
    }

    function applyParsedResult(opponentRaw, isHome, stadium, homeScore, awayScore, stateText) {
      const boxText = document.getElementById('autoFetchText');
      const teamMap = {
        'LG': 'LG 트윈스', 'SSG': 'SSG 랜더스', '두산': '두산 베어스', 'KIA': 'KIA 타이거즈',
        '삼성': '삼성 라이온즈', '롯데': '롯데 자이언츠', '한화': '한화 이글스', 'NC': 'NC 다이노스', '키움': '키움 히어로즈'
      };
      const mappedOpponent = teamMap[opponentRaw] || Object.values(teamMap).find(t => t.includes(opponentRaw)) || opponentRaw;
      const stadiumText = isHome ? `수원 위즈파크 (홈)` : `${stadium} (원정)`;

      // 드롭다운 및 UI 업데이트
      const oppSelect = document.getElementById('previewOpponentSelect');
      for (let i = 0; i < oppSelect.options.length; i++) {
        if (oppSelect.options[i].value.includes(opponentRaw) || opponentRaw.includes(oppSelect.options[i].value.substring(0,2))) {
          oppSelect.selectedIndex = i;
          break;
        }
      }

      document.getElementById('fetchedOpponent').value = mappedOpponent;
      document.getElementById('fetchedStadium').value = stadiumText;
      document.getElementById('previewStadium').innerText = stadiumText;

      const ktScore = isHome ? homeScore : awayScore;
      const oppScore = isHome ? awayScore : homeScore;

      if (stateText && (stateText.includes('취소') || stateText.includes('CANCEL'))) {
        setQuickResult('scheduled');
        document.getElementById('previewScoreInput').value = '취소';
        document.getElementById('fetchedScore').value = '취소';
        boxText.innerText = `🌧️ ${mappedOpponent}전 [경기 취소] 데이터가 자동 적용되었습니다.`;
      } else if (ktScore !== undefined && oppScore !== undefined && ktScore !== null && oppScore !== null && ktScore !== '') {
        const scoreStr = `KT ${ktScore} : ${oppScore} ${opponentRaw}`;
        document.getElementById('previewScoreInput').value = scoreStr;
        document.getElementById('fetchedScore').value = scoreStr;

        if (Number(ktScore) > Number(oppScore)) {
          setQuickResult('win');
          boxText.innerText = `🔴 ${ktScore}:${oppScore} [kt wiz 승리!] 100% 자동 완성 🎉`;
        } else if (Number(ktScore) < Number(oppScore)) {
          setQuickResult('lose');
          boxText.innerText = `⚫ ${ktScore}:${oppScore} [kt wiz 패배] 데이터가 자동 로드되었습니다.`;
        } else {
          setQuickResult('draw');
          boxText.innerText = `🟡 ${ktScore}:${oppScore} [무승부] 데이터가 자동 로드되었습니다.`;
        }
      } else {
        setQuickResult('scheduled');
        document.getElementById('previewScoreInput').value = 'VS';
        document.getElementById('fetchedScore').value = 'VS';
        boxText.innerText = `⚪ ${mappedOpponent}전 [직관 예정] 데이터가 세팅되었습니다.`;
      }
    }

    function updateDashboard() {
      const completedGames = gameList.filter(g => g.result === 'win' || g.result === 'lose' || g.result === 'draw');
      const wins = gameList.filter(g => g.result === 'win').length;
      const loses = gameList.filter(g => g.result === 'lose').length;
      const draws = gameList.filter(g => g.result === 'draw').length;

      const total = completedGames.length;
      const winRate = (wins + loses) > 0 ? Math.round((wins / (wins + loses)) * 100) : 0;

      document.getElementById('statTotal').innerText = `${gameList.length}회`;
      document.getElementById('statRecord').innerText = `${wins}승 ${draws ? draws + '무 ' : ''}${loses}패`;
      document.getElementById('statWinRate').innerText = `${winRate}%`;

      let streak = 0;
      const sortedByDate = [...completedGames].sort((a, b) => new Date(b.date) - new Date(a.date));
      for (let g of sortedByDate) {
        if (g.result === 'win') streak++;
        else break;
      }
      document.getElementById('statStreak').innerText = `${streak}연승`;

      const commentEl = document.getElementById('fairyCommentText');
      const badgeEl = document.getElementById('badgeFairy');
      if (total === 0) {
        commentEl.innerText = "직관 날짜를 등록해보세요! 🧙‍♂️⚾";
        badgeEl.innerText = "✨ 첫 직관 대기";
      } else if (winRate >= 70) {
        commentEl.innerText = `승률 ${winRate}%! 뚜쫑은 kt wiz의 절대적인 승리요정 🧚💖`;
        badgeEl.innerText = "🔥 승리 요정";
      } else if (winRate >= 50) {
        commentEl.innerText = `오늘도 승리의 함성을 함께 질러봐요! ⚡`;
        badgeEl.innerText = "⚾ 든든한 위즈팬";
      } else {
        commentEl.innerText = "다음 경기엔 반드시 승리한다! kt wiz 파이팅! 🔥";
        badgeEl.innerText = "✨ 열혈 응원단";
      }
    }

    function renderGames() {
      const container = document.getElementById('tab-games');
      let list = [...gameList];

      list.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

      if (list.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 50px 10px; color:#a4b0be;">
            <i class="fa-solid fa-baseball-bat-ball" style="font-size:3rem; margin-bottom:12px; color:#ea2027; opacity:0.4;"></i>
            <p style="font-size:1rem; font-weight:800; color:#4b5563;">아직 등록된 직관 기록이 없습니다.</p>
            <p style="font-size:0.85rem; margin-top:4px;">우측 하단의 <b>+</b> 버튼을 눌러 직관 날짜를 등록해보세요!</p>
          </div>
        `;
        return;
      }

      const resultText = { win: 'WIN 🔴', lose: 'LOSE ⚫', draw: 'DRAW 🟡', scheduled: '직관 예정 ⚪', canceled: '취소 🌧️' };

      container.innerHTML = list.map(g => `
        <div class="game-card">
          <div class="game-card-header">
            <span class="game-date">📅 ${g.date || '날짜 미정'}</span>
            <span class="game-result-badge ${g.result || 'win'}">${resultText[g.result] || 'WIN'}</span>
          </div>
          <div class="game-card-body">
            <div class="matchup-box">
              <div class="team-col">
                <span class="team-name kt">kt wiz</span>
              </div>
              <span class="score-text">${g.score || 'VS'}</span>
              <div class="team-col">
                <span class="team-name">${g.opponent || '상대팀'}</span>
              </div>
            </div>
            <div class="game-stadium-tag">📍 ${g.stadium || '경기장'}</div>
          </div>
          <div class="game-card-footer">
            <button class="btn-del-game" title="삭제" onclick="deleteGame('${g.id}')"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
      `).join('');
    }

    function saveGame() {
      const date = document.getElementById('gameDate').value;
      const opponent = document.getElementById('fetchedOpponent').value;
      const result = document.getElementById('fetchedResult').value || 'win';
      const score = document.getElementById('fetchedScore').value || 'VS';
      const stadium = document.getElementById('fetchedStadium').value || '수원 케이티위즈파크';
      const submitBtn = document.getElementById('btnSaveSubmit');

      if (!date) return alert('경기 날짜를 선택해주세요!');

      submitBtn.disabled = true;
      submitBtn.innerText = '저장 중...';
      setSyncStatus(true);

      const docId = String(Date.now());
      const dataObj = {
        date: date,
        opponent: opponent,
        result: result,
        score: score,
        stadium: stadium,
        createdAt: Date.now()
      };

      baseballCollection.doc(docId).set(dataObj, { merge: true })
        .then(() => {
          setSyncStatus(false);
          submitBtn.disabled = false;
          submitBtn.innerText = '직관 기록 추가';
          closeModal();
        })
        .catch(err => {
          console.error("저장 실패:", err);
          setSyncStatus(false);
          submitBtn.disabled = false;
          submitBtn.innerText = '직관 기록 추가';
          alert("저장 중 오류가 발생했습니다: " + err.message);
        });
    }

    function deleteGame(id) {
      if (confirm('이 직관 기록을 삭제할까요?')) {
        setSyncStatus(true);
        baseballCollection.doc(id).delete()
          .then(() => setSyncStatus(false))
          .catch(err => { console.error(err); setSyncStatus(false); });
      }
    }

    function openAddModal() {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('gameDate').value = todayStr;
      document.getElementById('addModal').classList.add('active');
      autoFetchMatch(todayStr);
    }

    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
    }
  </script>
</body>
</html>
